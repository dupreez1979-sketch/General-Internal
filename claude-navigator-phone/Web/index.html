<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chief of Staff</title>
<style>
  :root { --ink:#1d1d1f; --muted:#6e7377; --line:#e4e7e9; --bg:#f2f4f5; --win:#fff; --accent:#1B5A68; --warn:#B36E24; --ok:#328276; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f2f2f3; --muted:#9aa0a5; --line:#2c3033; --bg:#1c1e20; --win:#111213; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--win); color:var(--ink); font:16px/1.35 -apple-system, "Helvetica Neue", Arial, sans-serif; overflow:hidden; -webkit-user-select:none; user-select:none; }
  #app { height:100%; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); }
  .top { flex:none; display:flex; align-items:center; gap:10px; padding:8px 16px 6px; min-height:48px; }
  .prof { display:inline-flex; align-items:center; gap:8px; background:var(--bg); border:0; border-radius:999px; padding:8px 14px; font:inherit; font-weight:650; font-size:15px; color:var(--ink); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); flex:none; }
  .grow { flex:1; }
  .ibtn { width:40px; height:40px; border-radius:50%; border:0; background:var(--bg); color:var(--ink); font-size:20px; display:grid; place-items:center; flex:none; }
  h1 { font-size:30px; font-weight:780; letter-spacing:-.02em; margin:2px 16px 10px; }
  .scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 12px 16px; }
  .sec { font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin:18px 6px 7px; }
  .card { display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:0; font:inherit; color:var(--ink); background:var(--bg); border-radius:16px; padding:12px 13px; margin-bottom:8px; min-height:62px; }
  .card:active, .row:active { opacity:.6; }
  .av { width:40px; height:40px; border-radius:50%; color:#fff; font-weight:700; font-size:14px; display:grid; place-items:center; flex:none; background:var(--accent); }
  .card .tx { min-width:0; flex:1; } .card b { display:block; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .s { display:block; font-size:13.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { background:var(--win); border-radius:999px; padding:3px 10px; font-size:13px; font-weight:650; color:var(--accent); flex:none; }
  .card.chief { background:var(--accent); color:#fff; } .card.chief .s { color:rgba(255,255,255,.82); } .card.chief .av { background:rgba(255,255,255,.22); }
  .tabs { flex:none; display:flex; border-top:1px solid var(--line); padding:6px 0 calc(6px + env(safe-area-inset-bottom)); background:var(--win); }
  .tabs button { flex:1; border:0; background:none; font:inherit; font-size:11.5px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 0; }
  .tabs button.on { color:var(--accent); font-weight:700; } .tabs svg { width:24px; height:24px; }
  .ask { flex:none; display:flex; align-items:center; gap:10px; margin:8px 12px 10px; border:0; width:calc(100% - 24px); text-align:left; font:inherit; font-weight:650; font-size:16px; background:var(--accent); color:#fff; border-radius:18px; padding:15px 16px; }
  .ask.last { margin-bottom:calc(10px + env(safe-area-inset-bottom)); }
  .ask .mic { margin-left:auto; opacity:.85; }
  .seg { flex:none; display:flex; background:var(--bg); border-radius:11px; padding:3px; margin:4px 12px 8px; }
  .seg button { flex:1; border:0; background:none; font:inherit; font-size:14px; color:var(--muted); padding:8px 0; border-radius:9px; }
  .seg button.on { background:var(--win); color:var(--ink); font-weight:650; box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .row { display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); background:none; font:inherit; color:var(--ink); padding:13px 6px; min-height:52px; }
  .row .nm { flex:1; min-width:0; } .row .nm span { display:block; font-size:13px; color:var(--muted); }
  .pins { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px 6px; padding:10px 2px 4px; }
  .pin { border:0; background:none; font:inherit; color:var(--muted); font-size:13.5px; display:flex; flex-direction:column; align-items:center; gap:7px; padding:0; min-width:0; }
  .pin .av { width:76px; height:76px; font-size:26px; position:relative; box-shadow:0 6px 16px rgba(0,0,0,.14); }
  .pin .av i { position:absolute; top:-2px; right:-2px; min-width:24px; height:24px; padding:0 6px; border-radius:12px; background:var(--win); color:var(--accent); font-style:normal; font-size:13px; font-weight:700; display:grid; place-items:center; box-shadow:0 1px 4px rgba(0,0,0,.2); }
  .pin > span:last-child { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pin:active { opacity:.6; }
  .ibtn.on { color:#E0A800; }
  .chips { flex:none; display:flex; gap:7px; overflow-x:auto; padding:0 12px 10px; scrollbar-width:none; } .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; display:inline-flex; align-items:center; gap:6px; border:0; background:var(--bg); color:var(--ink); font:inherit; font-size:14px; border-radius:999px; padding:8px 13px; white-space:nowrap; }
  .chip i { font-style:normal; font-size:12.5px; color:var(--muted); } .chip.on { background:var(--accent); color:#fff; font-weight:650; } .chip.on i { color:rgba(255,255,255,.8); } .chip.on .dot { box-shadow:0 0 0 2px rgba(255,255,255,.7); }
  .drivebtn { border:0; background:var(--accent); color:#fff; font:inherit; font-weight:700; font-size:14px; border-radius:999px; padding:9px 16px; }
  .drive { position:fixed; inset:0; z-index:20; background:#0d1417; color:#f4f6f7; display:flex; flex-direction:column; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .dbar { flex:none; display:flex; align-items:center; gap:10px; padding:12px 18px 0; } .dbar b { font-size:18px; } .dprof { background:#18242a; border-radius:999px; padding:5px 12px; font-size:13.5px; font-weight:600; }
  .dend { border:0; background:#18242a; color:#f4f6f7; font:inherit; font-weight:650; border-radius:999px; padding:10px 18px; }
  .dmid { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:10px 22px; }
  .dbig { --d:min(62vw, 46vh); flex:none; width:var(--d); height:var(--d); box-sizing:border-box; overflow:hidden; border-radius:50%; border:0; background:var(--accent); color:#fff; font:inherit; font-weight:750; font-size:clamp(17px, 5vw, 26px); line-height:1.15; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:8%; box-shadow:0 0 0 14px color-mix(in srgb, var(--accent) 30%, transparent), 0 0 0 30px color-mix(in srgb, var(--accent) 14%, transparent); }
  .dbig svg { width:32%; height:auto; }
  .drive.listening .dbig { background:#c4353f; box-shadow:0 0 0 14px rgba(196,53,63,.3), 0 0 0 30px rgba(196,53,63,.14); animation:dpulse 1.2s ease-in-out infinite; }
  .drive.thinking .dbig { background:#3d4a50; box-shadow:0 0 0 14px rgba(61,74,80,.4); animation:dpulse 1.6s ease-in-out infinite; }
  .drive.speaking .dbig { background:#226b4a; box-shadow:0 0 0 14px rgba(34,107,74,.3), 0 0 0 30px rgba(34,107,74,.14); }
  @keyframes dpulse { 50% { transform:scale(1.04); } }
  .dside { text-align:center; min-height:84px; max-width:640px; } .dwho { font-size:13px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:#9fb0b6; margin-bottom:6px; min-height:16px; }
  .dline { font-size:clamp(19px, 5.4vw, 28px); font-weight:650; line-height:1.22; }
  .dfoot { flex:none; display:flex; gap:10px; padding:0 14px 14px; } .dbtn { flex:1; min-width:0; border:0; background:#18242a; color:#f4f6f7; font:inherit; font-weight:650; font-size:16px; border-radius:18px; padding:20px 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .dbtn.stop { background:#3a2326; color:#ffb3b8; } .dbtn:active, .dbig:active { opacity:.7; }
  @media (orientation: landscape) { .dmid { flex-direction:row; gap:6%; padding:0 6%; } .dbig { --d:min(36vw, 60vh); font-size:clamp(14px, 2.3vw, 20px); gap:4px; padding:5%; } .dbig svg { width:24%; } .dmid { padding-top:0; padding-bottom:0; } .dfoot .dbtn { padding:14px 8px; } .dside { text-align:left; flex:1; } }
  .pulltip { position:fixed; top:calc(env(safe-area-inset-top) + 4px); left:50%; transform:translate(-50%, 0); z-index:30; background:var(--ink); color:var(--win); font-size:13px; font-weight:650; border-radius:999px; padding:7px 14px; pointer-events:none; }
  .chk { width:26px; height:26px; border-radius:50%; border:2px solid var(--muted); opacity:.6; flex:none; }
  .row small { color:var(--muted); font-size:12.5px; white-space:nowrap; flex:none; }
  .pill { display:inline-block; font-size:12px; font-weight:650; border-radius:999px; padding:2px 9px; background:color-mix(in srgb, var(--warn) 16%, transparent); color:var(--warn); }
  .pill.ok { background:color-mix(in srgb, var(--ok) 16%, transparent); color:var(--ok); }
  .tcard { background:var(--bg); border-radius:16px; padding:12px 14px; margin-bottom:8px; } .tcard p { margin:6px 0 0; font-size:15px; }
  .empty { text-align:center; color:var(--muted); padding:40px 26px; font-size:15px; } .empty b { display:block; color:var(--ink); font-size:19px; margin-bottom:8px; }
  .empty ol { text-align:left; padding-left:22px; margin:14px 0 18px; } .empty li { margin-bottom:7px; }
  .btn { border:0; background:var(--accent); color:#fff; font:inherit; font-weight:650; border-radius:14px; padding:13px 20px; }
  .who { display:flex; align-items:center; gap:12px; padding:2px 12px 8px; } .who b { font-size:19px; display:block; } .who span { font-size:13.5px; color:var(--muted); }
  .shade { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:9; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--win); border-radius:22px 22px 0 0; padding:10px 12px calc(16px + env(safe-area-inset-bottom)); max-height:70%; overflow-y:auto; }
  .grab { width:40px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 12px; }
  .asof { text-align:center; font-size:12px; color:var(--muted); margin:14px 0 4px; }
</style></head><body><div id="app"></div>
<script>
(() => {
  'use strict';
  const app = document.getElementById('app');
  const send = m => { try { window.webkit.messageHandlers.phone.postMessage(m); return true; } catch (e) { return false; } };
  const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* private */ } } };
  let data = { state: 'loading', profiles: [], teams: {} };
  const ui = { tab: 'team', pid: ls.get('pid') || '', staff: null, seg: 'open', sheet: false };

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const initials = n => (n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
  const when = t => { if (!t) return ''; const d = new Date(t), n = new Date(), days = Math.floor((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
    return days <= 0 ? 'Today' : days === 1 ? 'Yesterday' : days < 7 ? d.toLocaleDateString('en-AU', { weekday: 'short' }) : d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }); };
  // Favourite staff, kept on this phone for each profile: they sit as big circles under the Chief of Staff.
  let pins = {}; try { pins = JSON.parse(ls.get('pins') || '{}') || {}; } catch (e) { pins = {}; }
  const pinned = () => pins[ui.pid] || [];
  const togglePin = id => { const l = pinned().slice(), i = l.indexOf(id); if (i >= 0) l.splice(i, 1); else l.push(id); pins[ui.pid] = l.slice(0, 9); ls.set('pins', JSON.stringify(pins)); render(); };
  const team = () => data.teams[ui.pid] || null;
  const prof = () => data.profiles.find(p => p.id === ui.pid) || null;
  // What you have done here that the Mac has not picked up yet. Shown straight away, and sent to the Mac through iCloud.
  let changes = []; try { changes = JSON.parse(ls.get('changes') || '[]'); } catch (e) { changes = []; }
  const saveChanges = () => { ls.set('changes', JSON.stringify(changes)); send({ do: 'save', json: JSON.stringify({ v: 1, changes }) }); };
  const change = c => { changes.push(Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), at: Date.now(), pid: ui.pid }, c)); saveChanges(); render(); };
  const sameUrl = (a, b) => String(a || '').replace(/[?#].*$/, '').replace(/\/$/, '') === String(b || '').replace(/[?#].*$/, '').replace(/\/$/, '');
  const workOf = id => {
    const w = ((team() || {}).work || {})[id] || { open: [], done: [] };
    let open = w.open.slice(), done = w.done.slice(), outs = w.outs ? w.outs.slice() : null;
    for (const c of changes) {
      if (c.pid !== ui.pid) continue;
      if (c.type === 'chat' && c.staff === id && ![...open, ...done].some(x => sameUrl(x.url, c.url))) open.unshift({ id: 'new-' + c.id, name: c.name, url: c.url, added: c.at, waiting: true });
      if (c.type === 'done') { const i = open.findIndex(x => x.id === c.item); if (i >= 0) { const [x] = open.splice(i, 1); done.unshift(Object.assign({ outputs: [] }, x, { doneAt: c.at, waiting: true })); } }
      if (c.type === 'file' && c.staff === id && outs) outs = outs.map(o => sameUrl(o.url, c.url) && !o.filed.length ? Object.assign({}, o, { filed: [c.folderName || 'a folder'], waiting: true }) : o);
      if (c.type === 'file' && c.staff === id) done = done.map(x => Object.assign({}, x, { outputs: (x.outputs || []).map(o => sameUrl(o.url, c.url) && !o.filed.length ? Object.assign({}, o, { filed: [c.folderName || 'a folder'], waiting: true }) : o) }));
    }
    return { open, done, outs };
  };
  const icon = { team: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9.5" y="3" width="5" height="5" rx="1.4"/><rect x="3" y="16" width="5" height="5" rx="1.4"/><rect x="16" y="16" width="5" height="5" rx="1.4"/><path d="M12 8v4M5.5 16v-4h13v4"/></svg>',
    actions: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l1.6 1.6L8.6 5M4 12.5l1.6 1.6 3-3.1M4.6 18.5h.01M12 6.5h8M12 12.5h8M12 18.5h8"/></svg>',
    today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
    recent: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
    mic: '<svg class="mic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0013 0M12 18v3"/></svg>' };

  // Chatting happens in Claude, inside the app: the page slides up over this one.
  const chat = (url, title) => { if (!url) url = 'https://claude.ai/new'; if (!send({ do: 'chat', url, title: title || 'Claude' })) location.href = url; };
  const askUrl = n => (n && n.project && n.project.url) || 'https://claude.ai/new';

  function topBar(showProfile) {
    const t = el('div', 'top');
    if (showProfile) { const p = prof(); const b = el('button', 'prof'); const d = el('span', 'dot'); if (p && p.color) d.style.background = p.color; b.append(d, document.createTextNode((p ? p.name : 'Choose a profile') + ' ▾')); b.onclick = () => { ui.sheet = true; render(); }; t.append(b); }
    t.append(el('span', 'grow'));
    if (showProfile && team()) { const d = el('button', 'drivebtn', 'Drive'); d.onclick = () => driveStart(); t.append(d); }
    const r = el('button', 'ibtn', '↻'); r.title = 'Refresh'; r.onclick = () => send({ do: 'load' }); t.append(r);
    return t;
  }
  function tabs() {
    const t = el('div', 'tabs');
    for (const [k, label] of [['team', 'Team'], ['actions', 'Actions'], ['today', 'Today'], ['recent', 'Recent']]) { const b = el('button', ui.tab === k ? 'on' : ''); b.innerHTML = icon[k] + '<span></span>'; b.querySelector('span').textContent = label; b.onclick = () => { ui.tab = k; ui.staff = null; render(); }; t.append(b); }
    return t;
  }
  function askBar(n, last) {
    const b = el('button', 'ask' + (last ? ' last' : '')); b.innerHTML = '<span></span>' + icon.mic; b.querySelector('span').textContent = `Ask ${n.chief ? 'your Chief of Staff' : 'the ' + n.name}…`;
    b.onclick = () => { ui.asked = { staff: n.id, pid: ui.pid }; chat(askUrl(n), n.name); }; return b;
  }
  function staffCard(n, chief) {
    const w = workOf(n.id), b = el('button', 'card' + (chief ? ' chief' : ''));
    const av = el('span', 'av', initials(n.name)); if (!chief && n.color) av.style.background = n.color;
    const tx = el('div', 'tx'); tx.append(el('b', '', n.name));
    const need = ((team() || {}).today || []).length;
    tx.append(el('span', 's', chief ? (need ? `${need} thing${need === 1 ? '' : 's'} for you to look at` : 'Nothing needs you right now') : (w.open[0] ? w.open[0].name : n.role || 'No open work')));
    b.append(av, tx); if (!chief && w.open.length) b.append(el('span', 'badge', String(w.open.length)));
    b.onclick = () => { if (chief) { ui.tab = 'today'; } else { ui.staff = n.id; ui.seg = 'open'; } render(); };
    return b;
  }
  function viewTeam() {
    const t = team(), s = el('div', 'scroll');
    if (!t) { s.append(emptyNote('No team in this profile yet', 'Set the team up in Chief of Staff on your Mac. It appears here on its own.')); return [topBar(true), el('h1', '', 'Team'), s, tabs()]; }
    const byId = id => t.nodes.find(x => x.id === id), chief = t.nodes.find(x => x.chief);
    if (chief) s.append(staffCard(chief, true));
    const favs = pinned().map(byId).filter(n => n && n.kind === 'staff' && !n.chief);
    if (favs.length) {
      const row = el('div', 'pins');
      for (const n of favs) {
        const w = workOf(n.id), b = el('button', 'pin'), av = el('span', 'av', initials(n.name)); if (n.color) av.style.background = n.color;
        if (w.open.length) av.append(el('i', '', String(w.open.length)));
        b.append(av, el('span', '', n.name)); b.onclick = () => { ui.staff = n.id; ui.seg = 'open'; render(); }; row.append(b);
      }
      s.append(row);
    }
    const deptOf = n => { let p = byId(n.parent), guard = 0; while (p && guard++ < 20) { if (p.kind === 'dept') return p; p = byId(p.parent); } return null; };
    const groups = new Map();
    for (const n of t.nodes.filter(x => x.kind === 'staff' && !x.chief)) { const d = deptOf(n), k = d ? d.id : ''; if (!groups.has(k)) groups.set(k, { name: d ? d.name : 'Team', list: [] }); groups.get(k).list.push(n); }
    for (const g of groups.values()) { s.append(el('div', 'sec', g.name)); g.list.forEach(n => s.append(staffCard(n, false))); }
    return [topBar(true), el('h1', '', 'Team'), s, tabs()];
  }
  function itemRow(x, sub, right) {
    const r = el('button', 'row'), nm = el('div', 'nm', x.name); if (sub) nm.append(el('span', '', sub));
    r.append(nm); if (right) r.append(el('small', '', right)); r.onclick = () => { ui.asked = null; chat(x.url, x.name); }; return r;
  }
  function viewStaff(n) {
    const w = workOf(n.id), top = el('div', 'top'), back = el('button', 'ibtn', '‹'); back.onclick = () => { ui.staff = null; render(); };
    const isPin = pinned().includes(n.id), star = el('button', 'ibtn' + (isPin ? ' on' : ''), isPin ? '\u2605' : '\u2606'); star.title = isPin ? 'Remove from favourites' : 'Add to favourites'; star.onclick = () => togglePin(n.id);
    top.append(back, el('span', 'grow'), ...(n.chief ? [] : [star]));
    const who = el('div', 'who'), av = el('span', 'av', initials(n.name)); if (n.color) av.style.background = n.color;
    const tx = el('div'); tx.append(el('b', '', n.name), el('span', '', n.role || (prof() || {}).name || '')); who.append(av, tx);
    const outs = w.outs ? w.outs.map(o => ({ o, x: { name: o.from } })) : w.done.flatMap(x => (x.outputs || []).map(o => ({ o, x })));
    const seg = el('div', 'seg');
    for (const [k, label] of [['open', `Open ${w.open.length || ''}`], ['done', 'Done'], ['outs', 'Outputs']]) { const b = el('button', ui.seg === k ? 'on' : '', label.trim()); b.onclick = () => { ui.seg = k; render(); }; seg.append(b); }
    const s = el('div', 'scroll');

  // Drag a list down and let go to refresh: the phone reads the team again and sends anything waiting.
  (() => {
    let y0 = null, pull = 0, tip = null;
    const sc = e => e.target.closest && e.target.closest('.scroll');
    app.addEventListener('touchstart', e => { const s2 = sc(e); y0 = s2 && s2.scrollTop <= 0 && !drive.on ? e.touches[0].clientY : null; pull = 0; }, { passive: true });
    app.addEventListener('touchmove', e => {
      if (y0 == null) return; pull = e.touches[0].clientY - y0; if (pull < 12) return;
      if (!tip) { tip = el('div', 'pulltip'); document.body.append(tip); }
      tip.textContent = pull > 80 ? 'Release to refresh' : 'Pull to refresh'; tip.style.opacity = Math.min(1, pull / 80); tip.style.transform = `translate(-50%, ${Math.min(60, pull / 2)}px)`;
    }, { passive: true });
    const end = () => {
      if (y0 == null) return; const go = pull > 80; y0 = null;
      if (tip) { if (go) { tip.textContent = 'Refreshing\u2026'; const t = tip; tip = null; setTimeout(() => t.remove(), 900); } else { tip.remove(); tip = null; } }
      if (go) { if (changes.length) saveChanges(); send({ do: 'load' }); }
    };
    app.addEventListener('touchend', end, { passive: true }); app.addEventListener('touchcancel', end, { passive: true });
  })();
  render();
  if (!send({ do: 'load' })) fetch('demo.json').then(r => r.json()).then(window.phoneData).catch(() => window.phoneData({ state: 'none' }));     // in a web browser: sample data, for design checks
})();
</script></body></html>
