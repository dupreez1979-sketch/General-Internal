name: ClaudeNavigatorPhone
options:
  bundleIdPrefix: com.dupreez
  deploymentTarget:
    iOS: "16.0"
targets:
  ClaudeNavigatorPhone:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dupreez.claude-navigator-phone
        PRODUCT_NAME: Chief of Staff
        MARKETING_VERSION: "0.4.3"
        CURRENT_PROJECT_VERSION: "1"
