    const i = ids.indexOf(state.sideSel);
    const loc = locate(state.sideSel);
    const n = loc && loc.node;
    const isSection = !!(n && !loc.parent && n.type === 'folder');
    const mod = e.metaKey || e.ctrlKey;
    const pick = id => {
      if (!id) return;
      state.sideSel = id;
      applySideSel();
      const l = locate(id);
      if (l && l.node.type === 'folder' && l.parent) go({ kind: 'folder', id });
    };
    switch (e.key) {
      case 'ArrowDown': if (mod) { if (n) openNode(n); } else pick(ids[Math.min(ids.length - 1, i + 1)]); break;
      case 'ArrowUp': if (mod) up(); else pick(ids[i <= 0 ? 0 : i - 1]); break;
      case 'ArrowRight':
        if (n && n.type === 'folder') {
          if (e.altKey) setSubtree(n, true);
          else if (!n.open) toggle(n, true);
          else pick(ids[i + 1]);
        }
        break;
      case 'ArrowLeft':
        if (n && e.altKey && n.type === 'folder') { setSubtree(n, false, isSection); break; }
        if (n) {
          if (n.type === 'folder' && n.open && (isSection || n.children.length)) toggle(n, false);
          else if (loc.parent) pick(loc.parent.id);
        }
        break;
      case 'Enter': case ' ': if (n) (isSection ? toggle(n) : openNode(n)); break;
      case 'F2': if (n) startRename(n.id, treeEl); break;
      case 'Delete': case 'Backspace': if (n && (mod || !isMac || e.key === 'Delete')) removeNode(n.id); break;
      default: return;
    }
    e.preventDefault();
  });

  // ---------- Main area events ----------
  const libKeys = () => [...browseEl.querySelectorAll('.item.lib')].map(r => r.dataset.key);
  const libItem = key => (lib[state.loc.which] || []).find(x => x.url === key);
  const selectedLibItems = () => libKeys().filter(k => libSel.has(k)).map(libItem).filter(Boolean);
  function openLib(url, newWindow = false) {
    if (newWindow) return openNewWindow(url);
    go({ kind: 'page', url });
  }
  function libMouseDown(e) {
    const it = e.target.closest('.item.lib');
    libPendingSingle = null;
    if (!it) {
      if (!e.target.closest('.lhead')) { libSel.clear(); applyLibSel(); }
      return;
    }
    const key = it.dataset.key;
    const keys = libKeys();
    if (e.metaKey || e.ctrlKey) {
      if (libSel.has(key)) libSel.delete(key); else libSel.add(key);
      libAnchor = key;
    } else if (e.shiftKey && libAnchor && keys.includes(libAnchor)) {
      const [a, b] = [keys.indexOf(libAnchor), keys.indexOf(key)].sort((x, y) => x - y);
      libSel.clear();
      keys.slice(a, b + 1).forEach(k => libSel.add(k));
    } else if (libSel.has(key)) {
      if (e.button === 0) libPendingSingle = key; // keep the group for dragging
    } else {
      libSel.clear();
      libSel.add(key);
      libAnchor = key;
    }
    applyLibSel();
  }
  browseEl.addEventListener('click', e => {
    if (state.loc.kind !== 'library' || !libPendingSingle) return;
    const k = libPendingSingle;
    libPendingSingle = null;
    if (e.metaKey || e.ctrlKey || e.shiftKey) return;
    libSel.clear();
    libSel.add(k);
    libAnchor = k;
    applyLibSel();
  });
  function libContextMenu(e) {
    const it = e.target.closest('.item.lib');
    if (it && !libSel.has(it.dataset.key)) { libSel.clear(); libSel.add(it.dataset.key); libAnchor = it.dataset.key; applyLibSel(); }
    const sel = it ? selectedLibItems() : [];
    const one = sel.length === 1 ? sel[0] : null;
    const saved = one ? savedLinksFor(one.url) : [];
    showMenu(e.clientX, e.clientY, [
      one && { label: 'Open', key: K.open, run: () => openLib(one.url) },
      one && { label: 'Open in New Window', run: () => openNewWindow(one.url) },
      sel.length > 0 && { label: sel.length > 1 ? `File ${sel.length} Items in Folder\u2026` : 'File in Folder\u2026', run: () => fileLibPrompt(sel) },
      saved.length > 0 && { label: 'Show in Folder', run: () => revealInFolder(saved[0].id) },
      one && { label: 'Copy Link', run: () => navigator.clipboard.writeText(one.url).then(() => toast('Link copied')) },
      '-',
      { label: 'Select All', key: K.mod + 'A', run: () => { libKeys().forEach(k => libSel.add(k)); applyLibSel(); } },
      { label: 'Refresh from Claude', run: () => refreshLibrary(true) },
    ]);
  }
  function libKeyDown(e) {
    const keys = libKeys();
    if (!keys.length) return;
    const cur = libAnchor && keys.includes(libAnchor) ? keys.indexOf(libAnchor) : -1;
    const mod = e.metaKey || e.ctrlKey;
    const move = j => {
      j = Math.max(0, Math.min(keys.length - 1, j));
      if (!e.shiftKey) libSel.clear();
      libSel.add(keys[j]);
      libAnchor = keys[j];
      applyLibSel();
      const el = browseEl.querySelector(`.item.lib[data-key="${CSS.escape(keys[j])}"]`);
      if (el) el.scrollIntoView({ block: 'nearest' });
    };
    const first = () => selectedLibItems()[0];
    switch (e.key) {
      case 'ArrowDown': if (mod) { if (first()) openLib(first().url); } else move(cur + 1); break;
      case 'ArrowUp': move(cur <= 0 ? 0 : cur - 1); break;
      case 'Home': move(0); break;
      case 'End': move(keys.length - 1); break;
      case 'Enter': if (first()) openLib(first().url); break;
      case 'a': case 'A': if (!mod) return; keys.forEach(k => libSel.add(k)); applyLibSel(); break;
      case 'Escape': libSel.clear(); applyLibSel(); break;
      default: return;
    }
    e.preventDefault();
  }

  browseEl.addEventListener('mousedown', e => {
    if (e.target.closest('input, button, .banner')) return;
    if (state.loc.kind === 'library') return libMouseDown(e);
    const it = e.target.closest('.item');
    state.browseSel = it ? it.dataset.id : null;
    applyBrowseSel(false);
  });
  browseEl.addEventListener('dblclick', e => {
    if (state.loc.kind === 'library') {
      const it = e.target.closest('.item.lib');
      if (it) openLib(it.dataset.key, e.metaKey || e.ctrlKey);
      return;
    }
    const it = e.target.closest('.item');
    if (it) openNode(nodeOf(it.dataset.id), { newWindow: e.metaKey || e.ctrlKey });
  });
  browseEl.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (e.target.closest('.lhead')) return showColumnMenu(e.clientX, e.clientY);
    if (state.loc.kind === 'library') return libContextMenu(e);
    const it = e.target.closest('.item');
    state.browseSel = it ? it.dataset.id : null;
    applyBrowseSel(false);
    showMenu(e.clientX, e.clientY, menuFor(it ? nodeOf(it.dataset.id) : null, browseEl));
  });
  browseEl.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (state.loc.kind === 'library') return libKeyDown(e);
    const ids = [...browseEl.querySelectorAll('.item')].map(x => x.dataset.id);
    const i = ids.indexOf(state.browseSel);
    const n = nodeOf(state.browseSel);
    const mod = e.metaKey || e.ctrlKey;
    const grid = browseEl.querySelector('.grid');
    const cols = grid ? Math.max(1, getComputedStyle(grid).gridTemplateColumns.split(' ').length) : 1;
    const pick = j => { if (ids.length) { state.browseSel = ids[Math.max(0, Math.min(ids.length - 1, j))]; applyBrowseSel(); } };
    switch (e.key) {
      case 'ArrowDown': if (mod) { if (n) openNode(n); } else pick(i < 0 ? 0 : i + cols); break;
      case 'ArrowUp': if (mod) up(); else pick(i < 0 ? 0 : i - cols); break;
      case 'ArrowRight': if (!grid) return; pick(i + 1); break;
      case 'ArrowLeft': if (!grid) return; pick(i - 1); break;
      case 'Home': pick(0); break;
      case 'End': pick(ids.length - 1); break;
      case 'Enter': if (n) (isMac ? startRename(n.id, browseEl) : openNode(n)); break;
      case 'F2': if (n) startRename(n.id, browseEl); break;
      case 'o': case 'O': if (!(mod && n)) return; openNode(n); break;
      case 'Delete': case 'Backspace': if (n && (mod || !isMac || e.key === 'Delete')) removeNode(n.id); break;
      case 'Escape': state.browseSel = null; applyBrowseSel(); break;
      default: return;
    }
    e.preventDefault();
  });

  // ---------- Drag and drop (sidebar and main area) ----------
  const NAV_TYPE = 'application/x-claude-nav-id';
  const LIB_TYPE = 'application/x-claude-library';
  let dropTarget = null, hoverId = null, hoverTimer = null, dragId = null;

  function clearDrop() {
    treeEl.classList.remove('drop-root');
    browseEl.classList.remove('drop-here');
    document.querySelectorAll('.drop-into,.drop-before,.drop-after').forEach(r => r.classList.remove('drop-into', 'drop-before', 'drop-after'));
  }
  function extractUrl(dt) {
    const list = (dt.getData('text/uri-list') || '').split(/\r?\n/).find(l => l && !l.startsWith('#'));
    if (list) return list.trim();
    const t = (dt.getData('text/plain') || '').trim();
    return /^https?:\/\/\S+$/i.test(t) ? t : '';
  }
  const isInternal = dt => [...dt.types].includes(NAV_TYPE);
  const hasUrl = dt => [...dt.types].some(t => t === 'text/uri-list' || t === 'text/plain');

  function onDragStart(e) {
    const libEl = e.target.closest('.item.lib');
    if (libEl) {
      libPendingSingle = null;
      if (!libSel.has(libEl.dataset.key)) { libSel.clear(); libSel.add(libEl.dataset.key); libAnchor = libEl.dataset.key; applyLibSel(); }
      const items = selectedLibItems();
      e.dataTransfer.effectAllowed = 'copy';
      e.dataTransfer.setData(LIB_TYPE, JSON.stringify(items.map(x => ({ name: x.name, url: x.url }))));
      e.dataTransfer.setData('text/uri-list', items.map(x => x.url).join('\r\n'));
      e.dataTransfer.setData('text/plain', items.map(x => x.url).join('\n'));
      if (items.length > 1) {
        const badge = document.createElement('div');
        badge.className = 'drag-badge';
        badge.textContent = `${items.length} items`;
        document.body.appendChild(badge);
        e.dataTransfer.setDragImage(badge, 12, 12);
        setTimeout(() => badge.remove(), 0);
      }
      dragId = null;
      hideMenu();
      return;
    }
    const el = e.target.closest('[data-id]');
    if (!el) return;
    const n = nodeOf(el.dataset.id);
    dragId = n.id;
    e.dataTransfer.effectAllowed = 'copyMove';
    e.dataTransfer.setData(NAV_TYPE, n.id);
    if (n.type === 'link') {
      e.dataTransfer.setData('text/uri-list', n.url);
      e.dataTransfer.setData('text/plain', n.url);
    }
    el.classList.add('dragging');
    hideMenu();
  }
  function onDragEnd() {
    document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging'));
    clearDrop();
    clearTimeout(hoverTimer);
    dragId = null;
  }
  function accept(e) {
    const internal = isInternal(e.dataTransfer);
    if (!internal && !hasUrl(e.dataTransfer)) return null;
    e.preventDefault();
    e.dataTransfer.dropEffect = internal ? 'move' : 'copy';
    clearDrop();
    return internal;
  }
  function blocked(e, folderId) {
    if (dragId && folderId && contains(dragId, folderId)) { e.dataTransfer.dropEffect = 'none'; dropTarget = null; return true; }
    return false;
  }

  treeEl.addEventListener('dragover', e => {
    if (accept(e) === null) return;
    const row = e.target.closest('.row');
    if (row && !row.dataset.id) { dropTarget = null; e.dataTransfer.dropEffect = 'none'; return; }
    if (!row) { treeEl.classList.add('drop-root'); dropTarget = { id: null, zone: 'into' }; return; }
    const id = row.dataset.id;
    const n = nodeOf(id);
    if (blocked(e, id)) return;
    const rect = row.getBoundingClientRect();
    const y = (e.clientY - rect.top) / rect.height;
    const zone = n.type === 'folder'
      ? (y < 0.25 ? 'before' : y > 0.75 && !row.classList.contains('section') ? 'after' : 'into')
      : (y < 0.5 ? 'before' : 'after');
    row.classList.add('drop-' + zone);
    dropTarget = { id, zone };
    // Hovering over a closed folder opens it.
    if (zone === 'into' && !n.open) {
      if (hoverId !== id) {
        clearTimeout(hoverTimer);
        hoverId = id;
        hoverTimer = setTimeout(() => { n.open = true; save(); renderSide(); }, 650);
      }
    } else { clearTimeout(hoverTimer); hoverId = null; }
  });

  browseEl.addEventListener('dragover', e => {
    if (accept(e) === null) return;
    if (state.loc.kind === 'library') { dropTarget = null; e.dataTransfer.dropEffect = 'none'; return; }
    const it = e.target.closest('.item');
    const n = it && nodeOf(it.dataset.id);
    if (n && n.type === 'folder' && n.id !== dragId) {
      if (blocked(e, n.id)) return;
      it.classList.add('drop-into');
      dropTarget = { id: n.id, zone: 'into' };
      return;
    }
    if (state.query) { dropTarget = null; e.dataTransfer.dropEffect = 'none'; return; }
    const here = state.loc.kind === 'folder' ? state.loc.id : null;
    if (blocked(e, here)) return;
    browseEl.classList.add('drop-here');
    dropTarget = { id: here, zone: 'into' };
  });

  function onDrop(e) {
    e.preventDefault();
    clearTimeout(hoverTimer);
    hoverId = null;
    const t = dropTarget;
    dropTarget = null;
    clearDrop();
    if (!t) return;
    const libData = e.dataTransfer.getData(LIB_TYPE);
    if (libData) {
      let items = [];
      try { items = JSON.parse(libData); } catch (err) { /* ignore */ }
      return fileLibItems(items, t);
    }
    const srcId = e.dataTransfer.getData(NAV_TYPE);
    let node, isNew = false;
    if (srcId) {
      if (t.id && contains(srcId, t.id)) return;
      const src = locate(srcId);
      if (t.zone === 'into' && (src.parent ? src.parent.id : null) === t.id) return; // already there
      snap();
      src.list.splice(src.index, 1);
      node = src.node;
    } else {
      const url = extractUrl(e.dataTransfer);
      if (!url) return;
      snap();
      node = Link(guessName(url), url);
      node.autoName = true;
      isNew = true;
    }
    if (t.zone === 'into') insertInto(t.id, node);
    else {
      const tgt = locate(t.id);
      tgt.list.splice(tgt.index + (t.zone === 'after' ? 1 : 0), 0, node);
    }
    commit();
    if (isNew) startRename(node.id, browseItemEl(node.id) ? browseEl : treeEl);
  }

  [treeEl, browseEl].forEach(el => {
    el.addEventListener('dragstart', onDragStart);
    el.addEventListener('dragend', onDragEnd);
    el.addEventListener('dragleave', e => { if (!el.contains(e.relatedTarget)) { clearDrop(); clearTimeout(hoverTimer); hoverId = null; } });
    el.addEventListener('drop', onDrop);
  });

  // ---------- Toolbar, search, shortcuts ----------
  $('bBack').addEventListener('click', back);
  $('bFwd').addEventListener('click', forward);
  $('vIcons').addEventListener('click', () => setView('icons'));
  $('vList').addEventListener('click', () => setView('list'));
  $('bReload').addEventListener('click', () => view && view.reload());
  $('bSave').addEventListener('click', () => saveCurrent());
  $('bExternal').addEventListener('click', () => openExternal(state.pageUrl));
  $('bNewChat').addEventListener('click', newChat);
  $('bNewMenu').addEventListener('click', e => {
    const b = e.currentTarget.getBoundingClientRect();
    showNewMenu(b.left, b.bottom + 4);
  });
  $('sNewFolder').addEventListener('click', () => newFolder());
  const setLibFilter = v => { state.libFilter = v; ls.set(LIB_FILTER_STORE, v); renderMain(); renderToolbar(); };
  $('libAll').addEventListener('click', () => setLibFilter('all'));
  $('libUnfiled').addEventListener('click', () => setLibFilter('unfiled'));
  $('bRefreshLib').addEventListener('click', () => refreshLibrary(true));

  searchEl.addEventListener('input', () => {
    state.query = searchEl.value.trim();
    state.browseSel = null;
    renderMain();
    renderToolbar();
    if (!state.query) syncSideSel();
  });
  searchEl.addEventListener('keydown', e => {
    if (e.key === 'Escape') { searchEl.value = ''; state.query = ''; renderMain(); renderToolbar(); syncSideSel(); browseEl.focus(); }
    if ((e.key === 'ArrowDown' || e.key === 'Enter') && state.query) {
      const first = browseEl.querySelector('.item');
      if (first) { state.browseSel = first.dataset.id; applyBrowseSel(); browseEl.focus(); e.preventDefault(); }
    }
  });

  $('sMore').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect();
    showMenu(r.left, r.top - 4, [
      { label: 'Undo', key: K.mod + 'Z', disabled: !undoStack.length, run: undo },
      '-',
      { label: 'Expand All', run: () => setAllOpen(true) },
      { label: 'Collapse All', run: () => setAllOpen(false) },
      '-',
      isApp && { label: 'Hide Claude\u2019s Own Sidebar', checked: hideClaudeSidebar(), run: () => setHideClaudeSidebar(!hideClaudeSidebar()) },
      isApp && '-',
      { label: 'Back Up Folders to a File…', run: exportTree },
      { label: 'Restore Folders from a File…', run: () => $('importFile').click() },
      '-',
      { label: 'Reset to Example Folders', run: () => {
        if (!confirm('Replace all your folders with the example set? You can undo this.')) return;
        snap(); state.tree = seed(); commit();
      } },
    ], { above: true });
  });

  function exportTree() {
    const blob = new Blob([JSON.stringify({ app: 'claude-navigator', version: 1, saved: new Date().toISOString(), tree: state.tree }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `claude-folders-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  $('importFile').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const tree = Array.isArray(data) ? data : data.tree;
      const ok = n => n && typeof n.name === 'string' &&
        (n.type === 'link' ? typeof n.url === 'string' : n.type === 'folder' && Array.isArray(n.children) && n.children.every(ok));
      if (!Array.isArray(tree) || !tree.every(ok)) throw new Error('That file is not a Claude Navigator backup.');
      const fresh = n => { n.id = uid(); if (n.children) n.children.forEach(fresh); };
      tree.forEach(fresh);
      snap();
      state.tree = tree;
      go({ kind: 'folder', id: null });
      commit();
      toast('Folders restored', true);
    } catch (err) {
      alert('Could not restore: ' + err.message);
    }
  });

  document.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    if (!mod || e.altKey) return;
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    const k = e.key.toLowerCase();
    if (k === 'f') openFind();
    else if (k === 'g' && pageShowing()) findStep(!e.shiftKey);
    else if (k === 'r' && pageShowing()) view.reload();
    else if (k === 'p' && pageShowing()) view.print();
    else if (k === 'n' && e.shiftKey) newFolder();
    else if (k === 'n') newChat();
    else if (k === 'l') promptNewLink();
    else if (k === 's') saveCurrent();
    else if (k === 'z' && !typing) undo();
    else if (k === '[') back();
    else if (k === ']') forward();
    else if (k === '1') setView('icons');
    else if (k === '2') setView('list');
    else if (k === 'arrowup' && !typing) up();
    else return;
    e.preventDefault();
  });
  // Shortcuts pressed while typing inside Claude are passed on by the desktop app.
  if (isApp && window.navigatorApp.onShortcut) {
    const actions = {
      'new-chat': newChat,
      'new-folder': () => newFolder(),
      'add-link': () => promptNewLink(),
      save: () => saveCurrent(),
      find: openFind,
      'find-next': () => findStep(true),
      'find-prev': () => findStep(false),
      print: () => { if (pageShowing()) view.print(); else window.print(); },
      reload: () => { if (pageShowing()) view.reload(); },
      back, forward, up,
      'toggle-claude-sidebar': () => setHideClaudeSidebar(!hideClaudeSidebar()),
      'view-icons': () => setView('icons'),
      'view-list': () => setView('list'),
    };
    window.navigatorApp.onShortcut(k => { if (!dlg.open && actions[k]) actions[k](); });

    // Files saved from Claude land in Downloads.
    window.navigatorApp.onDownload(d => {
      if (d.state === 'started') toast(`Downloading “${d.name}”…`);
      else if (d.state === 'completed') toast(`Downloaded “${d.name}”`, { label: isMac ? 'Show in Finder' : 'Show in folder', run: () => window.navigatorApp.showInFolder(d.path) });
      else toast(`Download of “${d.name}” did not finish`);
    });

    // "Save Link to a Folder" from the right-click menu inside Claude.
    window.navigatorApp.onContextAction(a => {
      if (a.action !== 'save-link') return;
      const text = a.text && a.text.length < 120 ? a.text : '';
      openDialog({
        title: 'Save Link', name: text, url: a.url, folderId: state.lastFolderId,
        onSave: ({ name, url, folderId }) => { if (url) addLink(folderId, name, url, { autoName: !name }); },
      });
    });
  }

  // ---------- Tooltips ----------
  // Any element with a title shows it after a short pause; once one is showing,
  // moving to the next shows it straight away, as on a Mac.
  const tipBox = document.createElement('div');
  tipBox.id = 'tip';
  tipBox.setAttribute('role', 'tooltip');
  document.body.appendChild(tipBox);
  let tipTimer = null, tipFor = null, tipHiddenAt = 0;
  function hideTip() {
    clearTimeout(tipTimer);
    if (tipBox.classList.contains('show')) tipHiddenAt = Date.now();
    tipBox.classList.remove('show');
    tipFor = null;
  }
  function placeTip(el) {
    if (!document.contains(el) || !el.dataset.tip) return;
    tipBox.textContent = el.dataset.tip;
    const r = el.getBoundingClientRect();
    tipBox.style.left = '0px';
    tipBox.style.top = '0px';
    const t = tipBox.getBoundingClientRect();
    let x = Math.min(Math.max(6, r.left + r.width / 2 - t.width / 2), innerWidth - t.width - 6);
    if (r.width > 260) x = Math.min(Math.max(6, lastMouseX + 8), innerWidth - t.width - 6);
    let y = r.bottom + 6;
    if (y + t.height > innerHeight - 6) y = r.top - t.height - 6;
    tipBox.style.left = x + 'px';
    tipBox.style.top = y + 'px';
    tipBox.classList.add('show');
  }
  let lastMouseX = 0;
  document.addEventListener('mousemove', e => { lastMouseX = e.clientX; }, { passive: true });
  document.addEventListener('mouseover', e => {
    const el = e.target.closest && e.target.closest('[title], [data-tip]');
    if (el === tipFor) return;
    hideTip();
    if (!el || menu.contains(el)) return;
    if (el.hasAttribute('title')) { el.dataset.tip = el.getAttribute('title'); el.removeAttribute('title'); }
    if (!el.dataset.tip) return;
    tipFor = el;
    tipTimer = setTimeout(() => placeTip(el), Date.now() - tipHiddenAt < 600 ? 0 : 550);
  });
  document.addEventListener('mouseleave', hideTip);
  ['mousedown', 'keydown', 'dragstart', 'wheel'].forEach(ev => document.addEventListener(ev, hideTip, true));
  addEventListener('blur', hideTip);

  // ---------- Toast ----------
  const toastEl = $('toast');
  let toastTimer = null;
  // toast(message), toast(message, true) for an Undo button, or toast(message, { label, run }).
  let toastAction = null;
  function toast(msg, action = null) {
    if (action === true) action = { label: 'Undo', run: undo };
    toastAction = action;
    $('toastMsg').textContent = msg;
    $('toastUndo').hidden = !action;
    if (action) $('toastUndo').textContent = action.label;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), action ? 6000 : 2600);
  }
  $('toastUndo').addEventListener('click', () => { toastEl.classList.remove('show'); if (toastAction) toastAction.run(); });

  // ---------- Resizable sidebar ----------
  const clampW = w => Math.max(180, Math.min(520, w));
  const setWidth = w => document.documentElement.style.setProperty('--side-w', clampW(w) + 'px');
  if (+ls.get(WIDTH_STORE)) setWidth(+ls.get(WIDTH_STORE));
  $('splitter').addEventListener('mousedown', e => {
    e.preventDefault();
    document.body.classList.add('resizing');
    const move = ev => setWidth(ev.clientX);
    const stop = ev => {
      document.body.classList.remove('resizing');
      removeEventListener('mousemove', move);
      removeEventListener('mouseup', stop);
      ls.set(WIDTH_STORE, String(clampW(ev.clientX)));
    };
    addEventListener('mousemove', move);
    addEventListener('mouseup', stop);
  });
  $('splitter').addEventListener('dblclick', () => { setWidth(240); ls.del(WIDTH_STORE); });

  addEventListener('storage', e => { if (e.key === STORE) { state.tree = load(); renderAll(); } });

  // ---------- Start where you left off ----------
  let start = isApp ? { kind: 'page', url: HOME } : { kind: 'folder', id: null };
  let startFolder = null;
  try {
    const s = JSON.parse(ls.get(LOC_STORE));
    if (s && s.loc && (s.loc.kind === 'folder' || (s.loc.kind === 'page' && isApp && s.loc.url))) {
      start = s.loc.kind === 'page' ? { kind: 'page', url: s.loc.url } : { kind: 'folder', id: s.loc.id || null };
      startFolder = s.lastFolderId && nodeOf(s.lastFolderId) ? s.lastFolderId : null;
    }
  } catch (e) { /* ignore */ }
  renderSide();
  state.lastFolderId = startFolder;
  go(start);
  if (isApp) {
    setTimeout(() => refreshLibrary(false), 4000);
    setInterval(() => refreshLibrary(false), 10 * 60e3);
  }
})();
</script>
</body>
</html>
