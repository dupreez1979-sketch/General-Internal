    if (kind === 'chats') b('Delete from Claude\u2026', () => deleteFromClaude(sel), 'danger', 'Delete these chats from your Claude account for good');
    else if (sel.length === 1) b('Open in Claude to Delete', () => openLib(sel[0].url), '', 'Open it in Claude, where you can delete it');
    b('Clear Selection', () => { libSel.clear(); renderLibrary(); });
    return bar;
  }
  function renderLibPager(total) {
    const st = $('status');
    if (!st) return;
    const pages = Math.ceil(total / PAGE_SIZE);
    if (pages <= 1) return;
    const p = document.createElement('span');
    p.className = 'pager';
    const from = state.libPage * PAGE_SIZE + 1, to = Math.min(total, (state.libPage + 1) * PAGE_SIZE);
    const btn = (label, title, page, disabled) => {
      const x = document.createElement('button');
      x.textContent = label;
      x.title = title;
      x.disabled = disabled;
      x.addEventListener('click', () => { state.libPage = page; renderMain(); browseEl.scrollTop = 0; });
      return x;
    };
    const mid = document.createElement('span');
    mid.textContent = `${from}\u2013${to} of ${total}`;
    p.append(btn('\u2039 Previous', 'Previous page', state.libPage - 1, state.libPage === 0), mid, btn('Next \u203a', 'Next page', state.libPage + 1, state.libPage >= pages - 1));
    st.after(p);
  }
  function showLibFilterMenu(x, y) {
    const kind = state.loc.which;
    const set = (k, v) => () => { state[k] = v; state.libPage = 0; if (k === 'libFilter') ls.set(LIB_FILTER_STORE, v); renderMain(); renderToolbar(); };
    showMenu(x, y, [
      { label: 'Everything', checked: state.libFilter === 'all', run: set('libFilter', 'all') },
      { label: 'Not in a Folder', checked: state.libFilter === 'unfiled', run: set('libFilter', 'unfiled') },
      { label: 'In a Folder', checked: state.libFilter === 'filed', run: set('libFilter', 'filed') },
      { label: 'Archived', checked: state.libFilter === 'archived', run: set('libFilter', 'archived') },
      '-',
      ...Object.keys(WHEN).map(k => ({ label: WHEN[k], checked: state.libWhen === k, run: set('libWhen', k) })),
      kind === 'chats' && '-',
      kind === 'chats' && { label: 'With or Without Artifacts', checked: state.libArts === 'any', run: set('libArts', 'any') },
      kind === 'chats' && { label: 'With Artifacts', checked: state.libArts === 'with', run: set('libArts', 'with') },
      kind === 'chats' && { label: 'Without Artifacts', checked: state.libArts === 'without', run: set('libArts', 'without') },
      kind === 'chats' && '-',
      kind === 'chats' && { label: 'Starred Only', checked: state.libStarred, run: set('libStarred', !state.libStarred) },
      '-',
      { label: 'Reset Filters', disabled: !activeFilterCount(), run: () => { Object.assign(state, { libFilter: 'all', libWhen: 'any', libArts: 'any', libStarred: false, libPage: 0 }); ls.set(LIB_FILTER_STORE, 'all'); renderMain(); renderToolbar(); } },
    ]);
  }
  // Archive: only in this app (Claude has no chat archive to sync with).
  function archiveItems(items, on) {
    const before = (lib.archived || []).slice();
    const keys = new Set(items.map(x => normUrl(x.url)));
    lib.archived = on ? [...new Set(before.concat([...keys]))] : before.filter(k => !keys.has(k));
    libSel.clear();
    saveLib();
    renderAll();
    toast(`${on ? 'Archived' : 'Unarchived'} ${items.length} item${items.length === 1 ? '' : 's'}${on ? '. Find them under Filter, Archived.' : ''}`, {
      label: 'Undo', run: () => { lib.archived = before; saveLib(); renderAll(); },
    });
  }
  async function deleteFromClaude(items) {
    const chats = items.filter(x => /\/chat\//.test(x.url));
    if (!chats.length || !isApp) return toast('Only chats can be deleted from Claude here');
    const n = chats.length;
    if (!confirm(`Delete ${n} chat${n === 1 ? '' : 's'} from Claude?\n\nThis deletes ${n === 1 ? 'it' : 'them'} from your Claude account for good, and removes ${n === 1 ? 'it' : 'them'} from your folders here. It cannot be undone.`)) return;
    if (n > 10 && !confirm(`Really delete all ${n} chats from your Claude account?`)) return;
    toast(`Deleting ${n} chat${n === 1 ? '' : 's'} from Claude\u2026`);
    const res = await window.navigatorApp.deleteChats(chats.map(x => ({ url: x.url, org: x.org || null })));
    const gone = new Set(res.deleted.map(normUrl));
    lib.chats = (lib.chats || []).filter(x => !gone.has(normUrl(x.url)));
    for (const k of gone) delete lib.related[k];
    lib.archived = (lib.archived || []).filter(k => !gone.has(k));
    const drop = [];
    walk(state.tree, x => { if (x.type === 'link' && gone.has(normUrl(x.url))) drop.push(x.id); });
    for (const id of drop) { const l = locate(id); if (l) { if (l.node.children && l.node.children.length) l.list.splice(l.index, 1, ...l.node.children); else l.list.splice(l.index, 1); } }
    libSel.clear();
    saveLib();
    commit();
    if (res.failed.length) {
      const why = [...new Set(res.failed.map(f => f.status))].join(', ');
      toast(`Deleted ${res.deleted.length} of ${n}. ${res.failed.length} could not be deleted (${why}).`);
    } else toast(`Deleted ${res.deleted.length} chat${res.deleted.length === 1 ? '' : 's'} from Claude`);
  }

  function renderLibPathbar(kind, idx, shown) {
    const bar = $('pathbar');
    bar.replaceChildren();
    const s = document.createElement('span');
    const all = libList(kind).length;
    s.textContent = lib.busy
      ? 'Checking Claude for changes\u2026'
      : `${all} in Claude, ${unfiledCount(kind, idx)} not in a folder. Updated ${ago(lib.fetchedAt)}.`;
    const st = document.createElement('span');
    st.id = 'status';
    bar.append(s, st);
    applyLibSel();
    renderLibPager((state.libFiltered || []).length);
  }

  // ---------- List columns (choose them by right-clicking the header; drag edges to resize) ----------
  const COLS = {
    name: { label: 'Name', w: 320, min: 140 },
    kind: { label: 'Kind', w: 110 },
    edited: { label: 'Last Edited', w: 140 },
    added: { label: 'Date Added', w: 140 },
    opened: { label: 'Last Opened', w: 140 },
    items: { label: 'Items', w: 80 },
    where: { label: 'Where', w: 220 },
    filed: { label: 'In Folder', w: 180 },
    address: { label: 'Address', w: 260 },
  };
  const VIEW_COLS = {
    folder: ['name', 'kind', 'edited', 'added', 'opened', 'items', 'address'],
    search: ['name', 'kind', 'where', 'edited', 'added', 'opened', 'address'],
    library: ['name', 'kind', 'edited', 'filed', 'address'],
  };
  const DEFAULT_COLS = { folder: ['name', 'kind', 'edited', 'items'], search: ['name', 'kind', 'where'], library: ['name', 'kind', 'edited', 'filed'] };
  const COL_STORE = 'claudeNavigator.columns.v1';
  const colPrefs = (() => { try { return JSON.parse(ls.get(COL_STORE)) || {}; } catch (e) { return {}; } })();
  function colsFor(view) {
    const p = colPrefs[view] || (colPrefs[view] = {});
    if (!Array.isArray(p.cols)) p.cols = DEFAULT_COLS[view].slice();
    p.cols = ['name', ...VIEW_COLS[view].filter(k => k !== 'name' && p.cols.includes(k))];
    p.widths = p.widths || {};
    return p;
  }
  const colWidth = (view, k) => colsFor(view).widths[k] || COLS[k].w;
  // Columns that fit the window (Name always stays); the rest drop out on narrow windows.
  function visibleCols(view) {
    const avail = Math.max(300, (browseEl.clientWidth || 900) - 80);
    const out = [];
    let used = 0;
    for (const k of colsFor(view).cols) {
      const w = colWidth(view, k);
      if (k !== 'name' && used + w > avail) continue;
      out.push(k);
      used += w;
    }
    return out;
  }
  const gridCols = view => visibleCols(view).map((k, i, a) => i === a.length - 1 ? `minmax(${colWidth(view, k)}px, 1fr)` : `${colWidth(view, k)}px`).join(' ');
  const saveCols = () => ls.set(COL_STORE, JSON.stringify(colPrefs));
  const listView = () => (state.loc.kind === 'library' ? 'library' : state.query ? 'search' : 'folder');

  // ---------- Sorting (display only: your own order is never changed) ----------
  const DATE_COLS = new Set(['edited', 'added', 'opened']);
  const DEFAULT_SORT = { folder: null, search: null, library: { col: 'edited', dir: 'desc' } };
  function sortFor(view) {
    const p = colsFor(view);
    return p.sort === undefined ? DEFAULT_SORT[view] : p.sort;
  }
  function sortWords(k, dir) {
    if (DATE_COLS.has(k)) return dir === 'desc' ? 'newest first' : 'oldest first';
    if (k === 'items') return dir === 'desc' ? 'most first' : 'fewest first';
    return dir === 'asc' ? 'A to Z' : 'Z to A';
  }
  function setSort(view, col) {
    const cur = sortFor(view);
    const p = colsFor(view);
    p.sort = cur && cur.col === col
      ? { col, dir: cur.dir === 'asc' ? 'desc' : 'asc' }
      : { col, dir: DATE_COLS.has(col) || col === 'items' ? 'desc' : 'asc' };
    saveCols();
    renderMain();
  }
  function editedOf(n, updated) {
    if (n.type === 'link') return updated.get(normUrl(n.url)) || '';
    let latest = '';
    walk(n.children, c => { const u = c.type === 'link' && updated.get(normUrl(c.url)); if (u && u > latest) latest = u; });
    return latest;
  }
  const toTime = v => (v ? new Date(v).getTime() || 0 : 0);
  // The value a column sorts by, for a folder item (n) or a Library item (x).
  function sortValue(view, k, it, ctx) {
    if (view === 'library') {
      if (k === 'name') return (it.name || '').toLowerCase();
      if (k === 'kind') return KIND_NAME[libKind(it, state.loc.which)];
      if (k === 'edited') return toTime(it.updated);
      if (k === 'filed') return (ctx.idx.get(normUrl(it.url)) || []).join(', ').toLowerCase();
      if (k === 'address') return it.url;
      return '';
    }
    switch (k) {
      case 'name': return it.name.toLowerCase();
      case 'kind': return KIND_NAME[kindOf(it)];
      case 'edited': return toTime(editedOf(it, ctx.updated));
      case 'added': return it.added || 0;
      case 'opened': return it.opened || 0;
      case 'items': return it.type === 'folder' ? it.children.length : -1;
      case 'where': return displayPath(it.id).slice(0, -1).map(p => p.name).join(' ').toLowerCase();
      case 'address': return it.url || '';
      default: return '';
    }
  }
  function sortItems(items, view, ctx) {
    const sort = sortFor(view);
    if (!sort) return items;
    const dir = sort.dir === 'asc' ? 1 : -1;
    const empty = v => v === '' || v === 0 || v === -1;
    return items.slice().sort((a, b) => {
      if (view !== 'library' && a.type !== b.type) return a.type === 'folder' ? -1 : 1;   // folders on top
      const va = sortValue(view, sort.col, a, ctx), vb = sortValue(view, sort.col, b, ctx);
      if (empty(va) !== empty(vb)) return empty(va) ? 1 : -1;                           // blanks last
      const c = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb), undefined, { numeric: true });
      return c * dir || a.name.localeCompare(b.name, undefined, { numeric: true });
    });
  }

  function listHeader(view) {
    const head = document.createElement('div');
    head.className = 'lhead';
    const sort = sortFor(view);
    for (const k of visibleCols(view)) {
      const c = document.createElement('span');
      c.className = 'hc' + (sort && sort.col === k ? ' sorted' : '');
      c.dataset.col = k;
      c.textContent = COLS[k].label;
      c.title = sort && sort.col === k
        ? `Sorted by ${COLS[k].label}, ${sortWords(k, sort.dir)}. Click to reverse.\nRight-click to choose columns.`
        : `Click to sort by ${COLS[k].label}.\nRight-click to choose columns.`;
      if (sort && sort.col === k) {
        const a = document.createElement('span');
        a.className = 'sa';
        a.innerHTML = sort.dir === 'asc' ? UI.sortUp : UI.sortDown;
        c.appendChild(a);
      }
      const rz = document.createElement('i');
      rz.className = 'rz';
      rz.title = 'Drag to resize. Double-click to reset.';
      c.appendChild(rz);
      head.appendChild(c);
    }
    return head;
  }
  function makeList(view, extraClass = '') {
    const l = document.createElement('div');
    l.className = 'list' + (extraClass ? ' ' + extraClass : '');
    l.dataset.view = view;
    l.style.setProperty('--cols', gridCols(view));
    l.appendChild(listHeader(view));
    return l;
  }
  // Fills a list row: the name cell plus one cell per chosen column.
  function fillRow(r, view, iconHtml, name, values) {
    const cells = [`<span class="nm"><span class="icon">${iconHtml}</span><span class="label"></span></span>`];
    const cols = visibleCols(view);
    for (let i = 1; i < cols.length; i++) cells.push('<span class="muted"></span>');
    r.innerHTML = cells.join('');
    r.querySelector('.label').textContent = name;
    cols.forEach((k, i) => { if (i) r.children[i].textContent = values[k] || ''; });
  }
  function libUpdatedIndex() {
    const m = new Map();
    for (const k of Object.keys(LIB_KINDS)) for (const x of lib[k] || []) if (x.updated) m.set(normUrl(x.url), x.updated);
    return m;
  }

  function showColumnMenu(x, y) {
    const view = listView();
    const p = colsFor(view);
    showMenu(x, y, [
      ...VIEW_COLS[view].filter(k => k !== 'name').map(k => ({
        label: COLS[k].label, checked: p.cols.includes(k),
        run: () => {
          const set = new Set(p.cols);
          if (set.has(k)) set.delete(k); else set.add(k);
          p.cols = [...set];
          saveCols();
          renderMain();
        },
      })),
      '-',
      view !== 'library' && { label: 'Sort by Your Own Order', checked: !sortFor(view), run: () => { colsFor(view).sort = null; saveCols(); renderMain(); } },
      { label: 'Reset Columns and Sorting', run: () => { delete colPrefs[view]; saveCols(); renderMain(); } },
    ]);
  }

  // Row checkboxes show the app's selection; stop the box's own click from flipping it back.
  browseEl.addEventListener('click', e => {
    if (!e.target.closest('.lchk:not(.lchk-all)')) return;
    e.preventDefault();
    requestAnimationFrame(() => (state.loc.kind === 'library' ? applyLibSel() : applyBrowseSel(false)));
  });
  let lastResize = 0;
  browseEl.addEventListener('click', e => {
    const hc = e.target.closest('.lhead .hc');
    if (!hc || e.target.closest('.rz') || Date.now() - lastResize < 300) return;
    setSort(hc.closest('.list').dataset.view, hc.dataset.col);
  });

  // Drag a header edge to resize; double-click it to reset that column.
  browseEl.addEventListener('mousedown', e => {
    const rz = e.target.closest('.lhead .rz');
    if (!rz) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    const list = rz.closest('.list');
    const view = list.dataset.view;
    const k = rz.parentElement.dataset.col;
    const startX = e.clientX;
    const startW = rz.parentElement.getBoundingClientRect().width;
    document.body.classList.add('col-resizing');
    const move = ev => {
      colsFor(view).widths[k] = Math.round(Math.max(COLS[k].min || 60, startW + ev.clientX - startX));
      list.style.setProperty('--cols', gridCols(view));
    };
    const stop = () => {
      lastResize = Date.now();
      document.body.classList.remove('col-resizing');
      removeEventListener('mousemove', move);
      removeEventListener('mouseup', stop);
      saveCols();
    };
    addEventListener('mousemove', move);
    addEventListener('mouseup', stop);
  }, true);
  browseEl.addEventListener('dblclick', e => {
    const rz = e.target.closest('.lhead .rz');
    if (!rz) return;
    e.stopImmediatePropagation();
    const list = rz.closest('.list');
    delete colsFor(list.dataset.view).widths[rz.parentElement.dataset.col];
    saveCols();
    list.style.setProperty('--cols', gridCols(list.dataset.view));
  }, true);

  function tileFor(n) {
    const t = document.createElement('div');
    t.className = 'tile item';
    t.dataset.id = n.id;
    t.draggable = true;
    const k = kindOf(n);
    t.innerHTML = `${state.libSelectMode ? '<input type="checkbox" class="lchk" title="Select">' : ''}<div class="big">${k === 'folder' ? BIG_FOLDER : bigFile(k)}</div><div class="label"></div>`;
    t.querySelector('.label').textContent = n.name;
    t.title = n.type === 'link' ? `${n.name}\n${n.url}` : n.name;
    if (n.type === 'link' && n.children && n.children.length) {
      const b = document.createElement('span');
      b.className = 'att';
      b.textContent = `+${n.children.length}`;
      b.title = n.children.map(c => c.name).join('\n') + '\n(attached; switch to list view to see them)';
      t.appendChild(b);
    }
    return t;
  }

  function listRowFor(n, view, updated) {
    const r = document.createElement('div');
    r.className = 'lrow item';
    r.dataset.id = n.id;
    r.draggable = true;
    const k = kindOf(n);
    const edited = editedOf(n, updated);

    fillRow(r, view, colourIcon(k), n.name, {
      kind: KIND_NAME[k],
      edited: fmtDate(edited),
      added: fmtDate(n.added),
      opened: fmtDate(n.opened),
      items: n.type === 'folder' ? `${n.children.length} item${n.children.length === 1 ? '' : 's'}` : '',
      where: displayPath(n.id).slice(0, -1).map(p => p.name).join(' \u203a ') || 'Top level',
      address: n.type === 'link' ? (n.url || '').replace(/^https?:\/\//, '') : '',
    });
    r.title = n.type === 'link' ? `${n.name}\n${n.url}` : n.name;
    if (state.libSelectMode) {
      const c = document.createElement('input');
      c.type = 'checkbox';
      c.className = 'lchk';
      c.title = 'Select';
      c.checked = multi.browse.has(n.id);
      r.querySelector('.nm').prepend(c);
    }
    return r;
  }

  const browseItemEl = id => id && browseEl.querySelector(`.item[data-id="${CSS.escape(id)}"]`);
  // ---------- Multiple selection (Cmd/Ctrl-click to add, Shift-click for a range) ----------
  // state.browseSel / state.sideSel stay the "main" item; these sets hold everything selected.
  const multi = { browse: new Set(), side: new Set(), browseAnchor: null, sideAnchor: null, pending: null };
  const browseIds = () => [...browseEl.querySelectorAll('.item[data-id]')].map(x => x.dataset.id);
  const sideIds = () => [...treeEl.querySelectorAll('.row[data-id]')].map(x => x.dataset.id);
  // Keeps only the outermost items (a folder's contents travel with it).
  const outermost = ids => ids.filter(id => locate(id) && !ids.some(o => o !== id && contains(o, id)));
  function selectedBrowse() {
    if (!state.browseSel && !multi.browse.size) return [];
    const pool = state.loc.kind === 'folder' && state.folderFiltered ? state.folderFiltered.map(n => n.id) : browseIds();
    const ids = pool.filter(id => multi.browse.has(id));
    for (const id of browseIds()) if (multi.browse.has(id) && !ids.includes(id)) ids.push(id);   // attached rows
    return ids;
  }
  function selectedSide() {
    if (multi.side.size < 2) return [];
    return sideIds().filter(id => multi.side.has(id));
  }
  function selectRange(list, set, fromId, toId) {
    const a = list.indexOf(fromId), b = list.indexOf(toId);
    if (a < 0 || b < 0) { set.clear(); set.add(toId); return; }
    set.clear();
    list.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(id => set.add(id));
  }

  function applyBrowseSel(scroll = true) {
    if (!state.browseSel) multi.browse.clear();
    else if (!multi.browse.has(state.browseSel)) { multi.browse.clear(); multi.browse.add(state.browseSel); }
    browseEl.querySelectorAll('.item.selected').forEach(r => r.classList.remove('selected'));
    for (const id of multi.browse) { const el = browseItemEl(id); if (el) el.classList.add('selected'); }
    browseEl.querySelectorAll('.item[data-id] .lchk').forEach(c => { c.checked = multi.browse.has(c.closest('.item').dataset.id); });
    const ca = browseEl.querySelector('.lchk-all');
    if (ca && state.folderFiltered) {
      const n = state.folderFiltered.filter(x => multi.browse.has(x.id)).length;
      ca.checked = n > 0 && n === state.folderFiltered.length;
      ca.indeterminate = n > 0 && n < state.folderFiltered.length;
    }
    const fbar = browseEl.querySelector('.libbar');
    if (fbar && state.loc.kind === 'folder') fbar.replaceWith(folderActionBar());
    const r = browseItemEl(state.browseSel);
    if (r && scroll) r.scrollIntoView({ block: 'nearest' });
    const st = $('status');
    if (st && state.loc.kind !== 'library') {
      const count = browseIds().length;
      st.textContent = multi.browse.size > 1 ? `${multi.browse.size} of ${count} selected` : `${count} item${count === 1 ? '' : 's'}`;
    }
  }

  function renderPathbar(count) {
    const bar = $('pathbar');
    bar.replaceChildren();
    const crumb = (label, icon, id) => {
      const b = document.createElement('span');
      b.className = 'crumb';
      b.innerHTML = icon;
      b.appendChild(document.createTextNode(label));
      b.title = id ? `Go to ${label}` : 'Go to the top level';
      b.addEventListener('click', () => go({ kind: 'folder', id }));
      return b;
    };
    if (state.query) {
      const s = document.createElement('span');
      s.textContent = `Searching all folders for “${state.query}”`;
      bar.appendChild(s);
    } else {
      const ap = activeProfile();
      bar.appendChild(crumb(ap ? ap.name : 'All Profiles', ap ? `<span class="pdot" style="background:${ap.color}"></span>` : UI.root, null));
      for (const p of displayPath(state.loc.id)) {
        const sep = document.createElement('span');
        sep.textContent = '›';
        bar.appendChild(sep);
        bar.appendChild(crumb(p.name, small('folder', 'currentColor', 12), p.id));
      }
    }
    const st = document.createElement('span');
    st.id = 'status';
    st.textContent = `${count} item${count === 1 ? '' : 's'}`;
    bar.appendChild(st);
  }

  function renderToolbar() {
    const page = isApp && state.loc.kind === 'page' && !state.query;
    $('bBack').disabled = nav.pos <= 0;
    $('bFwd').disabled = nav.pos >= nav.hist.length - 1;
    let title;
    const inLib = state.loc.kind === 'library';
    if (inLib) title = LIB_KINDS[state.loc.which];
    else if (state.query) title = 'Search';
    else if (page && state.autoFile) title = NEW_KINDS[state.autoFile.kind].title;
    else if (page && isBlankClaudePage(state.pageUrl) && /\/new/.test(state.pageUrl)) title = 'New chat';
    else if (page) {
      const saved = pageContext().linkId && nodeOf(pageContext().linkId);
      title = realTitle(state.pageTitle) || (saved && saved.name) || cleanTitle(state.pageTitle) || 'Claude';
    }
    else title = state.loc.id ? (nodeOf(state.loc.id) || {}).name : (activeProfile() ? activeProfile().name : 'All Profiles');
    const tEl = $('title');
    tEl.replaceChildren();
    if (page) {
      const c = pageContext();
      const add = (cls, text, html) => {
        const sp = document.createElement('span');
        sp.className = cls;
        if (html) sp.innerHTML = html;
        sp.appendChild(document.createTextNode(text));
        tEl.appendChild(sp);
        return sp;
      };
      if (c.folderId) {
        for (const f of displayPath(c.folderId)) {
          const cr = add('tc', f.name, small('folder', 'currentColor', 12));
          cr.title = `Go to ${f.name}`;
          cr.addEventListener('click', () => go({ kind: 'folder', id: f.id }));
          add('ts', '\u203a');
        }
        if (c.attachedTo) {
          const chat = nodeOf(c.attachedTo);
          const cr = add('tc', chat.name, small('chat', 'currentColor', 12));
          cr.title = `Open the chat this is attached to`;
          cr.addEventListener('click', () => openNode(chat));
          add('ts', '\u203a');
        }
      } else {
        const nf = add('tc none', 'Not in a folder');
        nf.title = `Click (or press ${K.mod}S) to choose a folder to save this in`;
        nf.addEventListener('click', saveAs);
        add('ts', '\u203a');
      }
      add('tn', title);
      if (c.status === 'pending') {
        const chip = add('chip', `Saves in ${nodeOf(c.folderId).name} once created`);
        chip.title = `This ${NEW_KINDS[state.autoFile.kind].title.replace(/^New /, '')} appears in \u201c${nodeOf(c.folderId).name}\u201d as soon as Claude creates it`;
        const x = document.createElement('span');
        x.className = 'chip-x';
        x.textContent = '\u2715';
        x.title = 'Don\u2019t save this one in a folder';
        x.addEventListener('click', () => { state.autoFile = null; state.lastFolderId = null; renderToolbar(); syncSideSel(); });
        chip.appendChild(x);
      }
    } else {
      tEl.textContent = title;
    }
    document.title = title + ' \u2013 Claude Navigator';
    $('viewSeg').hidden = page || !!state.query || inLib;
    $('libSeg').hidden = !inLib;
    $('libAttachedBtn').hidden = !(inLib && state.loc.which === 'chats');
    const listView = !page;
    $('libFilterBtn').hidden = !listView;
    $('libSelectBtn').hidden = !listView;
    const fc = inLib ? activeFilterCount() : folderFilterCount();
    $('libFilterText').textContent = fc ? `Filter (${fc})` : 'Filter';
    $('libFilterBtn').classList.toggle('on', fc > 0);
    $('libSelectBtn').classList.toggle('on', !!state.libSelectMode);
    $('libAttachedBtn').classList.toggle('on', !!state.libShowAttached);
    $('bRefreshLib').hidden = !inLib;
    $('bRefreshLib').disabled = lib.busy;
    $('libAll').classList.toggle('on', state.libFilter === 'all');
    $('libUnfiled').classList.toggle('on', state.libFilter === 'unfiled');
    $('vIcons').classList.toggle('on', state.view === 'icons');
    $('vList').classList.toggle('on', state.view === 'list');
    $('bReload').hidden = !page;
    $('bExternal').hidden = !page;
    $('bSave').hidden = !page;
    if (page) {
      const c = pageContext();
      const f = nodeOf(c.folderId || state.lastFolderId);
      const saved = c.status === 'saved';
      $('bSave').hidden = c.status === 'pending' || isBlankClaudePage(state.pageUrl);
      $('bSave').firstElementChild.innerHTML = saved ? UI.starFilled : UI.star;
      $('bSaveText').textContent = saved ? 'Saved' : f ? `Save to ${f.name}` : 'Save';
      $('bSave').title = (saved ? 'Already saved. Click to save another copy' : 'Save this page') +
        (f ? ` in \u201c${f.name}\u201d` : '') + ` (${K.mod}S)`;
    }
    const here = newHereFolder();
    $('bNewChat').title = `New Chat${here ? ` in \u201c${nodeOf(here).name}\u201d` : ''} (${K.mod}N)`;
  }

  function renderAll() { renderSide(); renderMain(); renderToolbar(); syncSideSel(); }

  // ---------- Navigation (Finder-style back and forward) ----------
  const sameLoc = (a, b) => !!(a && b && a.kind === b.kind && (a.kind === 'folder' ? a.id === b.id
    : a.kind === 'library' ? a.which === b.which : normUrl(a.url) === normUrl(b.url)));

  function go(loc, { push = true } = {}) {
    state.autoFile = null;
    state.pendingClick = null;
    if (loc.kind === 'page') {
      const opened = savedLinksFor(loc.url);
      if (opened.length) { opened.forEach(n => { n.opened = Date.now(); }); save(); }
    }
    if (loc.kind === 'page' && !isApp) {
      // A browser cannot show Claude inside this page, so use one reusable tab.
      const w = window.open(loc.url, 'claude-pane');
      if (w) w.focus();
      const hit = savedLinksFor(loc.url)[0];
      if (hit) { state.sideSel = hit.id; applySideSel(); }
      return;
    }
    if (loc.kind === 'folder' && loc.id && !nodeOf(loc.id)) loc = { kind: 'folder', id: null };
    if (loc.kind === 'page') loc.folderId = state.lastFolderId; // remember where Save should go
    clearQuery();
    if (push && !sameLoc(nav.hist[nav.pos], loc)) {
      nav.hist = nav.hist.slice(0, nav.pos + 1);
      nav.hist.push(loc);
      nav.pos = nav.hist.length - 1;
    }
    state.loc = loc;
    show();
  }

  function show() {
    const loc = state.loc;
    if (loc.kind === 'folder' && loc.id && activeProfile() && profileOf(loc.id) !== activeProfile()) {
      const other = profileOf(loc.id);
      state.profileId = other ? other.id : null;
      ls.set('claudeNavigator.activeProfile', state.profileId || '');
      applyProfileTheme();
      lastRevealed = null;
      renderSide();
    }
    if (loc.kind !== 'page') closeFind();
    state.libPage = 0;
    if (loc.kind === 'library') {
      libSel.clear(); libAnchor = null; state.lastFolderId = null; state.libPage = 0; refreshLibrary(false);
      // The Claude lists always open newest first (Last Edited); a heading click changes it until you leave.
      colsFor('library').sort = { col: 'edited', dir: 'desc' };
      if (CLAUDE_OTHER.includes(loc.which) && ls.get('claudeNavigator.claudeOtherOpen') !== '1') { ls.set('claudeNavigator.claudeOtherOpen', '1'); renderSide(); }
    }
    if (loc.kind === 'folder') {
      state.lastFolderId = loc.id;
      if (state.browseSel && !childrenOf(loc.id).some(c => c.id === state.browseSel)) state.browseSel = null;
    } else if (loc.kind === 'page' && view) {
      if (loc.folderId !== undefined) state.lastFolderId = nodeOf(loc.folderId) ? loc.folderId : null;
      let cur = '';
      try { cur = view.getURL(); } catch (e) { /* not attached yet */ }
      if (normUrl(cur) !== normUrl(loc.url)) {
        state.pageUrl = loc.url;
        state.pageTitle = '';
        if (viewReady) view.loadURL(loc.url).catch(() => { /* replaced by a newer page: fine */ });
        else view.setAttribute('src', loc.url);
      } else {
        syncNames(state.pageUrl, state.pageTitle); // already showing: catch up on its title
      }
    }
    ls.set(LOC_STORE, JSON.stringify({ loc, lastFolderId: state.lastFolderId }));
    renderMain();
    renderToolbar();
    syncSideSel();
  }

  function clearQuery() { if (state.query) { state.query = ''; searchEl.value = ''; } }
  function back() { if (nav.pos > 0) { nav.pos--; state.loc = nav.hist[nav.pos]; clearQuery(); show(); } }
  function forward() { if (nav.pos < nav.hist.length - 1) { nav.pos++; state.loc = nav.hist[nav.pos]; clearQuery(); show(); } }
  function up() {
    if (state.loc.kind === 'page') return go({ kind: 'folder', id: state.lastFolderId });
    const loc = locate(state.loc.id);
    if (!loc) return;
    go({ kind: 'folder', id: loc.parent ? loc.parent.id : null });
    state.browseSel = loc.node.id;
    applyBrowseSel();
  }

  function openNode(n, { newWindow = false } = {}) {
    if (!n) return;
    if (n.type === 'folder') return go({ kind: 'folder', id: n.id });
    if (newWindow) return openNewWindow(n.url);
    state.lastFolderId = folderIdOf(n.id);
    go({ kind: 'page', url: n.url });
  }
  function openNewWindow(url) {
    if (isApp) window.navigatorApp.openWindow(url);
    else window.open(url, '_blank');
  }
  function openExternal(url) {
    if (isApp) window.navigatorApp.openExternal(url);
    else window.open(url, '_blank');
  }
  // The folder a new chat should go in: the folder on screen, or the folder of the open page.
  function newHereFolder() {
    if (state.query) return null;
    if (state.loc.kind === 'folder') return state.loc.id;
    if (state.loc.kind === 'page') return pageContext().folderId;
    return null;
  }
  const isBlankClaudePage = url => { try { return /^\/(new|projects?)(\/|$)/.test(new URL(url).pathname) && !/^\/project\/[0-9a-f-]{8}/i.test(new URL(url).pathname); } catch (e) { return false; } };
  // What each kind of new thing opens, and which button the app presses for you there.
  const ARTIFACTS_PAGE = 'https://claude.ai/artifacts';
  const NEW_KINDS = {
    chat: { title: 'New chat', label: 'Chat', icon: 'chat', url: HOME },
    doc: { title: 'New doc', label: 'Doc', icon: 'doc', url: ARTIFACTS_PAGE, path: '/artifacts', click: '^docs?$', section: true, tile: 'Docs' },
    slides: { title: 'New slides', label: 'Slides', icon: 'slides', url: ARTIFACTS_PAGE, path: '/artifacts', click: '^slides$', section: true, tile: 'Slides' },
    design: { title: 'New design', label: 'Design', icon: 'design', url: ARTIFACTS_PAGE, path: '/artifacts', click: '^design$', section: true, tile: 'Design' },
    dashboard: { title: 'New dashboard', label: 'Dashboard', icon: 'dashboard', url: ARTIFACTS_PAGE, path: '/artifacts', click: '^(beta\\s*)?dashboard(\\s*beta)?$', section: true, tile: 'Dashboard' },
    project: { title: 'New project', label: 'Project', icon: 'project', url: 'https://claude.ai/projects', path: '/projects', click: '^(\\+\\s*)?(new|create) project$' },
    artifactChat: { title: 'New artifact', label: 'Artifact in a Chat', icon: 'artifact', url: HOME },
  };
  const ARTIFACT_KINDS = new Set(['doc', 'slides', 'design', 'dashboard']);

  // Addresses Claude gives to things it creates.
  const ITEM_RE = {
    chat: /^\/chat\/[0-9a-f-]{8,}/i,
    project: /^\/project\/[0-9a-f-]{8,}/i,
    artifact: /^\/(code\/)?(artifacts?|docs?|slides|designs?|dashboards?)\/(?!(new|create|edit)$)[A-Za-z0-9_-]{6,}/i,
  };
  const itemKindOf = path => Object.keys(ITEM_RE).find(k => ITEM_RE[k].test(path)) || null;
  const pathOf = url => { try { return new URL(url).pathname; } catch (e) { return ''; } };
  const knownItem = url => savedLinksFor(url).length > 0 ||
    ['chats', 'projects', 'artifacts'].some(k => (lib[k] || []).some(x => normUrl(x.url) === normUrl(url)));

  function newItemsMenu(folderId, suffix = '') {
    const add = kind => ({ label: `New ${NEW_KINDS[kind].label}${suffix}`, icon: NEW_KINDS[kind].icon, key: kind === 'chat' ? K.mod + 'N' : undefined, run: () => newInFolder(kind, folderId) });
    return [
      add('chat'),
      isApp && '-',
      isApp && add('doc'), isApp && add('slides'), isApp && add('design'), isApp && add('dashboard'),
      isApp && '-',
      isApp && add('project'), isApp && add('artifactChat'),
      '-',
    ];
  }

  // Presses a button or tile on a Claude page (for example "Docs" under "Make something new").
  const clickScript = (pattern, inSection) => `(async () => {
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const re = new RegExp(${JSON.stringify(pattern)}, 'i');
    const text = e => (e.innerText || e.getAttribute('aria-label') || '').replace(/\\s+/g, ' ').trim();
    for (let i = 0; i < 20; i++) {
      let scope = document;
      if (${inSection ? 'true' : 'false'}) {
        const head = [...document.querySelectorAll('h1,h2,h3,h4,p,span,div')].find(e => e.children.length === 0 && /make something new/i.test(e.textContent));
        scope = null;
        for (let n = head && head.parentElement, d = 0; n && d < 5; n = n.parentElement, d++) {
          if ([...n.querySelectorAll('*')].some(e => e.children.length === 0 && re.test(e.textContent.trim()))) { scope = n; break; }
        }
      }
      if (scope) {
        let el = [...scope.querySelectorAll('button, a, [role="button"], [role="menuitem"]')].find(e => re.test(text(e)));
        if (!el) {
          const leaf = [...scope.querySelectorAll('*')].find(e => e.children.length === 0 && re.test(e.textContent.trim()));
          if (leaf) el = leaf.closest('button, a, [role="button"], [role="menuitem"], [tabindex]') || leaf;
        }
        if (el) { el.click(); return 'clicked'; }
      }
      await sleep(400);
    }
    return 'not found';
  })()`;
  // Keeps trying (for example while Claude shows its "Just a moment" check) for up to 30 seconds.
  function runPendingClick(url) {
    const pc = state.pendingClick;
    if (!pc || !view || !pathOf(url).startsWith(pc.path)) return;
    if (pc.running && pc.runUrl === url) return;            // already trying on this page
    if (!pc.started) pc.started = Date.now();
    const run = pc.run = (pc.run || 0) + 1;
    pc.running = true;
    pc.runUrl = url;
    const giveUp = () => { if (state.pendingClick === pc) { state.pendingClick = null; toast(pc.fallback); } };
    // A page that is replaced mid-try never answers, so stop waiting after 10 seconds.
    const timeout = new Promise(res => setTimeout(() => res('timeout'), 10000));
    Promise.race([view.executeJavaScript(clickScript(pc.click, pc.section)), timeout]).then(res => {
      if (run !== pc.run) return;                           // a newer try has taken over
      pc.running = false;
      if (res === 'clicked') { if (state.pendingClick === pc) state.pendingClick = null; return; }
      if (Date.now() - pc.started > 30000) return giveUp();
      setTimeout(() => { let u = ''; try { u = view.getURL(); } catch (e) { /* ignore */ } runPendingClick(u); }, 1500);
    }).catch(() => {
      // The page changed under the script (for example Claude's check finished): try again on the new page.
      if (run !== pc.run) return;
      pc.running = false;
      if (Date.now() - pc.started > 30000) return giveUp();
      setTimeout(() => { let u = ''; try { u = view.getURL(); } catch (e) { /* ignore */ } runPendingClick(u); }, 1000);
    });
  }

  function newInFolder(kind = 'chat', folderId = newHereFolder()) {
    const k = NEW_KINDS[kind] || NEW_KINDS.chat;
    state.lastFolderId = folderId;
    go({ kind: 'page', url: k.url });
    const f = folderId && nodeOf(folderId) ? nodeOf(folderId).name : null;
    if (isApp && k.click) {
      state.pendingClick = {
        path: k.path, click: k.click, section: !!k.section,
        fallback: k.tile
          ? `Choose ${k.tile} under “Make something new”${f ? `. It will be saved in ${f}.` : '.'}`
          : `Click Create Project${f ? `. The new project will be saved in ${f}.` : '.'}`,
      };
      let current = '';
      try { current = view.getURL(); } catch (e) { /* not ready */ }
      runPendingClick(current);   // only presses now if that page is already showing
    }
    if (!isApp || !folderId) return;
    state.autoFile = { folderId, kind, lastPath: null, since: Date.now() };
    lastRevealed = null;
    renderToolbar();
    syncSideSel();
    if (kind === 'artifactChat') toast(`Ask Claude to make your artifact. The chat is saved in ${f} as soon as you send it.`);
    else if (kind === 'project') toast(`Name your project and click Create Project. It is saved in ${f}.`);
    else if (ARTIFACT_KINDS.has(kind)) toast(`Opening ${k.tile}. It is saved in ${f} once Claude creates it.`);
    else toast(`This chat is saved in ${f} as soon as you send your first message.`);
  }
  const newChat = () => newInFolder('chat');

  function fileNewItem(a, url, title) {
    state.autoFile = null;
    if (!nodeOf(a.folderId)) return;
    const link = addLink(a.folderId, realTitle(title), url, { autoName: true });
    if (a.kind !== 'chat' && a.kind !== 'project') { link.as = a.kind === 'artifactChat' ? 'artifact' : a.kind; save(); renderSide(); }
    toast(`Saved in ${nodeOf(a.folderId).name}`, true);
    renderToolbar();
    syncSideSel();
  }

  // Watches for the new thing to become real (Claude gives it its own address), then files it.
  // Also: starting a chat with Claude's own button while you work in a folder arms it for that folder,
  // and a new Doc / Slides / Design / Dashboard made from Claude's own menus gets a one-click Save offer.
  const offered = new Set();
  function checkAutoFile(url, title, fromPopup = false) {
    const path = pathOf(url);
    if (!path || (!fromPopup && state.loc.kind !== 'page')) return;
    const a = state.autoFile;
    const kind = itemKindOf(path);

    if (!a) {
      if (fromPopup) return offerSave(url, title, kind);
      if (/^\/new(\/|$)/.test(path) && state.lastFolderId && nodeOf(state.lastFolderId)) {
        state.autoFile = { folderId: state.lastFolderId, kind: 'chat', lastPath: path, since: Date.now(), auto: true };
        renderToolbar();
        syncSideSel();
        return;
      }
      return offerSave(url, title, kind);
    }

    // Docs, Slides, Design, Dashboard: the first new artifact address, in this window or a pop-up.
    if (ARTIFACT_KINDS.has(a.kind)) {
      if (kind === 'artifact' && !knownItem(url)) return fileNewItem(a, url, title);
      if (Date.now() - a.since > 30 * 60e3) state.autoFile = null;
      return;
    }
    if (fromPopup) return;

    // Chats and projects: the address Claude switches to right after the new-chat or projects page.
    const isProject = a.kind === 'project';
    const prev = a.lastPath;
    const cameFrom = isProject ? /^\/projects(\/|$)/ : /^\/new(\/|$)/;
    if (kind !== (isProject ? 'project' : 'chat')) {
      if (cameFrom.test(path)) a.lastPath = path;            // on the new-chat (or projects) page
      else if (prev) state.autoFile = null;                   // went somewhere else instead
      return;
    }
    if (!prev) return;                                        // a late signal from the page being left
    if (!cameFrom.test(prev) || knownItem(url)) { state.autoFile = null; return; }
    fileNewItem(a, url, title);
  }
  function offerSave(url, title, kind) {
    const ctx = pageContext();
    const chat = ctx.linkId && nodeOf(ctx.linkId);
    if (kind === 'artifact' && chat && kindOf(chat) === 'chat' && !knownItem(url) && !offered.has(normUrl(url))) {
      offered.add(normUrl(url));
      return toast(`New artifact from this chat. Attach it to \u201c${chat.name}\u201d?`, {
        label: 'Attach',
        run: () => { snap(); const l = Link(realTitle(title) || 'Untitled artifact', url); l.autoName = true; l.as = 'artifact'; insertInto(chat.id, l); commit(); toast(`Attached to \u201c${chat.name}\u201d`, true); },
      });
    }
    const f = nodeOf(state.lastFolderId);
    if (kind !== 'artifact' || !f || knownItem(url) || offered.has(normUrl(url))) return;
    offered.add(normUrl(url));
    toast(`New in Claude. Save it in ${f.name}?`, {
      label: `Save in ${f.name}`,
      run: () => { addLink(f.id, realTitle(title), url, { autoName: true }); toast(`Saved in ${f.name}`, true); },
    });
  }

  function showNewMenu(x, y, folderId = newHereFolder()) {
    const f = nodeOf(folderId);
    const where = f ? ` in “${f.name}”` : '';
    showMenu(x, y, [
      ...newItemsMenu(folderId, where),
      { label: `New Folder${where}`, icon: 'folder', key: K.mod + K.shift + 'N', run: () => newFolder(folderId) },
      { label: `Add Link${where}…`, icon: 'link', key: K.mod + 'L', run: () => promptNewLink(folderId) },
    ]);
  }

  // ---------- Claude pane (desktop app only) ----------
  let view = null, viewReady = false;
  if (isApp) {
    view = document.createElement('webview');
    view.setAttribute('partition', 'persist:claude');
    view.setAttribute('allowpopups', '');
    pane.appendChild(view);
    const update = () => {
      let url = '', title = '';
      try { url = view.getURL(); title = view.getTitle(); } catch (e) { return; }
      if (!url || url === 'about:blank') return;
      if (state.pageUrl && /^\/chat\//.test(pathOf(state.pageUrl)) && itemKindOf(pathOf(url)) === 'artifact') addRelation(state.pageUrl, url);
      state.pageUrl = url;
      state.pageTitle = title;
      // Moving around inside Claude updates the current history entry rather than adding one.
      syncNames(url, title);
      checkAutoFile(url, title);
      runPendingClick(url);
      if (state.loc.kind === 'page') {
        state.loc.url = url;
        ls.set(LOC_STORE, JSON.stringify({ loc: state.loc, lastFolderId: state.lastFolderId }));
      }
      renderToolbar();
      syncSideSel();
    };
    view.addEventListener('dom-ready', () => { viewReady = true; update(); setTimeout(collapseClaudeSidebar, 600); });
    ['did-navigate', 'did-navigate-in-page', 'page-title-updated'].forEach(ev => view.addEventListener(ev, update));
    view.addEventListener('did-start-loading', () => $('progress').classList.add('on'));
    view.addEventListener('did-stop-loading', () => { $('progress').classList.remove('on'); update(); });
    ['did-stop-loading', 'did-navigate-in-page'].forEach(ev => view.addEventListener(ev, () => harvestPaneSoon()));
  }

  // ---------- Claude's own sidebar: hidden by default ----------
  // Presses Claude's own "close sidebar" button once per page load, so Claude remembers it.
  // You can still open it with Claude's button; turn this off in the ... menu.
  const HIDE_SIDEBAR_STORE = 'claudeNavigator.hideClaudeSidebar';
  const hideClaudeSidebar = () => ls.get(HIDE_SIDEBAR_STORE) !== 'off';
  const COLLAPSE_SCRIPT = `(async () => {
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    for (let i = 0; i < 12; i++) {
      const navs = [...document.querySelectorAll('nav, aside, [data-testid*="sidebar" i]')].filter(el => {
        const r = el.getBoundingClientRect();
        return r.left < 40 && r.height > innerHeight * 0.6;
      });
      const nav = navs.sort((a, b) => b.getBoundingClientRect().width - a.getBoundingClientRect().width)[0];
      if (nav) {
        if (nav.getBoundingClientRect().width < 120) return 'already collapsed';
        const label = b => (b.getAttribute('aria-label') || b.getAttribute('title') || '') + ' ' + (b.getAttribute('data-testid') || '');
        const btn = [...document.querySelectorAll('button')].find(b => /sidebar/i.test(label(b)) && !/open|expand/i.test(label(b)));
        if (btn) { btn.click(); return 'collapsed'; }
      }
      await sleep(500);
    }
    return 'not found';
  })()`;
  function collapseClaudeSidebar() {
    if (!isApp || !hideClaudeSidebar() || !/^https:\/\/claude\.ai\//.test(state.pageUrl || '')) return;
    view.executeJavaScript(COLLAPSE_SCRIPT).catch(() => {});
  }
  function showClaudeSidebar() {
    if (!isApp) return;
    view.executeJavaScript(`(() => {
      const label = b => (b.getAttribute('aria-label') || b.getAttribute('title') || '') + ' ' + (b.getAttribute('data-testid') || '');
      const btn = [...document.querySelectorAll('button')].find(b => /sidebar/i.test(label(b)) && /open|expand|show|toggle/i.test(label(b)))
        || [...document.querySelectorAll('button')].find(b => /sidebar/i.test(label(b)));
      if (btn) btn.click();
    })()`).catch(() => {});
  }
  function setHideClaudeSidebar(on) {
    ls.set(HIDE_SIDEBAR_STORE, on ? 'on' : 'off');
    if (on) collapseClaudeSidebar();
    toast(on ? 'Claude\u2019s own sidebar will be hidden' : 'Claude\u2019s own sidebar is left as you set it. Use Claude\u2019s sidebar button to show it.');
  }

  // Saved items that picked up a generic page title (for example "Claude Code") get their real name back.
  function repairGenericNames() {
    const known = new Map();
    for (const k of Object.keys(LIB_KINDS)) for (const x of lib[k] || []) if (hasWords(x.name) && !GENERIC_TITLE.test(x.name.trim())) known.set(normUrl(x.url), x.name);
    let fixed = 0;
    walk(state.tree, n => {
      if (n.type !== 'link' || n.autoName === false || !GENERIC_TITLE.test((n.name || '').trim())) return;
      const real = known.get(normUrl(n.url));
      if (real) { n.name = real; n.autoName = true; fixed++; }
    });
    if (fixed) { save(); renderAll(); }
    return fixed;
  }

  // ---------- Claude Library: loading ----------
  async function refreshLibrary(force = false) {
    if (!isApp || lib.busy) return;
    if (!force && lib.fetchedAt && Date.now() - lib.fetchedAt < 5 * 60e3) return;
    lib.busy = true;
    libChanged();
    try {
      const r = await window.navigatorApp.refreshLibrary({
        scanned: lib.scanned,
        knownArtifacts: (lib.artifacts || []).concat(lib.design || []).map(x => x.url),
      });
      lib.signedIn = r.signedIn !== false;
      if (lib.signedIn) {
        for (const k of Object.keys(LIB_KINDS)) {
          if (!Array.isArray(r[k]) || !r[k].length) continue;
          if (k === 'chats' || k === 'projects') { lib[k] = r[k]; continue; }   // complete lists from Claude
          // Lists read from Claude's pages can come back short if a page is slow, so add to what we
          // have instead of replacing it: new items first, and nothing already known is dropped.
          const fresh = new Map(r[k].map(x => [normUrl(x.url), x]));
          const keep = (lib[k] || []).filter(x => !fresh.has(normUrl(x.url)));
          lib[k] = r[k].map(x => {
            const old = (lib[k] || []).find(o => normUrl(o.url) === normUrl(x.url));
            return old && !hasWords(x.name) && hasWords(old.name) ? Object.assign({}, x, { name: old.name }) : x;
          }).concat(keep);
        }
        lib.fetchedAt = Date.now();
      }
      // Links Claude's chats reveal: remember them, then tuck artifacts under their chats where both sit in one folder.
      if (r.scanned) Object.assign(lib.scanned, r.scanned);
      for (const [c, a] of r.relations || []) if (!isDetached(c, a)) addRelation(c, a);
      autoAttachSiblings();
      repairGenericNames();
      lib.error = r.chats && r.chats.length ? null : ((r.notes || []).join('; ') || null);
    } catch (err) {
      lib.error = String((err && err.message) || err);
    }
    lib.busy = false;
    saveLib();
    libChanged();
  }
  function libChanged() {
    renderSide();
    if (state.loc.kind === 'library') renderMain();
    renderToolbar();
  }
  // Add chats Claude shows in its own sidebar, and pick up renamed ones, between full refreshes.
  function mergeLib(kind, found) {
    if (!Array.isArray(found) || !found.length) return;
    const byUrl = new Map(lib[kind].map(x => [normUrl(x.url), x]));
    let changed = false;
    for (const f of found) {
      const k = normUrl(f.url);
      const ex = byUrl.get(k);
      if (ex) {
        if (f.name && ex.name !== f.name && !/^untitled/i.test(f.name)) { ex.name = f.name; changed = true; }
      } else {
        const x = { name: f.name || 'Untitled', url: f.url, updated: new Date().toISOString() };   // just seen in Claude: recent
        lib[kind].unshift(x);
        byUrl.set(k, x);
        changed = true;
      }
    }
    if (changed) { saveLib(); libChanged(); }
  }
  let harvestTimer = null;
  function harvestPaneSoon() {
    if (!isApp) return;
    clearTimeout(harvestTimer);
    harvestTimer = setTimeout(async () => {
      try {
        if (!/^https:\/\/claude\.ai\//.test(state.pageUrl)) return;
        const id = view.getWebContentsId();
        mergeLib('chats', await window.navigatorApp.harvestPane(id, 'chats'));
        if (/^\/artifacts?(\/|$)/.test(new URL(state.pageUrl).pathname)) mergeLib('artifacts', await window.navigatorApp.harvestPane(id, 'artifacts'));
      } catch (e) { /* page not ready yet */ }
    }, 2000);
  }

  // When Claude gives a chat its title, or you rename it in Claude, saved links follow.
  function syncNames(url, title) {
    const t = realTitle(title);
    if (!t) return;
    let changed = false;
    for (const n of savedLinksFor(url)) {
      if (isAutoName(n) && n.name !== t) { n.name = t; n.autoName = true; changed = true; }
    }
    if (changed) { save(); renderSide(); }
  }

  // ---------- Find on page (Claude pane) ----------
  const findbar = $('findbar'), findInput = $('findInput');
  let findText = '';
  const pageShowing = () => isApp && state.loc.kind === 'page' && !state.query;
  function openFind() {
    if (!pageShowing()) { searchEl.focus(); searchEl.select(); return; }
    findbar.hidden = false;
    findInput.focus();
    findInput.select();
  }
  function closeFind() {
    if (findbar.hidden) return;
    findbar.hidden = true;
    findText = '';
    $('findCount').textContent = '';
    try { view.stopFindInPage('clearSelection'); } catch (e) { /* ignore */ }
    if (pageShowing()) view.focus();
  }
  function findStep(forward = true) {
    if (!pageShowing()) return;
    if (findbar.hidden || !findInput.value) return openFind();
    const t = findInput.value;
    view.findInPage(t, { forward, findNext: t === findText });
    findText = t;
  }
  if (isApp) {
    findInput.addEventListener('input', () => {
      const t = findInput.value;
      findText = '';
      if (!t) { view.stopFindInPage('clearSelection'); $('findCount').textContent = ''; return; }
      view.findInPage(t);
      findText = t;
    });
    findInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); findStep(!e.shiftKey); }
      if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
    });
    $('findNext').addEventListener('click', () => findStep(true));
    $('findPrev').addEventListener('click', () => findStep(false));
    $('findDone').addEventListener('click', closeFind);
    view.addEventListener('found-in-page', e => {
      const r = e.result;
      if (r.matches !== undefined) $('findCount').textContent = r.matches ? `${r.activeMatchOrdinal} of ${r.matches}` : 'Not found';
      if (!findbar.hidden && document.activeElement !== findInput) findInput.focus();
    });
  }

  // ---------- Editing ----------
  // New things go where you are: the folder on screen, or the folder you came from.
  function hereFolder() {
    if (state.query) return null;
    return state.loc.kind === 'folder' ? state.loc.id : state.lastFolderId;
  }
  function insertInto(folderId, node) {
    const f = folderId ? nodeOf(folderId) : null;
    if (f && !f.children) f.children = [];
    (f ? f.children : rootList()).push(node);
    if (f) f.open = true;
    if (f && f.type === 'link' && node.url) addRelation(f.url, node.url);   // attached to a chat
  }
  function toggle(n, force) {
    if (!n || !n.children) return;
    n.open = force === undefined ? !n.open : force;
    save();
    renderSide();
  }
  const showingFolder = id => state.loc.kind === 'folder' && state.loc.id === id && !state.query;

  function newFolder(parentId = hereFolder()) {
    snap();
    const f = Folder('untitled folder');
    insertInto(parentId, f);
    commit();
    if (showingFolder(parentId)) {
      state.browseSel = f.id;
      applyBrowseSel();
      startRename(f.id, browseEl);
    } else {
      state.sideSel = f.id;
      applySideSel();
      startRename(f.id, treeEl);
    }
  }

  function addLink(parentId, name, url, { rename = false, autoName = !name } = {}) {
    snap();
    const l = Link(name || guessName(url), url);
    l.autoName = autoName;
    if (autoName && isApp && normUrl(url) === normUrl(state.pageUrl) && realTitle(state.pageTitle)) l.name = realTitle(state.pageTitle);
    insertInto(parentId, l);
    commit();
    const inView = showingFolder(parentId);
    if (inView) { state.browseSel = l.id; applyBrowseSel(); }
    if (rename) startRename(l.id, inView ? browseEl : treeEl);
    return l;
  }

  function removeNode(id) {
    const loc = locate(id);
    if (!loc) return;
    const n = loc.node;
    if (n.children && n.children.length) {
      let c = 0;
      walk(n.children, () => c++);
      const what = n.type === 'folder' ? `the ${c} item${c === 1 ? '' : 's'} inside it` : `its ${c} attached item${c === 1 ? '' : 's'}`;
      if (!confirm(`Delete \u201c${n.name}\u201d and ${what}?`)) return;
    }
    snap();
    if (state.loc.kind === 'folder' && state.loc.id && contains(id, state.loc.id)) {
      state.loc = { kind: 'folder', id: loc.parent ? loc.parent.id : null };
      nav.hist[nav.pos] = state.loc;
    }
    loc.list.splice(loc.index, 1);
    if (state.browseSel === id) state.browseSel = null;
    commit();
    toast(`Deleted “${n.name}”`, true);
  }

  const attachable = n => n && n.type === 'link' && kindOf(n) !== 'chat';
  const siblingChats = n => { const l = locate(n.id); return l ? l.list.filter(x => x !== n && x.type === 'link' && kindOf(x) === 'chat') : []; };
  function detach(id) {
    const l = locate(id);
    if (!l || !l.parent || l.parent.type !== 'link') return;
    const chat = l.parent;
    snap();
    l.list.splice(l.index, 1);
    const pl = locate(chat.id);
    pl.list.splice(pl.index + 1, 0, l.node);
    removeRelation(chat.url, l.node.url);
    const pair = normUrl(chat.url) + '|' + normUrl(l.node.url);
    if (!lib.detached.includes(pair)) lib.detached.push(pair);
    saveLib();
    commit();
    toast(`Detached \u201c${l.node.name}\u201d from \u201c${chat.name}\u201d`, true);
  }
  function attachTo(id, chatId) {
    const n = nodeOf(id), chat = nodeOf(chatId);
    if (!attachable(n) || !chat) return;
    lib.detached = lib.detached.filter(p => p !== normUrl(chat.url) + '|' + normUrl(n.url));
    if (moveNodes([id], { id: chatId, zone: 'into' })) { commit(); toast(`Attached \u201c${n.name}\u201d to \u201c${chat.name}\u201d`, true); }
  }

  function removeNodes(ids) {
    ids = outermost(ids);
    if (!ids.length) return;
    if (ids.length === 1) return removeNode(ids[0]);
    let inside = 0;
    ids.forEach(id => { const n = nodeOf(id); if (n.type === 'folder') walk(n.children, () => inside++); });
    if (inside && !confirm(`Delete these ${ids.length} items, and the ${inside} item${inside === 1 ? '' : 's'} inside the selected folders?`)) return;
    snap();
    for (const id of ids) {
      const l = locate(id);
      if (!l) continue;
      if (state.loc.kind === 'folder' && state.loc.id && contains(id, state.loc.id)) {
        state.loc = { kind: 'folder', id: l.parent ? l.parent.id : null };
        nav.hist[nav.pos] = state.loc;
      }
      l.list.splice(l.index, 1);
    }
    state.browseSel = null;
    multi.browse.clear();
    multi.side.clear();
    commit();
    toast(`Deleted ${ids.length} items`, true);
  }
  // Moves items into a folder (or before or after a sidebar row), keeping their order.
  function moveNodes(ids, t) {
    ids = outermost(ids);
    if (!ids.length) return false;
    if (t.id && ids.some(id => contains(id, t.id))) return false;
    const target = t.zone === 'into' && t.id ? nodeOf(t.id) : null;
    if (target && target.type === 'link') ids = ids.filter(id => attachable(nodeOf(id)));   // only non-chat items attach to a chat
    if (!ids.length) return false;
    if (t.zone === 'into' && ids.every(id => parentIdOf(id) === t.id)) return false;    // already there
    snap();
    const nodes = ids.map(id => { const l = locate(id); l.list.splice(l.index, 1); return l.node; });
    if (t.zone === 'into' || !t.id) nodes.forEach(n => insertInto(t.id, n));
    else { const tgt = locate(t.id); tgt.list.splice(tgt.index + (t.zone === 'after' ? 1 : 0), 0, ...nodes); }
    return true;
  }
  function moveManyPrompt(ids) {
    ids = outermost(ids);
    openDialog({
      title: `Move ${ids.length} items to:`, folderId: parentIdOf(ids[0]), excludeId: ids, folderOnly: true,
      onSave: ({ folderId }) => { if (moveNodes(ids, { id: folderId, zone: 'into' })) { commit(); toast(`Moved ${ids.length} items to ${folderId ? nodeOf(folderId).name : 'the top level'}`, true); } },
    });
  }
  // Finder's "New Folder with Selection".
  function newFolderWith(ids, scope) {
    ids = outermost(ids);
    if (!ids.length) return;
    const first = locate(ids[0]);
    snap();
    const f = Folder('New Folder With Items');
    f.open = true;
    first.list.splice(first.index, 0, f);
    for (const id of ids) { const l = locate(id); l.list.splice(l.index, 1); f.children.push(l.node); }
    multi.browse.clear();
    multi.side.clear();
    const inView = state.loc.kind === 'folder' && state.loc.id === (first.parent ? first.parent.id : null) && scope === browseEl;
    state.browseSel = inView ? f.id : null;
    commit();
    if (inView) { applyBrowseSel(); startRename(f.id, browseEl); }
    else { state.sideSel = f.id; applySideSel(); startRename(f.id, treeEl); }
  }
  function menuForMany(ids, scope) {
    const links = ids.map(nodeOf).filter(n => n && n.type === 'link');
    const n = ids.length;
    return [
      { label: `New Folder with ${n} Items`, run: () => newFolderWith(ids, scope) },
      { label: `Move ${n} Items To\u2026`, run: () => moveManyPrompt(ids) },
      links.length > 0 && { label: `Copy ${links.length} Link${links.length === 1 ? '' : 's'}`, run: () => navigator.clipboard.writeText(links.map(l => l.url).join('\n')).then(() => toast('Links copied')) },
      links.length > 0 && links.length <= 8 && { label: `Open ${links.length} in New Windows`, run: () => links.forEach(l => openNewWindow(l.url)) },
      '-',
      { label: `Delete ${n} Items`, key: K.del, run: () => removeNodes(ids) },
    ];
  }

  function duplicate(id) {
    const loc = locate(id);
    if (!loc) return;
    snap();
    const copy = JSON.parse(JSON.stringify(loc.node));
    const reid = x => { x.id = uid(); if (x.children) x.children.forEach(reid); };
    reid(copy);
    copy.name += ' copy';
    loc.list.splice(loc.index + 1, 0, copy);
    commit();
  }

  function sortFolder(id) {
    snap();
    childrenOf(id).sort((a, b) => (a.type === b.type ? 0 : a.type === 'folder' ? -1 : 1) ||
      a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
    commit();
  }
  function setAllOpen(open) { walk(state.tree, n => { if (n.type === 'folder') n.open = open; }); save(); renderSide(); }

  function startRename(id, scope) {
    const el = scope === browseEl ? browseItemEl(id) : sideRowEl(id);
    const n = nodeOf(id);
    if (!el || !n) return;
    el.scrollIntoView({ block: 'nearest' });
    const label = el.querySelector('.label');
    const input = document.createElement('input');
    input.className = 'rename-input';
    input.value = n.name;
    label.replaceChildren(input);
    el.draggable = false;
    input.focus();
    input.select();
    let done = false;
    const finish = ok => {
      if (done) return;
      done = true;
      const v = input.value.trim();
      if (ok && v && v !== n.name) { snap(); n.name = v; n.autoName = false; }
      commit();
      (scope === browseEl ? browseEl : treeEl).focus({ preventScroll: true });
    };
    input.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
    ['mousedown', 'click', 'dblclick'].forEach(ev => input.addEventListener(ev, e => e.stopPropagation()));
  }

  // ---------- Link dialog ----------
  const dlg = $('linkDlg'), fName = $('linkName'), fUrl = $('linkUrl'), picker = $('picker');
  let dlgDone = null;

  // A folder browser, like the one in a Mac Save dialog: open folders, pick one, or make a new one.
  const pick = { value: null, open: new Set(), exclude: [] };
  const pickable = n => n.type === 'folder' && !pick.exclude.includes(n.id) && !pick.exclude.some(x => contains(x, n.id));
  function folderOptions(selectedId, excludeId) {
    pick.exclude = [].concat(excludeId || []);
    pick.value = selectedId && nodeOf(selectedId) && pickable(nodeOf(selectedId)) ? selectedId : null;
    pick.open = new Set();
    for (const p of pathTo(pick.value)) pick.open.add(p.id);   // show where it currently is
    renderPicker();
  }
  function renderPicker(scroll = true) {
    const frag = document.createDocumentFragment();
    const row = (id, name, depth, hasKids, open, icon) => {
      const d = document.createElement('div');
      d.className = 'pk' + (pick.value === id ? ' sel' : '');
      d.dataset.id = id || '';
      d.style.setProperty('--d', depth);
      d.innerHTML = `<span class="tw${open ? ' open' : ''}">${hasKids ? UI.chev : ''}</span>${icon}<span class="nm2"></span>`;
      d.querySelector('.nm2').textContent = name;
      frag.appendChild(d);
    };
    const ap = activeProfile();
    row(null, ap ? ap.name : 'Top level', 0, false, false, ap ? `<span class="pdot" style="background:${ap.color}"></span>` : small('folder', KIND_COLOUR.folder));
    const add = (nodes, depth) => {
      for (const n of nodes) {
        if (!pickable(n)) continue;
        const kids = n.children.filter(pickable);
        const open = pick.open.has(n.id);
        row(n.id, n.name, depth, kids.length > 0, open, SMALL_FOLDER);
        if (open) add(kids, depth + 1);
      }
    };
    add(rootList(), 0);
    picker.replaceChildren(frag);
    const path = displayPath(pick.value).map(p => p.name).join(' \u203a ');
    $('pickPath').textContent = path || (activeProfile() ? activeProfile().name : 'Top level');
    const sel = picker.querySelector('.pk.sel');
    if (sel && scroll) sel.scrollIntoView({ block: 'nearest' });
  }
  picker.addEventListener('mousedown', e => {
    const r = e.target.closest('.pk');
    if (!r || e.target.closest('input')) return;
    const id = r.dataset.id || null;
    if (e.target.closest('.tw') && id) {
      if (pick.open.has(id)) pick.open.delete(id); else pick.open.add(id);
      return renderPicker(false);
    }
    // Just selecting: update in place so a double-click still lands on the same row.
    pick.value = id;
    picker.querySelectorAll('.pk.sel').forEach(x => x.classList.remove('sel'));
    r.classList.add('sel');
    $('pickPath').textContent = displayPath(id).map(p => p.name).join(' \u203a ') || (activeProfile() ? activeProfile().name : 'Top level');
  });
  picker.addEventListener('dblclick', e => {
    const r = e.target.closest('.pk');
    if (!r || !r.dataset.id || e.target.closest('.tw')) return;
    const id = r.dataset.id;
    if (pick.open.has(id)) pick.open.delete(id); else pick.open.add(id);
    renderPicker(false);
  });
  picker.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const ids = [...picker.querySelectorAll('.pk')].map(r => r.dataset.id || null);
    const i = ids.indexOf(pick.value);
    if (e.key === 'ArrowDown') pick.value = ids[Math.min(ids.length - 1, i + 1)];
    else if (e.key === 'ArrowUp') pick.value = ids[Math.max(0, i - 1)];
    else if (e.key === 'ArrowRight' && pick.value) pick.open.add(pick.value);
    else if (e.key === 'ArrowLeft' && pick.value) {
      if (pick.open.has(pick.value)) pick.open.delete(pick.value);
      else { const l = locate(pick.value); pick.value = l && l.parent ? l.parent.id : null; }
    } else return;
    e.preventDefault();
    renderPicker();
  });
  // New Folder inside the selected one, named straight away.
  $('pickNew').addEventListener('click', () => {
    snap();
    const f = Folder('untitled folder');
    insertInto(pick.value, f);
    if (pick.value) pick.open.add(pick.value);
    commit();
    pick.value = f.id;
    renderPicker();
    const r = picker.querySelector('.pk.sel .nm2');
    if (!r) return;
    const input = document.createElement('input');
    input.value = f.name;
    r.replaceChildren(input);
    input.focus();
    input.select();
    let done = false;
    const finish = ok => {
      if (done) return;
      done = true;
      const v = input.value.trim();
      if (ok && v) { f.name = v; commit(); }
      renderPicker();
      picker.focus();
    };
    input.addEventListener('keydown', ev => {
      ev.stopPropagation();
      if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
      if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
    });
    input.addEventListener('blur', () => finish(true));
  });
  function openDialog({ title, name = '', url = '', folderId = null, excludeId = null, folderOnly = false, nameOnly = false, okLabel = 'Save', onSave }) {
    $('linkDlgTitle').textContent = title;
    $('lblName').hidden = folderOnly;
    $('lblUrl').hidden = folderOnly || nameOnly;
    fUrl.required = !folderOnly && !nameOnly;
    $('linkOk').textContent = okLabel;
    fName.value = name;
    fUrl.value = url;
    folderOptions(folderId, excludeId);
    dlgDone = onSave;
    dlg.returnValue = '';

  function editLink(id) {

    openDialog({
      title: 'Edit Link', name: loc.node.name, url: loc.node.url, folderId: loc.parent ? loc.parent.id : null,
      onSave: ({ name, url, folderId }) => {

  // File Library items into a folder (or before or after a sidebar row).
  function fileLibItems(items, t) {
    items = (items || []).filter(x => x && x.url);
    if (!items.length || !t) return;
    snap();
    const nodes = items.map(x => {
      const l = Link(hasWords(x.name) ? x.name : guessName(x.url), x.url);
      const k = libKind(x, state.loc.kind === 'library' ? state.loc.which : 'artifacts');
      if (!['chat', 'project', 'link'].includes(k)) l.as = k;
      l.autoName = true;
      return l;
    });
    for (const node of nodes) {
      if (kindOf(node) !== 'chat') continue;
      const extra = relatedFor(node.url).filter(a => !savedLinksFor(a.url).length).map(a => {
        const l = Link(hasWords(a.name) ? a.name : 'Untitled artifact', a.url);
        const k = libKind(a, a.list);
        if (!['chat', 'project', 'link'].includes(k)) l.as = k;
        l.autoName = true;
        return l;
      });
      if (extra.length) { node.children = extra; node.open = true; }
    }
    const intoFolder = t.zone === 'into' || !t.id;
    if (intoFolder && t.id && nodeOf(t.id) && nodeOf(t.id).type === 'link') {
      const keep = nodes.filter(attachable);                    // only non-chat items attach to a chat
      if (!keep.length) { undoStack.pop(); return toast('Only artifacts and other items can be attached to a chat'); }
      nodes.length = 0;
      nodes.push(...keep);
    }
    const destChats = intoFolder ? childrenOf(t.id).filter(x => x.type === 'link' && kindOf(x) === 'chat') : [];
    const placed = [];
    for (const node of nodes) {
      const home = attachable(node) && destChats.find(c => relatedFor(c.url).some(a => normUrl(a.url) === normUrl(node.url)));
      if (home) { insertInto(home.id, node); placed.push(node); }
    }
    const rest = nodes.filter(n => !placed.includes(n));
    if (intoFolder) rest.forEach(n => insertInto(t.id, n));
    else {
      const tgt = locate(t.id);
      tgt.list.splice(tgt.index + (t.zone === 'after' ? 1 : 0), 0, ...rest);
    }
    commit();
    const f = intoFolder ? nodeOf(t.id) : (locate(t.id) || {}).parent;
    const what = nodes.length === 1 ? `\u201c${nodes[0].name}\u201d` : `${nodes.length} items`;
    toast(f && f.type === 'link' ? `Attached ${what} to \u201c${f.name}\u201d` : `Filed ${what} in ${f ? f.name : 'the top level'}`, true);
  }
  function fileLibPrompt(items) {
    if (!items.length) return;
    openDialog({
      title: items.length === 1 ? `File \u201c${items[0].name}\u201d in:` : `File ${items.length} items in:`,
      folderId: state.lastFolderId, folderOnly: true,
      onSave: ({ folderId }) => fileLibItems(items, { id: folderId, zone: 'into' }),
    });
  }

  // Save As: choose a name and browse to the folder (also used whenever the page is not in a folder yet).
  function saveAs() {
    if (!isApp || state.loc.kind !== 'page') return promptNewLink();
    if (state.autoFile) return toast('Send your first message. It is saved automatically after that.');
    if (isBlankClaudePage(state.pageUrl)) return toast('Nothing to save yet. Start the chat first.');
    const url = state.pageUrl;
    const c = pageContext();
    openDialog({
      title: 'Save As', name: realTitle(state.pageTitle) || guessName(url), url,
      folderId: c.folderId || state.lastFolderId, nameOnly: true,
      onSave: ({ name, folderId }) => {

        addLink(folderId, name || realTitle(state.pageTitle) || guessName(url), url, { autoName: !typed });

        renderToolbar();

  function saveCurrent(folderId = state.lastFolderId) {

  // ---------- Context menus ----------
  const menu = $('menu');
  let lastMenuX = 0, lastMenuY = 0;
  function showMenu(x, y, items, { above = false } = {}) {
    lastMenuX = x;
    lastMenuY = y;
    menu.replaceChildren();
    const checks = items.some(it => it && it !== '-' && it.checked !== undefined);
    const icons = items.some(it => it && it !== '-' && (it.icon || it.dot));
    for (const it of items) {
      if (!it) continue;
      if (it === '-') { if (menu.lastChild && menu.lastChild.tagName !== 'HR') menu.appendChild(document.createElement('hr')); continue; }
      const b = document.createElement('button');
      b.setAttribute('role', 'menuitem');
      b.innerHTML = `${checks ? `<span class="ck">${it.checked ? '\u2713' : ''}</span>` : ''}${icons ? `<span class="mi">${it.dot ? `<span class="pdot${it.dot === 'all' ? ' all' : ''}" style="${it.dot === 'all' ? '' : `background:${it.dot}`}"></span>` : it.icon ? small(it.icon, KIND_COLOUR[it.icon] || 'currentColor', 15) : ''}</span>` : ''}<span class="lb"></span>${it.key ? `<span class="k">${it.key}</span>` : ''}`;
      b.querySelector('.lb').textContent = it.label;
      b.disabled = !!it.disabled;
      b.addEventListener('click', () => { hideMenu(); it.run(); });
      menu.appendChild(b);
    }
    if (menu.lastChild && menu.lastChild.tagName === 'HR') menu.lastChild.remove();
    menu.classList.add('show');
    const r = menu.getBoundingClientRect();
    if (above) y -= r.height;
    menu.style.left = Math.max(4, Math.min(x, innerWidth - r.width - 6)) + 'px';
    menu.style.top = Math.max(4, Math.min(y, innerHeight - r.height - 6)) + 'px';
  }
  function hideMenu() { menu.classList.remove('show'); }
  document.addEventListener('mousedown', e => { if (!menu.contains(e.target)) hideMenu(); });
  window.addEventListener('blur', hideMenu);
  window.addEventListener('resize', hideMenu);

  function menuFor(n, scope) {

    return [
      { label: 'Open', key: K.open, run: () => openNode(n) },
      { label: 'Open in New Window', run: () => openNewWindow(n.url) },
      { label: 'Open in Web Browser', run: () => openExternal(n.url) },
      searching && { label: 'Show in Enclosing Folder', run: () => revealInFolder(n.id) },
      '-',
      { label: 'Rename', key: K.rename, run: () => startRename(n.id, scope) },
      { label: 'Edit Link…', run: () => editLink(n.id) },
      { label: 'Move To…', run: () => moveTo(n.id) },
      { label: 'Duplicate', run: () => duplicate(n.id) },
      { label: 'Copy Link', run: () => navigator.clipboard.writeText(n.url).then(() => toast('Link copied')) },
      { label: 'Change Icon\u2026', run: () => chooseKindMenu(lastMenuX, lastMenuY, kindOf(n), k => { snap(); n.as = k; commit(); }) },
      '-',
      attachedTo(n.id) && { label: `Detach from \u201c${attachedTo(n.id).name}\u201d`, run: () => detach(n.id) },
      !attachedTo(n.id) && attachable(n) && siblingChats(n).length > 0 && { label: 'Attach to Chat\u2026', run: () =>
        showMenu(lastMenuX, lastMenuY, siblingChats(n).map(c => ({ label: c.name, icon: 'chat', run: () => attachTo(n.id, c.id) }))) },
      kindOf(n) === 'chat' && n.children && n.children.length > 0 && { label: `Detach ${n.children.length} Attached Item${n.children.length === 1 ? '' : 's'}`, run: () => n.children.slice().forEach(c => detach(c.id)) },
      savePage && { label: 'Point to Current Claude Page', run: () => { snap(); n.url = state.pageUrl; commit(); toast('Link updated'); } },
      '-',

  function revealInFolder(id) {
    const loc = locate(id);

    go({ kind: 'folder', id: loc.parent ? loc.parent.id : null });
    state.browseSel = id;
    applyBrowseSel();

  function setView(v) {
