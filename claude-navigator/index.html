<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Navigator</title>
<style>
  :root {
    --side-w: 240px;
    --win: #ffffff;
    --side: #ececec;
    --line: #dedede;
    --text: #1d1d1f;
    --muted: #86868b;
    --hover: rgba(0,0,0,.045);
    --sel: rgba(0,0,0,.085);
    --accent: #007aff;
    --accent-text: #ffffff;
    --field: rgba(0,0,0,.05);
    --menu: rgba(244,244,244,.94);
    --menu-line: rgba(0,0,0,.1);
    --shadow: 0 10px 34px rgba(0,0,0,.2), 0 0 0 .5px rgba(0,0,0,.18);
    --tile-sel: rgba(0,0,0,.075);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --win: #1e1e1e; --side: #2b2b2b; --line: #3a3a3a; --text: #f5f5f7; --muted: #98989d;
      --hover: rgba(255,255,255,.05); --sel: rgba(255,255,255,.11); --accent: #0a84ff;
      --field: rgba(255,255,255,.08); --menu: rgba(42,42,42,.94); --menu-line: rgba(255,255,255,.12);
      --shadow: 0 10px 34px rgba(0,0,0,.55), 0 0 0 .5px rgba(255,255,255,.14);
      --tile-sel: rgba(255,255,255,.1);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--win); color: var(--text);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: var(--side-w) 1px 1fr; overflow: hidden;
    user-select: none; -webkit-user-select: none; cursor: default;
  }
  body.resizing { cursor: col-resize; }
  body.resizing webview { pointer-events: none; }
  button { font: inherit; color: inherit; }
  svg { display: block; }
  input { user-select: text; -webkit-user-select: text; }

  /* ---------- Sidebar ---------- */
  #side { background: var(--side); display: flex; flex-direction: column; min-width: 0; }
  .side-top { height: 52px; flex: none; display: flex; align-items: center; padding: 0 16px; color: var(--muted); font-weight: 600; font-size: 12px; }
  #tree { flex: 1; overflow: auto; padding: 0 10px 24px; outline: none; }
  #tree.drop-root { box-shadow: inset 0 0 0 2px var(--accent); border-radius: 8px; }
  .row {
    --depth: 0;
    display: flex; align-items: center; height: 28px; padding-left: calc(2px + var(--depth) * 14px); padding-right: 6px;
    border-radius: 6px; position: relative; white-space: nowrap;
  }
  .row.selected { background: var(--sel); }
  .row.dragging { opacity: .4; }
  .row.drop-into { background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: inset 0 0 0 2px var(--accent); }
  .row.drop-before::after, .row.drop-after::after {
    content: ""; position: absolute; left: calc(20px + var(--depth) * 14px); right: 4px; height: 2px; background: var(--accent); border-radius: 1px;
  }
  .row.drop-before::after { top: -1px; }
  .row.drop-after::after { bottom: -1px; }
  .row.section { height: 26px; margin-top: 10px; padding-left: 8px; color: var(--muted); font-size: 11px; font-weight: 600; }
  .row.section:first-child { margin-top: 0; }
  .row.section .label { flex: 1; }
  .sec-chev { opacity: 0; color: var(--muted); transition: opacity .12s; }
  .sec-chev svg { transition: transform .15s ease; }
  .row.section.open .sec-chev svg { transform: rotate(90deg); }
  .row.section:hover .sec-chev, .row.section.selected .sec-chev { opacity: 1; }
  .twisty { width: 16px; height: 16px; flex: none; display: grid; place-items: center; color: var(--muted); }
  .twisty svg { transition: transform .15s ease; }
  .twisty.open svg { transform: rotate(90deg); }
  .row .icon { width: 18px; height: 18px; flex: none; display: grid; place-items: center; margin-right: 7px; color: var(--accent); }
  .label { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .rename-input {
    width: 100%; font: inherit; color: var(--text); background: var(--win); border: 0; border-radius: 3px;
    padding: 1px 3px; outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .side-foot { flex: none; display: flex; align-items: center; gap: 2px; padding: 6px 10px 8px; }
  .empty-hint { color: var(--muted); padding: 16px 8px; text-align: center; }

  #splitter { background: var(--line); position: relative; }
  #splitter::after { content: ""; position: absolute; inset: 0 -4px; cursor: col-resize; z-index: 3; }

  /* ---------- Buttons ---------- */
  .tb {
    background: none; border: 0; border-radius: 6px; height: 28px; min-width: 28px; padding: 0 6px;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px; color: var(--muted);
  }
  .tb:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .tb:active:not(:disabled) { background: var(--sel); }
  .tb:disabled { opacity: .35; }
  .tb .t { font-size: 12px; white-space: nowrap; }
  .seg { display: inline-flex; background: var(--field); border-radius: 7px; padding: 2px; gap: 2px; }
  .seg .tb { height: 24px; min-width: 30px; border-radius: 5px; }
  .seg .tb.on { background: var(--win); color: var(--text); box-shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.1); }
  .btn-primary { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 6px; padding: 4px 14px; font-weight: 500; }
  .btn { background: var(--win); border: .5px solid var(--line); border-radius: 6px; padding: 4px 14px; box-shadow: 0 .5px 1px rgba(0,0,0,.1); }

  /* ---------- Main ---------- */
  #main { display: flex; flex-direction: column; min-width: 0; background: var(--win); position: relative; }
  #bar { height: 52px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border-bottom: 1px solid var(--line); }
  .nav-btns { display: flex; gap: 2px; }
  #title { font-size: 15px; font-weight: 700; padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .search { position: relative; width: 170px; transition: width .2s ease; flex: none; }
  .search:focus-within { width: 220px; }
  .search > span { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search input {
    width: 100%; height: 28px; border: 0; border-radius: 7px; background: var(--field); color: var(--text);
    padding: 0 8px 0 27px; font: inherit; outline: none;
  }
  .search input:focus { box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--accent) 40%, transparent); }
  #progress { position: absolute; left: 0; top: 51px; height: 2px; width: 0; background: var(--accent); transition: width .4s ease, opacity .4s; opacity: 0; z-index: 2; }
  #progress.on { width: 70%; opacity: 1; }

  #content { flex: 1; position: relative; min-height: 0; display: flex; }
  #findbar { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--win); }
  #findbar .search, #findbar .search:focus-within { width: 260px; }
  #findCount { color: var(--muted); font-size: 12px; min-width: 70px; }
  #findbar .spacer { flex: 1; }
  #pane { flex: 1; display: flex; }
  #pane webview { flex: 1; border: 0; }
  #browse { flex: 1; overflow: auto; outline: none; padding: 14px 18px 30px; }
  #browse.drop-here { box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--accent) 60%, transparent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, 104px); gap: 6px; align-content: start; }
  .tile { display: flex; flex-direction: column; align-items: center; padding: 6px 4px 4px; border-radius: 8px; }
  .tile .big { width: 72px; height: 66px; display: grid; place-items: center; border-radius: 6px; }
  .tile .label { margin-top: 4px; text-align: center; max-width: 100%; padding: 1px 5px; border-radius: 4px; line-height: 1.3; flex: none;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: normal; word-break: break-word; }
  .item.selected .big { background: var(--tile-sel); }
  .tile.selected .label { background: var(--accent); color: var(--accent-text); }
  .tile.drop-into .big { background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: inset 0 0 0 2px var(--accent); }
  .item.dragging { opacity: .4; }
  .tile .rename-input { text-align: center; }

  .list { width: 100%; }
  .lhead, .lrow { display: grid; grid-template-columns: minmax(180px, 1fr) 130px var(--col3, 170px); align-items: center; }
  .lhead { color: var(--muted); font-size: 11px; font-weight: 500; padding: 0 10px 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .lrow { height: 26px; padding: 0 10px; border-radius: 6px; }
  .lrow:nth-child(odd) { background: var(--hover); }
  .lrow .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .lrow .icon { color: var(--accent); display: grid; }
  .lrow .muted { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 10px; }
  .list .item.selected { background: var(--accent); color: var(--accent-text); }
  .list .item.selected .muted, .list .item.selected .icon { color: inherit; }
  .lrow.drop-into { box-shadow: inset 0 0 0 2px var(--accent); }
  .row .count { color: var(--muted); font-size: 11px; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .list.lib-list .lhead, .list.lib-list .lrow { grid-template-columns: minmax(200px, 1fr) 140px minmax(120px, 220px); }
  .list.lib-list .lrow.filed .label { color: var(--muted); }
  .list.lib-list .item.selected .label { color: inherit; }
  .drag-badge { position: fixed; top: -100px; left: -100px; background: var(--accent); color: #fff; border-radius: 12px; padding: 3px 10px; font: 600 12px -apple-system, system-ui, sans-serif; }

  .empty { color: var(--muted); text-align: center; margin: 18vh auto 0; max-width: 360px; font-size: 13px; }
  .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 6px; }
  .banner { display: flex; gap: 10px; align-items: center; background: var(--field); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; color: var(--muted); }
  .banner span { flex: 1; }

  #pathbar { height: 26px; flex: none; border-top: 1px solid var(--line); display: flex; align-items: center; padding: 0 10px; gap: 2px; font-size: 11px; color: var(--muted); overflow: hidden; white-space: nowrap; }
  .crumb { display: inline-flex; align-items: center; gap: 4px; padding: 1px 4px; border-radius: 4px; color: var(--text); }
  .crumb:hover { background: var(--hover); }
  .crumb svg { color: var(--accent); }
  #status { margin-left: auto; padding-left: 12px; }

  /* ---------- Menus, dialogs, toast ---------- */
  #menu {
    position: fixed; z-index: 50; min-width: 220px; background: var(--menu); border-radius: 8px;
    -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
    box-shadow: var(--shadow); padding: 5px; display: none;
  }
  #menu.show { display: block; }
  #menu button {
    display: flex; width: 100%; align-items: center; background: none; border: 0; border-radius: 4px;
    height: 22px; padding: 0 10px 0 8px; text-align: left; font-size: 13px; outline: none;
  }
  #menu button:hover:not(:disabled), #menu button:focus-visible { background: var(--accent); color: var(--accent-text); }
  #menu button:hover .k, #menu button:focus-visible .k { color: inherit; opacity: .8; }
  #menu button:disabled { opacity: .35; }
  #menu .k { margin-left: auto; color: var(--muted); padding-left: 22px; letter-spacing: .5px; }
  #menu hr { border: 0; border-top: 1px solid var(--menu-line); margin: 5px 8px; }

  dialog {
    border: 0; border-radius: 12px; padding: 0; background: var(--menu); color: var(--text);
    -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
    box-shadow: var(--shadow); width: min(420px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(0,0,0,.18); }
  dialog form { padding: 18px 20px 16px; display: grid; gap: 12px; }
  dialog h2 { margin: 0; font-size: 13px; font-weight: 700; }
  dialog label { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 10px; font-size: 13px; text-align: right; }
  dialog input, dialog select {
    font: inherit; color: var(--text); background: var(--win); border: .5px solid var(--line);
    border-radius: 5px; padding: 4px 7px; outline: none; text-align: left;
  }
  dialog input:focus, dialog select:focus { box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--accent) 40%, transparent); }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  #toast {
    position: fixed; left: 50%; bottom: 40px; transform: translate(-50%, 8px); background: rgba(40,40,40,.92); color: #fff;
    border-radius: 10px; padding: 8px 14px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow);
    opacity: 0; transition: .18s ease; pointer-events: none; z-index: 60; max-width: min(460px, calc(100vw - 32px));
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toast button { background: none; border: 0; color: #6cb6ff; font-weight: 600; padding: 0; }

  /* ---------- Mac desktop app: traffic lights, draggable title areas, frosted sidebar ---------- */
  .mac-app body { background: transparent; }
  .mac-app #side { background: color-mix(in srgb, var(--side) 50%, transparent); }
  .mac-app .side-top { -webkit-app-region: drag; color: transparent; }
  .mac-app #bar { -webkit-app-region: drag; }
  .mac-app #bar button, .mac-app #bar input { -webkit-app-region: no-drag; }

  @media (max-width: 640px) {
    body { grid-template-columns: 1fr; }
    #splitter, #main { display: none; }
  }
</style>
</head>
<body>

<aside id="side" aria-label="Sidebar">
  <div class="side-top">Claude Navigator</div>
  <div id="tree" role="tree" tabindex="0" aria-label="Folders"></div>
  <div class="side-foot">
    <button class="tb" id="sNewFolder" title="New Folder (Ctrl+Shift+N)"><span data-icon="plus"></span><span class="t">New Folder</span></button>
    <span style="flex:1"></span>
    <button class="tb" id="sMore" title="More"><span data-icon="more"></span></button>
  </div>
</aside>

<div id="splitter" title="Drag to resize"></div>

<main id="main">
  <div id="bar">
    <div class="nav-btns">
      <button class="tb" id="bBack" title="Back (Ctrl+[)"><span data-icon="back"></span></button>
      <button class="tb" id="bFwd" title="Forward (Ctrl+])"><span data-icon="fwd"></span></button>
    </div>
    <div id="title">Folders</div>
    <div class="seg" id="viewSeg" role="group" aria-label="View">
      <button class="tb" id="vIcons" title="as Icons (Ctrl+1)"><span data-icon="grid"></span></button>
      <button class="tb" id="vList" title="as List (Ctrl+2)"><span data-icon="list"></span></button>
    </div>
    <div class="seg" id="libSeg" role="group" aria-label="Show" hidden>
      <button class="tb" id="libAll" title="Show everything"><span class="t">All</span></button>
      <button class="tb" id="libUnfiled" title="Show only items not yet in one of your folders"><span class="t">Not Filed</span></button>
    </div>
    <button class="tb" id="bRefreshLib" title="Refresh from Claude" hidden><span data-icon="reload"></span></button>
    <button class="tb" id="bReload" title="Reload"><span data-icon="reload"></span></button>
    <button class="tb" id="bSave" title="Save this page (Ctrl+S)"><span data-icon="star"></span><span class="t" id="bSaveText">Save</span></button>
    <button class="tb" id="bExternal" title="Open in your web browser"><span data-icon="external"></span></button>
    <button class="tb" id="bNewChat" title="New Chat (Ctrl+N)"><span data-icon="compose"></span></button>
    <div class="search">
      <span data-icon="search"></span>
      <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false">
    </div>
  </div>
  <div id="progress"></div>
  <div id="findbar" hidden>
    <div class="search"><span data-icon="search"></span><input id="findInput" type="search" placeholder="Find on this page" autocomplete="off" spellcheck="false"></div>
    <div class="seg">
      <button class="tb" id="findPrev" title="Previous (Ctrl+Shift+G)"><span data-icon="back"></span></button>
      <button class="tb" id="findNext" title="Next (Ctrl+G)"><span data-icon="fwd"></span></button>
    </div>
    <span id="findCount"></span>
    <span class="spacer"></span>
    <button class="btn" id="findDone">Done</button>
  </div>
  <div id="content">
    <div id="browse" tabindex="0" aria-label="Folder contents"></div>
    <div id="pane" hidden></div>
  </div>
  <div id="pathbar"></div>
</main>

<div id="menu" role="menu"></div>

<dialog id="linkDlg">
  <form method="dialog" id="linkForm">
    <h2 id="linkDlgTitle">Add Link</h2>
    <label id="lblName">Name:<input id="linkName" placeholder="e.g. Board paper draft"></label>
    <label id="lblUrl">Address:<input id="linkUrl" placeholder="Paste a Claude chat, project or artifact link" required></label>
    <label>Where:<select id="linkFolder"></select></label>
    <div class="dlg-actions">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn-primary" value="ok" id="linkOk">Save</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
  'use strict';

  // ---------- Platform ----------
  const isApp = !!(window.navigatorApp && window.navigatorApp.isElectron);
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  if (isMac) document.documentElement.classList.add('mac');
  if (isApp && isMac) document.documentElement.classList.add('mac-app');
  const K = isMac
    ? { mod: '⌘', shift: '⇧', del: '⌘⌫', rename: 'Return', open: '⌘↓' }
    : { mod: 'Ctrl+', shift: 'Shift+', del: 'Del', rename: 'F2', open: 'Enter' };
  document.querySelectorAll('[title]').forEach(el => {
    const v = el.getAttribute('title');
    if (v.includes('Ctrl+')) el.setAttribute('title', v.replace(/Ctrl\+Shift\+/g, K.mod + K.shift).replace(/Ctrl\+/g, K.mod));
  });

  const STORE = 'claudeNavigator.tree.v1';
  const WIDTH_STORE = 'claudeNavigator.sideWidth.v2';
  const LOC_STORE = 'claudeNavigator.location';
  const VIEW_STORE = 'claudeNavigator.viewMode';
  const BANNER_STORE = 'claudeNavigator.bannerDismissed';
  const HOME = 'https://claude.ai/new';
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
  };

  // ---------- Icons ----------
  // Small glyphs share a 16px grid and draw with colour C, so they can be reused at large sizes.
  const G = {
    folder: C => `<path d="M1.75 4.25a1 1 0 011-1h3.2l1.5 1.5h5.8a1 1 0 011 1v6.5a1 1 0 01-1 1H2.75a1 1 0 01-1-1z" fill="none" stroke="${C}" stroke-width="1.3" stroke-linejoin="round"/>`,
    chat: C => `<path d="M2.5 4a1.5 1.5 0 011.5-1.5h8A1.5 1.5 0 0113.5 4v5.5A1.5 1.5 0 0112 11H7l-3 2.5V11a1.5 1.5 0 01-1.5-1.5z" fill="none" stroke="${C}" stroke-width="1.3" stroke-linejoin="round"/>`,
    project: C => `<rect x="2" y="4.5" width="12" height="9" rx="1.5" fill="none" stroke="${C}" stroke-width="1.3"/><path d="M5.5 4.5V3.5a1 1 0 011-1h3a1 1 0 011 1v1M2 8h12" fill="none" stroke="${C}" stroke-width="1.3"/>`,
    artifact: C => `<path d="M4 1.8h5l3.2 3.2v8.5a.8.8 0 01-.8.8H4a.8.8 0 01-.8-.8V2.6a.8.8 0 01.8-.8z" fill="none" stroke="${C}" stroke-width="1.3" stroke-linejoin="round"/><path d="M9 1.8V5h3.2M5.5 8.5h5M5.5 11h3.5" fill="none" stroke="${C}" stroke-width="1.3"/>`,
    design: C => `<circle cx="8" cy="8" r="6" fill="none" stroke="${C}" stroke-width="1.3"/><circle cx="5.7" cy="6.3" r="1" fill="${C}"/><circle cx="9.8" cy="5.6" r="1" fill="${C}"/><circle cx="10.8" cy="9.2" r="1" fill="${C}"/>`,
    claude: C => `<path d="M8 2v12M2 8h12M3.8 3.8l8.4 8.4M12.2 3.8l-8.4 8.4" stroke="${C}" stroke-width="1.5" stroke-linecap="round"/>`,
    link: C => `<circle cx="8" cy="8" r="6" fill="none" stroke="${C}" stroke-width="1.2"/><path d="M2 8h12M8 2c-2 2-2 10 0 12M8 2c2 2 2 10 0 12" fill="none" stroke="${C}" stroke-width="1"/>`,
  };
  const KIND_COLOUR = { chat: '#C96442', claude: '#C96442', project: '#4A78C2', artifact: '#2E8F72', design: '#8A5CD1', link: '#7A7A7A' };
  const KIND_NAME = { folder: 'Folder', chat: 'Chat', project: 'Project', artifact: 'Artifact', design: 'Canva design', claude: 'Claude page', link: 'Web link' };
  const small = (k, C = 'currentColor', s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 16 16">${G[k](C)}</svg>`;

  const BIG_FOLDER = `<svg width="64" height="54" viewBox="0 0 64 54">
    <path d="M3 6a4 4 0 014-4h15.5a3 3 0 012.1.9L28.5 7H57a4 4 0 014 4v37a4 4 0 01-4 4H7a4 4 0 01-4-4z" fill="#56A6E8"/>
    <path d="M3 15.5a4 4 0 014-4h50a4 4 0 014 4V48a4 4 0 01-4 4H7a4 4 0 01-4-4z" fill="#8ACBFA"/>
    <path d="M7 11.5h50a4 4 0 014 4v1H3v-1a4 4 0 014-4z" fill="#A7D8FC"/></svg>`;
  const bigFile = k => `<svg width="48" height="60" viewBox="0 0 48 60">
    <path d="M5 1.5h26l15 15V55a3.5 3.5 0 01-3.5 3.5h-37A3.5 3.5 0 012 55V5a3.5 3.5 0 013-3.5z" fill="#fff" stroke="#cfcfcf"/>
    <path d="M31 1.5V13a3.5 3.5 0 003.5 3.5H46" fill="#f2f2f2" stroke="#cfcfcf"/>
    <g transform="translate(12 24) scale(1.5)">${G[k](KIND_COLOUR[k])}</g></svg>`;

  const UI = {
    chev: '<svg width="10" height="10" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    plus: '<svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 5v6M5 8h6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
    more: '<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="5.2" cy="8" r=".9" fill="currentColor"/><circle cx="8" cy="8" r=".9" fill="currentColor"/><circle cx="10.8" cy="8" r=".9" fill="currentColor"/></svg>',
    back: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M10 2.5L4.5 8l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    fwd: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M6 2.5L11.5 8 6 13.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    grid: '<svg width="15" height="15" viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="2" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="2" y="9" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="9" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>',
    list: '<svg width="15" height="15" viewBox="0 0 16 16"><path d="M5.5 4h8.5M5.5 8h8.5M5.5 12h8.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="2.5" cy="4" r="1" fill="currentColor"/><circle cx="2.5" cy="8" r="1" fill="currentColor"/><circle cx="2.5" cy="12" r="1" fill="currentColor"/></svg>',
    reload: '<svg width="15" height="15" viewBox="0 0 16 16"><path d="M13 8a5 5 0 11-1.5-3.6M13 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    star: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 2l1.8 3.8 4.1.5-3 2.8.8 4.1L8 11.2l-3.7 2 .8-4.1-3-2.8 4.1-.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>',
    starFilled: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 2l1.8 3.8 4.1.5-3 2.8.8 4.1L8 11.2l-3.7 2 .8-4.1-3-2.8 4.1-.5z" fill="#F5B400" stroke="#E0A200" stroke-width="1.1" stroke-linejoin="round"/></svg>',
    external: '<svg width="15" height="15" viewBox="0 0 16 16"><path d="M9 2.5h4.5V7M13.5 2.5L7.5 8.5M11.5 9.5v3a1 1 0 01-1 1h-7a1 1 0 01-1-1v-7a1 1 0 011-1h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    compose: '<svg width="17" height="17" viewBox="0 0 16 16"><path d="M7.5 2.5H3.5a1 1 0 00-1 1v9a1 1 0 001 1h9a1 1 0 001-1v-4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M12.3 1.9a1.1 1.1 0 011.6 1.6L8.2 9.2l-2.1.5.5-2.1z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>',
    search: '<svg width="13" height="13" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.6 10.6L14 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    root: '<svg width="13" height="13" viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 2.5v11" stroke="currentColor" stroke-width="1.3"/></svg>',
  };
  document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = UI[el.dataset.icon] || ''; });

  // ---------- Data ----------
  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  const Folder = (name, children = [], open = false) => ({ id: uid(), type: 'folder', name, open, children });
  const Link = (name, url) => ({ id: uid(), type: 'link', name, url });

  const seed = () => [
    Folder('Claude', [
      Link('New chat', 'https://claude.ai/new'),
      Link('Recent chats', 'https://claude.ai/recents'),
      Link('Projects', 'https://claude.ai/projects'),
      Link('Artifacts', 'https://claude.ai/artifacts'),
    ], true),
    Folder('Work', [
      Folder('Monkey Baa', [
        Folder('Board', [Folder('November 2026 meeting')]),
        Folder('Finance'),
        Folder('NCTI'),
      ], true),
    ], true),
    Folder('Personal', [], true),
  ];

  function load() {
    try {
      const t = JSON.parse(ls.get(STORE));
      if (Array.isArray(t)) return t;
    } catch (e) { /* ignore */ }
    return seed();
  }

  const state = {
    tree: load(),
    loc: { kind: 'folder', id: null },   // what the main area shows: a folder, or a Claude page
    pageUrl: '',                          // what the Claude pane is actually showing
    pageTitle: '',
    lastFolderId: null,                   // the folder Save puts pages in
    sideSel: null,
    browseSel: null,
    query: '',
    view: ls.get(VIEW_STORE) === 'list' ? 'list' : 'icons',
  };
  const nav = { hist: [], pos: -1 };
  const undoStack = [];

  // ---------- Claude Library: your chats, projects and artifacts as Claude lists them ----------
  const LIB_STORE = 'claudeNavigator.library.v1';
  const LIB_FILTER_STORE = 'claudeNavigator.libraryFilter';
  const LIB_TIP_STORE = 'claudeNavigator.libraryTipDone';
  const LIB_KINDS = { chats: 'Recent Chats', projects: 'Projects', artifacts: 'Artifacts' };
  const LIB_ICON = { chats: 'chat', projects: 'project', artifacts: 'artifact' };
  const lib = (() => {
    const base = { chats: [], projects: [], artifacts: [], fetchedAt: 0, error: null, signedIn: true };
    try {
      const x = JSON.parse(ls.get(LIB_STORE));
      if (x && typeof x === 'object') return Object.assign(base, x, { busy: false });
    } catch (e) { /* ignore */ }
    return Object.assign(base, { busy: false });
  })();
  const saveLib = () => ls.set(LIB_STORE, JSON.stringify({
    chats: lib.chats, projects: lib.projects, artifacts: lib.artifacts,
    fetchedAt: lib.fetchedAt, error: lib.error, signedIn: lib.signedIn,
  }));
  state.libFilter = ls.get(LIB_FILTER_STORE) === 'unfiled' ? 'unfiled' : 'all';
  const libSel = new Set();
  let libAnchor = null, libPendingSingle = null;

  function save() { ls.set(STORE, JSON.stringify(state.tree)); }
  function snap() { undoStack.push(JSON.stringify(state.tree)); if (undoStack.length > 60) undoStack.shift(); }
  function undo() {
    const prev = undoStack.pop();
    if (!prev) return toast('Nothing to undo');
    state.tree = JSON.parse(prev);
    commit();
    toast('Undone');
  }
  function commit() { save(); renderAll(); }

  function locate(id, nodes = state.tree, parent = null) {
    if (!id) return null;
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      if (n.id === id) return { node: n, list: nodes, index: i, parent };
      if (n.type === 'folder') {
        const r = locate(id, n.children, n);
        if (r) return r;
      }
    }
    return null;
  }
  const nodeOf = id => (locate(id) || {}).node || null;
  function contains(aId, bId) {
    if (aId === bId) return true;
    const a = locate(aId);
    return !!(a && a.node.type === 'folder' && locate(bId, a.node.children));
  }
  function walk(nodes, fn, depth = 0, path = []) {
    for (const n of nodes) {
      fn(n, depth, path);
      if (n.type === 'folder') walk(n.children, fn, depth + 1, path.concat(n));
    }
  }
  function pathTo(id) {
    const out = [];
    let loc = locate(id);
    while (loc) { out.unshift(loc.node); loc = loc.parent ? locate(loc.parent.id) : null; }
    return out;
  }
  const childrenOf = id => (id ? (nodeOf(id) || { children: [] }).children : state.tree);

  // ---------- URL helpers ----------
  function normUrl(u) {
    try { const x = new URL(u); return (x.origin + x.pathname).replace(/\/+$/, ''); } catch (e) { return u || ''; }
  }
  function fixUrl(u) {
    u = (u || '').trim();
    if (u && !/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
    return u;
  }
  function kindOf(n) {
    if (n.type === 'folder') return 'folder';
    const u = n.url || '';
    if (/claude\.ai\/chat\//.test(u)) return 'chat';
    if (/claude\.ai\/project\//.test(u)) return 'project';
    if (/artifact/i.test(u)) return 'artifact';
    if (/canva\.com/.test(u)) return 'design';
    if (/claude\.ai/.test(u)) return 'claude';
    return 'link';
  }
  const cleanTitle = t => (t || '').replace(/\s*[-|–]\s*Claude\s*$/i, '').trim();
  // A page title worth using as a name (not just "Claude" while a page loads).
  const realTitle = t => { const c = cleanTitle(t); return c && !/^(claude|new chat|just a moment\.*|loading\.*)$/i.test(c) ? c : ''; };
  // Names you have not typed yourself follow the chat's title in Claude.
  const isAutoName = n => n.autoName === true || (n.autoName === undefined && /^Untitled (chat|project|artifact|link)$/.test(n.name));
  function guessName(url) {
    const k = kindOf({ type: 'link', url });
    if (k === 'chat') return 'Untitled chat';
    if (k === 'project') return 'Untitled project';
    if (k === 'artifact') return 'Untitled artifact';
    try { return new URL(url).hostname.replace(/^www\./, '') || 'Untitled link'; } catch (e) { return 'Untitled link'; }
  }
  function savedLinksFor(url) {
    const out = [];
    if (!url) return out;
    const u = normUrl(url);
    walk(state.tree, n => { if (n.type === 'link' && normUrl(n.url) === u) out.push(n); });
    return out;
  }

  // ---------- Elements ----------
  const $ = id => document.getElementById(id);
  const treeEl = $('tree'), browseEl = $('browse'), pane = $('pane'), searchEl = $('search');

  // ---------- Sidebar ----------
  // Top-level folders become Finder-style sections; everything inside is a tree.
  function renderSide() {
    const frag = document.createDocumentFragment();
    const addChildren = (nodes, depth) => {
      for (const n of nodes) {
        const open = n.type === 'folder' && n.open && n.children.length > 0;
        frag.appendChild(sideRow(n, depth, open));
        if (open) addChildren(n.children, depth + 1);
      }
    };
    if (isApp) {
      const h = document.createElement('div');
      h.className = 'row section open lib-head';
      h.innerHTML = '<span class="label">Claude Library</span>';
      frag.appendChild(h);
      const idx = filedIndex();
      for (const k of Object.keys(LIB_KINDS)) {
        const r = document.createElement('div');
        r.className = 'row lib';
        r.dataset.lib = k;
        r.innerHTML = `<span class="twisty"></span><span class="icon">${small(LIB_ICON[k])}</span><span class="label"></span>`;
        r.querySelector('.label').textContent = LIB_KINDS[k];
        const c = unfiledCount(k, idx);
        if (c) {
          const b = document.createElement('span');
          b.className = 'count';
          b.textContent = c;
          b.title = `${c} not in a folder yet`;
          r.appendChild(b);
        }
        frag.appendChild(r);
      }
    }
    for (const n of state.tree) {
      if (n.type === 'folder') {
        const r = document.createElement('div');
        r.className = 'row section' + (n.open ? ' open' : '');
        r.dataset.id = n.id;
        r.draggable = true;
        r.setAttribute('role', 'treeitem');
        r.setAttribute('aria-expanded', String(!!n.open));
        r.innerHTML = `<span class="label"></span><span class="sec-chev">${UI.chev}</span>`;
        r.querySelector('.label').textContent = n.name;
        r.title = `${n.name}: click to ${n.open ? 'hide' : 'show'}, double-click to open`;
        frag.appendChild(r);
        if (n.open) addChildren(n.children, 0);
      } else {
        frag.appendChild(sideRow(n, 0, false));
      }
    }
    if (!state.tree.length) {
      const d = document.createElement('div');
      d.className = 'empty-hint';
      d.textContent = 'No folders yet. Click New Folder below.';
      frag.appendChild(d);
    }
    treeEl.replaceChildren(frag);
    applySideSel(false);
  }

  function sideRow(n, depth, open) {
    const r = document.createElement('div');
    r.className = 'row';
    r.dataset.id = n.id;
    r.draggable = true;
    r.setAttribute('role', 'treeitem');
    r.style.setProperty('--depth', depth);
    const hasKids = n.type === 'folder' && n.children.length > 0;
    if (n.type === 'folder') r.setAttribute('aria-expanded', String(open));
    r.innerHTML = `<span class="twisty${open ? ' open' : ''}">${hasKids ? UI.chev : ''}</span>` +
      `<span class="icon">${small(kindOf(n))}</span><span class="label"></span>`;
    r.querySelector('.label').textContent = n.name;
    r.title = n.type === 'link' ? `${n.name}\n${n.url}` : n.name;
    return r;
  }

  const sideRowEl = id => id && (id.startsWith('lib:')
    ? treeEl.querySelector(`.row[data-lib="${CSS.escape(id.slice(4))}"]`)
    : treeEl.querySelector(`.row[data-id="${CSS.escape(id)}"]`));

  function applySideSel(scroll = true) {
    treeEl.querySelectorAll('.row.selected').forEach(r => r.classList.remove('selected'));
    const r = sideRowEl(state.sideSel);
    if (r) { r.classList.add('selected'); if (scroll) r.scrollIntoView({ block: 'nearest' }); }
  }

  // The sidebar highlights where you are, like Finder.
  function syncSideSel() {
    if (state.query) return;
    if (state.loc.kind === 'folder') state.sideSel = state.loc.id;
    else if (state.loc.kind === 'library') state.sideSel = 'lib:' + state.loc.which;
    else {
      const hits = savedLinksFor(state.pageUrl || state.loc.url);
      const inFolder = hits.find(h => ((locate(h.id) || {}).parent || {}).id === state.lastFolderId);
      state.sideSel = (inFolder || hits[0] || {}).id || null;
    }
    applySideSel();
  }

  // Which of your folders already hold each address.
  function filedIndex() {
    const map = new Map();
    walk(state.tree, (n, depth, path) => {
      if (n.type !== 'link') return;
      const k = normUrl(n.url);
      const where = path.length ? path[path.length - 1].name : 'Top level';
      if (!map.has(k)) map.set(k, []);
      if (!map.get(k).includes(where)) map.get(k).push(where);
    });
    return map;
  }
  const unfiledCount = (kind, idx = filedIndex()) => (lib[kind] || []).filter(x => !idx.has(normUrl(x.url))).length;
  function fmtDate(s) {
    if (!s) return '';
    const d = new Date(s);
    if (isNaN(d)) return '';
    const now = new Date();
    const time = d.toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return `Today ${time}`;
    if (d.toDateString() === new Date(now - 864e5).toDateString()) return `Yesterday ${time}`;
    return d.toLocaleDateString('en-AU', d.getFullYear() === now.getFullYear()
      ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function ago(t) {
    if (!t) return 'not yet';
    const m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return `${m} min ago`;
    if (m < 1440) return `${Math.round(m / 60)} h ago`;
    return `${Math.round(m / 1440)} days ago`;
  }

  // ---------- Main area ----------
  function renderMain() {
    const showPage = isApp && state.loc.kind === 'page' && !state.query;
    pane.hidden = !showPage;
    browseEl.hidden = showPage;
    $('pathbar').hidden = showPage;
    if (showPage) return;
    if (state.loc.kind === 'library') return renderLibrary();

    let items, where = false;
    if (state.query) {
      const q = state.query.toLowerCase();
      items = [];
      walk(state.tree, n => {
        if (n.name.toLowerCase().includes(q) || (n.url || '').toLowerCase().includes(q)) items.push(n);
      });
      where = true;
    } else {
      items = childrenOf(state.loc.id);
    }
    const frag = document.createDocumentFragment();

    if (!isApp && !state.query && !ls.get(BANNER_STORE)) {
      const b = document.createElement('div');
      b.className = 'banner';
      b.innerHTML = '<span>Links open Claude in a separate tab here. Use the desktop app to keep Claude inside this window.</span><button class="tb">Got it</button>';
      b.querySelector('button').addEventListener('click', () => { ls.set(BANNER_STORE, '1'); renderMain(); });
      frag.appendChild(b);
    }

    if (!items.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = state.query
        ? '<b>No results</b>Try a different word.'
        : `<b>This folder is empty</b>Open a Claude chat and press ${K.mod}S to save it here, drag links in, or right-click for more.`;
      frag.appendChild(e);
    } else if (state.view === 'icons' && !where) {
      const g = document.createElement('div');
      g.className = 'grid';
      for (const n of items) g.appendChild(tileFor(n));
      frag.appendChild(g);
    } else {
      const l = document.createElement('div');
      l.className = 'list';
      l.style.setProperty('--col3', where ? '220px' : '170px');
      const head = document.createElement('div');
      head.className = 'lhead';
      head.innerHTML = `<span>Name</span><span>Kind</span><span>${where ? 'Where' : 'Contents'}</span>`;
      frag.appendChild(head);
      for (const n of items) l.appendChild(listRowFor(n, where));
      frag.appendChild(l);
    }
    browseEl.replaceChildren(frag);
    applyBrowseSel(false);
    renderPathbar(items.length);
  }

  function libVisible() {
    const kind = state.loc.which;
    const idx = filedIndex();
    let items = lib[kind] || [];
    if (state.libFilter === 'unfiled') items = items.filter(x => !idx.has(normUrl(x.url)));
    if (state.query) {
      const q = state.query.toLowerCase();
      items = items.filter(x => (x.name || '').toLowerCase().includes(q));
    }
    return { kind, idx, items };
  }

  function emptyMsg(title, text) {
    const e = document.createElement('div');
    e.className = 'empty';
    const b = document.createElement('b');
    b.textContent = title;
    e.append(b, document.createTextNode(text));
    return e;
  }

  function renderLibrary() {
    const { kind, idx, items } = libVisible();
    const all = lib[kind] || [];
    const frag = document.createDocumentFragment();
    if (!ls.get(LIB_TIP_STORE) && all.length) {
      const b = document.createElement('div');
      b.className = 'banner';
      b.innerHTML = `<span>Drag items onto your folders to file them. Select several with ${isMac ? '\u2318' : 'Ctrl'}-click or ${isMac ? '\u21e7' : 'Shift'}-click first, or right-click and choose File in Folder. Choose Not Filed to see what is left.</span><button class="tb">Got it</button>`;
      b.querySelector('button').addEventListener('click', () => { ls.set(LIB_TIP_STORE, '1'); renderLibrary(); });
      frag.appendChild(b);
    }
    if (!isApp) {
      frag.appendChild(emptyMsg('Desktop app only', 'Your Claude Library appears in the desktop app, which is signed in to Claude.'));
    } else if (lib.signedIn === false) {
      frag.appendChild(emptyMsg('Sign in to Claude first', 'Open New Chat, sign in to Claude, then click Refresh at the top right.'));
    } else if (!items.length) {
      if (lib.busy && !all.length) frag.appendChild(emptyMsg('Loading from Claude\u2026', 'This takes a few seconds the first time.'));
      else if (state.query) frag.appendChild(emptyMsg('No matches', 'Try a different word.'));
      else if (state.libFilter === 'unfiled' && all.length) frag.appendChild(emptyMsg('All filed', 'Every item here is in one of your folders.'));
      else if (lib.error) frag.appendChild(emptyMsg('Could not read your list from Claude', `Click Refresh to try again. Details: ${lib.error}`));
      else frag.appendChild(emptyMsg('Nothing here yet', 'Click Refresh at the top right to load it from Claude.'));
    } else {
      const l = document.createElement('div');
      l.className = 'list lib-list';
      const head = document.createElement('div');
      head.className = 'lhead';
      head.innerHTML = '<span>Name</span><span>Last edited</span><span>In folder</span>';
      l.appendChild(head);
      for (const x of items) l.appendChild(libRow(x, kind, idx));
      frag.appendChild(l);
    }
    browseEl.replaceChildren(frag);
    for (const k of [...libSel]) if (!items.some(x => x.url === k)) libSel.delete(k);
    applyLibSel();
    renderLibPathbar(kind, idx, items.length);
  }

  function libRow(x, kind, idx) {
    const r = document.createElement('div');
    const where = idx.get(normUrl(x.url));
    r.className = 'lrow item lib' + (where ? ' filed' : '');
    r.dataset.key = x.url;
    r.draggable = true;
    r.innerHTML = `<span class="nm"><span class="icon">${small(LIB_ICON[kind])}</span><span class="label"></span></span><span class="muted"></span><span class="muted"></span>`;
    r.querySelector('.label').textContent = x.name || 'Untitled';
    r.children[1].textContent = fmtDate(x.updated);
    r.children[2].textContent = where ? where.join(', ') : '';
    r.title = x.url;
    return r;
  }

  function applyLibSel() {
    browseEl.querySelectorAll('.item.lib').forEach(r => r.classList.toggle('selected', libSel.has(r.dataset.key)));
    const st = $('status');
    if (st && state.loc.kind === 'library') {
      const shown = browseEl.querySelectorAll('.item.lib').length;
      st.textContent = libSel.size ? `${libSel.size} of ${shown} selected` : `${shown} shown`;
    }
  }

  function renderLibPathbar(kind, idx, shown) {
    const bar = $('pathbar');
    bar.replaceChildren();
    const s = document.createElement('span');
    const all = (lib[kind] || []).length;
    s.textContent = lib.busy
      ? 'Checking Claude for changes\u2026'
      : `${all} in Claude, ${unfiledCount(kind, idx)} not in a folder. Updated ${ago(lib.fetchedAt)}.`;
    const st = document.createElement('span');
    st.id = 'status';
    bar.append(s, st);
    applyLibSel();
  }

  function tileFor(n) {
    const t = document.createElement('div');
    t.className = 'tile item';
    t.dataset.id = n.id;
    t.draggable = true;
    const k = kindOf(n);
    t.innerHTML = `<div class="big">${k === 'folder' ? BIG_FOLDER : bigFile(k)}</div><div class="label"></div>`;
    t.querySelector('.label').textContent = n.name;
    t.title = n.type === 'link' ? `${n.name}\n${n.url}` : n.name;
    return t;
  }

  function listRowFor(n, where) {
    const r = document.createElement('div');
    r.className = 'lrow item';
    r.dataset.id = n.id;
    r.draggable = true;
    const k = kindOf(n);
    const third = where
      ? pathTo(n.id).slice(0, -1).map(p => p.name).join(' › ') || 'Top level'
      : (n.type === 'folder' ? `${n.children.length} item${n.children.length === 1 ? '' : 's'}` : (n.url || '').replace(/^https?:\/\//, ''));
    r.innerHTML = `<span class="nm"><span class="icon">${small(k)}</span><span class="label"></span></span>` +
      `<span class="muted"></span><span class="muted"></span>`;
    r.querySelector('.label').textContent = n.name;
    r.children[1].textContent = KIND_NAME[k];
    r.children[2].textContent = third;
    r.title = n.type === 'link' ? n.url : n.name;
    return r;
  }

  const browseItemEl = id => id && browseEl.querySelector(`.item[data-id="${CSS.escape(id)}"]`);
  function applyBrowseSel(scroll = true) {
    browseEl.querySelectorAll('.item.selected').forEach(r => r.classList.remove('selected'));
    const r = browseItemEl(state.browseSel);
    if (r) { r.classList.add('selected'); if (scroll) r.scrollIntoView({ block: 'nearest' }); }
  }

  function renderPathbar(count) {
    const bar = $('pathbar');
    bar.replaceChildren();
    const crumb = (label, icon, id) => {
      const b = document.createElement('span');
      b.className = 'crumb';
      b.innerHTML = icon;
      b.appendChild(document.createTextNode(label));
      b.addEventListener('click', () => go({ kind: 'folder', id }));
      return b;
    };
    if (state.query) {
      const s = document.createElement('span');
      s.textContent = `Searching all folders for “${state.query}”`;
      bar.appendChild(s);
    } else {
      bar.appendChild(crumb('Folders', UI.root, null));
      for (const p of pathTo(state.loc.id)) {
        const sep = document.createElement('span');
        sep.textContent = '›';
        bar.appendChild(sep);
        bar.appendChild(crumb(p.name, small('folder', 'currentColor', 12), p.id));
      }
    }
    const st = document.createElement('span');
    st.id = 'status';
    st.textContent = `${count} item${count === 1 ? '' : 's'}`;
    bar.appendChild(st);
  }

  function renderToolbar() {
    const page = isApp && state.loc.kind === 'page' && !state.query;
    $('bBack').disabled = nav.pos <= 0;
    $('bFwd').disabled = nav.pos >= nav.hist.length - 1;
    let title;
    const inLib = state.loc.kind === 'library';
    if (inLib) title = LIB_KINDS[state.loc.which];
    else if (state.query) title = 'Search';
    else if (page) title = cleanTitle(state.pageTitle) || 'Claude';
    else title = state.loc.id ? (nodeOf(state.loc.id) || {}).name : 'Folders';
    $('title').textContent = title;
    document.title = title + ' – Claude Navigator';
    $('viewSeg').hidden = page || !!state.query || inLib;
    $('libSeg').hidden = !inLib;
    $('bRefreshLib').hidden = !inLib;
    $('bRefreshLib').disabled = lib.busy;
    $('libAll').classList.toggle('on', state.libFilter === 'all');
    $('libUnfiled').classList.toggle('on', state.libFilter === 'unfiled');
    $('vIcons').classList.toggle('on', state.view === 'icons');
    $('vList').classList.toggle('on', state.view === 'list');
    $('bReload').hidden = !page;
    $('bExternal').hidden = !page;
    $('bSave').hidden = !page;
    if (page) {
      const f = nodeOf(state.lastFolderId);
      const saved = savedLinksFor(state.pageUrl).length > 0;
      $('bSave').firstElementChild.innerHTML = saved ? UI.starFilled : UI.star;
      $('bSaveText').textContent = f ? `Save to ${f.name}` : 'Save';
      $('bSave').title = (saved ? 'Already saved. Click to save another copy' : 'Save this page') +
        (f ? ` in “${f.name}”` : '') + ` (${K.mod}S)`;
    }
  }

  function renderAll() { renderSide(); renderMain(); renderToolbar(); syncSideSel(); }

  // ---------- Navigation (Finder-style back and forward) ----------
  const sameLoc = (a, b) => !!(a && b && a.kind === b.kind && (a.kind === 'folder' ? a.id === b.id
    : a.kind === 'library' ? a.which === b.which : normUrl(a.url) === normUrl(b.url)));

  function go(loc, { push = true } = {}) {
    if (loc.kind === 'page' && !isApp) {
      // A browser cannot show Claude inside this page, so use one reusable tab.
      const w = window.open(loc.url, 'claude-pane');
      if (w) w.focus();
      const hit = savedLinksFor(loc.url)[0];
      if (hit) { state.sideSel = hit.id; applySideSel(); }
      return;
    }
    if (loc.kind === 'folder' && loc.id && !nodeOf(loc.id)) loc = { kind: 'folder', id: null };
    if (loc.kind === 'page') loc.folderId = state.lastFolderId; // remember where Save should go
    clearQuery();
    if (push && !sameLoc(nav.hist[nav.pos], loc)) {
      nav.hist = nav.hist.slice(0, nav.pos + 1);
      nav.hist.push(loc);
      nav.pos = nav.hist.length - 1;
    }
    state.loc = loc;
    show();
  }

  function show() {
    const loc = state.loc;
    if (loc.kind !== 'page') closeFind();
    if (loc.kind === 'library') { libSel.clear(); libAnchor = null; refreshLibrary(false); }
    if (loc.kind === 'folder') {
      state.lastFolderId = loc.id;
      if (state.browseSel && !childrenOf(loc.id).some(c => c.id === state.browseSel)) state.browseSel = null;
    } else if (view) {
      if (loc.folderId !== undefined) state.lastFolderId = nodeOf(loc.folderId) ? loc.folderId : null;
      let cur = '';
      try { cur = view.getURL(); } catch (e) { /* not attached yet */ }
      if (normUrl(cur) !== normUrl(loc.url)) {
        state.pageUrl = loc.url;
        state.pageTitle = '';
        if (viewReady) view.loadURL(loc.url); else view.setAttribute('src', loc.url);
      } else {
        syncNames(state.pageUrl, state.pageTitle); // already showing: catch up on its title
      }
    }
    ls.set(LOC_STORE, JSON.stringify({ loc, lastFolderId: state.lastFolderId }));
    renderMain();
    renderToolbar();
    syncSideSel();
  }

  function clearQuery() { if (state.query) { state.query = ''; searchEl.value = ''; } }
  function back() { if (nav.pos > 0) { nav.pos--; state.loc = nav.hist[nav.pos]; clearQuery(); show(); } }
  function forward() { if (nav.pos < nav.hist.length - 1) { nav.pos++; state.loc = nav.hist[nav.pos]; clearQuery(); show(); } }
  function up() {
    if (state.loc.kind === 'page') return go({ kind: 'folder', id: state.lastFolderId });
    const loc = locate(state.loc.id);
    if (!loc) return;
    go({ kind: 'folder', id: loc.parent ? loc.parent.id : null });
    state.browseSel = loc.node.id;
    applyBrowseSel();
  }

  function openNode(n, { newWindow = false } = {}) {
    if (!n) return;
    if (n.type === 'folder') return go({ kind: 'folder', id: n.id });
    if (newWindow) return openNewWindow(n.url);
    const loc = locate(n.id);
    state.lastFolderId = loc && loc.parent ? loc.parent.id : null;
    go({ kind: 'page', url: n.url });
  }
  function openNewWindow(url) {
    if (isApp) window.navigatorApp.openWindow(url);
    else window.open(url, '_blank');
  }
  function openExternal(url) {
    if (isApp) window.navigatorApp.openExternal(url);
    else window.open(url, '_blank');
  }
  function newChat() {
    if (state.loc.kind === 'folder') state.lastFolderId = state.loc.id;
    go({ kind: 'page', url: HOME });
  }

  // ---------- Claude pane (desktop app only) ----------
  let view = null, viewReady = false;
  if (isApp) {
    view = document.createElement('webview');
    view.setAttribute('partition', 'persist:claude');
    view.setAttribute('allowpopups', '');
    pane.appendChild(view);
    const update = () => {
      let url = '', title = '';
      try { url = view.getURL(); title = view.getTitle(); } catch (e) { return; }
      if (!url || url === 'about:blank') return;
      state.pageUrl = url;
      state.pageTitle = title;
      // Moving around inside Claude updates the current history entry rather than adding one.
      syncNames(url, title);
      if (state.loc.kind === 'page') {
        state.loc.url = url;
        ls.set(LOC_STORE, JSON.stringify({ loc: state.loc, lastFolderId: state.lastFolderId }));
      }
      renderToolbar();
      syncSideSel();
    };
    view.addEventListener('dom-ready', () => { viewReady = true; update(); });
    ['did-navigate', 'did-navigate-in-page', 'page-title-updated'].forEach(ev => view.addEventListener(ev, update));
    view.addEventListener('did-start-loading', () => $('progress').classList.add('on'));
    view.addEventListener('did-stop-loading', () => { $('progress').classList.remove('on'); update(); });
    ['did-stop-loading', 'did-navigate-in-page'].forEach(ev => view.addEventListener(ev, () => harvestPaneSoon()));
  }

  // ---------- Claude Library: loading ----------
  async function refreshLibrary(force = false) {
    if (!isApp || lib.busy) return;
    if (!force && lib.fetchedAt && Date.now() - lib.fetchedAt < 5 * 60e3) return;
    lib.busy = true;
    libChanged();
    try {
      const r = await window.navigatorApp.refreshLibrary();
      lib.signedIn = r.signedIn !== false;
      if (lib.signedIn) {
        for (const k of Object.keys(LIB_KINDS)) if (Array.isArray(r[k]) && r[k].length) lib[k] = r[k];
        lib.fetchedAt = Date.now();
      }
      lib.error = r.chats && r.chats.length ? null : ((r.notes || []).join('; ') || null);
    } catch (err) {
      lib.error = String((err && err.message) || err);
    }
    lib.busy = false;
    saveLib();
    libChanged();
  }
  function libChanged() {
    renderSide();
    if (state.loc.kind === 'library') renderMain();
    renderToolbar();
  }
  // Add chats Claude shows in its own sidebar, and pick up renamed ones, between full refreshes.
  function mergeLib(kind, found) {
    if (!Array.isArray(found) || !found.length) return;
    const byUrl = new Map(lib[kind].map(x => [normUrl(x.url), x]));
    let changed = false;
    for (const f of found) {
      const k = normUrl(f.url);
      const ex = byUrl.get(k);
      if (ex) {
        if (f.name && ex.name !== f.name && !/^untitled/i.test(f.name)) { ex.name = f.name; changed = true; }
      } else {
        const x = { name: f.name || 'Untitled', url: f.url, updated: null };
        lib[kind].unshift(x);
        byUrl.set(k, x);
        changed = true;
      }
    }
    if (changed) { saveLib(); libChanged(); }
  }
  let harvestTimer = null;
  function harvestPaneSoon() {
    if (!isApp) return;
    clearTimeout(harvestTimer);
    harvestTimer = setTimeout(async () => {
      try {
        if (!/^https:\/\/claude\.ai\//.test(state.pageUrl)) return;
        const id = view.getWebContentsId();
        mergeLib('chats', await window.navigatorApp.harvestPane(id, 'chats'));
        if (/^\/artifacts?(\/|$)/.test(new URL(state.pageUrl).pathname)) mergeLib('artifacts', await window.navigatorApp.harvestPane(id, 'artifacts'));
      } catch (e) { /* page not ready yet */ }
    }, 2000);
  }

  // When Claude gives a chat its title, or you rename it in Claude, saved links follow.
  function syncNames(url, title) {
    const t = realTitle(title);
    if (!t) return;
    let changed = false;
    for (const n of savedLinksFor(url)) {
      if (isAutoName(n) && n.name !== t) { n.name = t; n.autoName = true; changed = true; }
    }
    if (changed) { save(); renderSide(); }
  }

  // ---------- Find on page (Claude pane) ----------
  const findbar = $('findbar'), findInput = $('findInput');
  let findText = '';
  const pageShowing = () => isApp && state.loc.kind === 'page' && !state.query;
  function openFind() {
    if (!pageShowing()) { searchEl.focus(); searchEl.select(); return; }
    findbar.hidden = false;
    findInput.focus();
    findInput.select();
  }
  function closeFind() {
    if (findbar.hidden) return;
    findbar.hidden = true;
    findText = '';
    $('findCount').textContent = '';
    try { view.stopFindInPage('clearSelection'); } catch (e) { /* ignore */ }
    if (pageShowing()) view.focus();
  }
  function findStep(forward = true) {
    if (!pageShowing()) return;
    if (findbar.hidden || !findInput.value) return openFind();
    const t = findInput.value;
    view.findInPage(t, { forward, findNext: t === findText });
    findText = t;
  }
  if (isApp) {
    findInput.addEventListener('input', () => {
      const t = findInput.value;
      findText = '';
      if (!t) { view.stopFindInPage('clearSelection'); $('findCount').textContent = ''; return; }
      view.findInPage(t);
      findText = t;
    });
    findInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); findStep(!e.shiftKey); }
      if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
    });
    $('findNext').addEventListener('click', () => findStep(true));
    $('findPrev').addEventListener('click', () => findStep(false));
    $('findDone').addEventListener('click', closeFind);
    view.addEventListener('found-in-page', e => {
      const r = e.result;
      if (r.matches !== undefined) $('findCount').textContent = r.matches ? `${r.activeMatchOrdinal} of ${r.matches}` : 'Not found';
      if (!findbar.hidden && document.activeElement !== findInput) findInput.focus();
    });
  }

  // ---------- Editing ----------
  // New things go where you are: the folder on screen, or the folder you came from.
  function hereFolder() {
    if (state.query) return null;
    return state.loc.kind === 'folder' ? state.loc.id : state.lastFolderId;
  }
  function insertInto(folderId, node) {
    const f = folderId ? nodeOf(folderId) : null;
    (f ? f.children : state.tree).push(node);
    if (f) f.open = true;
  }
  function toggle(n, force) {
    if (!n || n.type !== 'folder') return;
    n.open = force === undefined ? !n.open : force;
    save();
    renderSide();
  }
  const showingFolder = id => state.loc.kind === 'folder' && state.loc.id === id && !state.query;

  function newFolder(parentId = hereFolder()) {
    snap();
    const f = Folder('untitled folder');
    insertInto(parentId, f);
    commit();
    if (showingFolder(parentId)) {
      state.browseSel = f.id;
      applyBrowseSel();
      startRename(f.id, browseEl);
    } else {
      state.sideSel = f.id;
      applySideSel();
      startRename(f.id, treeEl);
    }
  }

  function addLink(parentId, name, url, { rename = false, autoName = !name } = {}) {
    snap();
    const l = Link(name || guessName(url), url);
    l.autoName = autoName;
    if (autoName && isApp && normUrl(url) === normUrl(state.pageUrl) && realTitle(state.pageTitle)) l.name = realTitle(state.pageTitle);
    insertInto(parentId, l);
    commit();
    const inView = showingFolder(parentId);
    if (inView) { state.browseSel = l.id; applyBrowseSel(); }
    if (rename) startRename(l.id, inView ? browseEl : treeEl);
    return l;
  }

  function removeNode(id) {
    const loc = locate(id);
    if (!loc) return;
    const n = loc.node;
    if (n.type === 'folder' && n.children.length) {
      let c = 0;
      walk(n.children, () => c++);
      if (!confirm(`Delete “${n.name}” and the ${c} item${c === 1 ? '' : 's'} inside it?`)) return;
    }
    snap();
    if (state.loc.kind === 'folder' && state.loc.id && contains(id, state.loc.id)) {
      state.loc = { kind: 'folder', id: loc.parent ? loc.parent.id : null };
      nav.hist[nav.pos] = state.loc;
    }
    loc.list.splice(loc.index, 1);
    if (state.browseSel === id) state.browseSel = null;
    commit();
    toast(`Deleted “${n.name}”`, true);
  }

  function duplicate(id) {
    const loc = locate(id);
    if (!loc) return;
    snap();
    const copy = JSON.parse(JSON.stringify(loc.node));
    const reid = x => { x.id = uid(); if (x.children) x.children.forEach(reid); };
    reid(copy);
    copy.name += ' copy';
    loc.list.splice(loc.index + 1, 0, copy);
    commit();
  }

  function sortFolder(id) {
    snap();
    childrenOf(id).sort((a, b) => (a.type === b.type ? 0 : a.type === 'folder' ? -1 : 1) ||
      a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
    commit();
  }
  function setAllOpen(open) { walk(state.tree, n => { if (n.type === 'folder') n.open = open; }); save(); renderSide(); }

  function startRename(id, scope) {
    const el = scope === browseEl ? browseItemEl(id) : sideRowEl(id);
    const n = nodeOf(id);
    if (!el || !n) return;
    el.scrollIntoView({ block: 'nearest' });
    const label = el.querySelector('.label');
    const input = document.createElement('input');
    input.className = 'rename-input';
    input.value = n.name;
    label.replaceChildren(input);
    el.draggable = false;
    input.focus();
    input.select();
    let done = false;
    const finish = ok => {
      if (done) return;
      done = true;
      const v = input.value.trim();
      if (ok && v && v !== n.name) { snap(); n.name = v; n.autoName = false; }
      commit();
      (scope === browseEl ? browseEl : treeEl).focus({ preventScroll: true });
    };
    input.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
    ['mousedown', 'click', 'dblclick'].forEach(ev => input.addEventListener(ev, e => e.stopPropagation()));
  }

  // ---------- Link dialog ----------
  const dlg = $('linkDlg'), fName = $('linkName'), fUrl = $('linkUrl'), fFolder = $('linkFolder');
  let dlgDone = null;
  function folderOptions(selectedId, excludeId) {
    fFolder.replaceChildren(new Option('Top level', ''));
    walk(state.tree, (n, depth, path) => {
      if (n.type !== 'folder') return;
      if (excludeId && (n.id === excludeId || path.some(p => p.id === excludeId))) return;
      fFolder.add(new Option('   '.repeat(depth + 1) + n.name, n.id));
    });
    fFolder.value = selectedId || '';
  }
  function openDialog({ title, name = '', url = '', folderId = null, excludeId = null, folderOnly = false, onSave }) {
    $('linkDlgTitle').textContent = title;
    $('lblName').hidden = folderOnly;
    $('lblUrl').hidden = folderOnly;
    fUrl.required = !folderOnly;
    fName.value = name;
    fUrl.value = url;
    folderOptions(folderId, excludeId);
    dlgDone = onSave;
    dlg.returnValue = '';
    dlg.showModal();
    (folderOnly ? fFolder : url ? fName : fUrl).focus();
  }
  dlg.addEventListener('close', () => {
    const done = dlgDone;
    dlgDone = null;
    if (dlg.returnValue !== 'ok' || !done) return;
    done({ name: fName.value.trim(), url: fixUrl(fUrl.value), folderId: fFolder.value || null });
  });

  function promptNewLink(folderId = hereFolder()) {
    openDialog({
      title: 'Add Link', folderId,
      onSave: ({ name, url, folderId }) => { if (url) addLink(folderId, name, url); },
    });
  }
  function editLink(id) {
    const loc = locate(id);
    if (!loc) return;
    openDialog({
      title: 'Edit Link', name: loc.node.name, url: loc.node.url, folderId: loc.parent ? loc.parent.id : null,
      onSave: ({ name, url, folderId }) => {
        if (!url) return;
        snap();
        const cur = locate(id);
        if (name && name !== cur.node.name) { cur.node.name = name; cur.node.autoName = false; }
        cur.node.url = url;
        moveNode(cur, folderId);
        commit();
      },
    });
  }
  function moveTo(id) {
    const loc = locate(id);
    if (!loc) return;
    openDialog({
      title: `Move “${loc.node.name}” to:`, folderId: loc.parent ? loc.parent.id : null, excludeId: id, folderOnly: true,
      onSave: ({ folderId }) => { snap(); moveNode(locate(id), folderId); commit(); },
    });
  }
  function moveNode(cur, folderId) {
    if ((cur.parent ? cur.parent.id : null) === folderId) return;
    cur.list.splice(cur.index, 1);
    insertInto(folderId, cur.node);
  }

  // File Library items into a folder (or before or after a sidebar row).
  function fileLibItems(items, t) {
    items = (items || []).filter(x => x && x.url);
    if (!items.length || !t) return;
    snap();
    const nodes = items.map(x => {
      const l = Link(x.name || guessName(x.url), x.url);
      l.autoName = true;
      return l;
    });
    if (t.zone === 'into' || !t.id) nodes.forEach(n => insertInto(t.id, n));
    else {
      const tgt = locate(t.id);
      tgt.list.splice(tgt.index + (t.zone === 'after' ? 1 : 0), 0, ...nodes);
    }
    commit();
    const f = t.zone === 'into' || !t.id ? nodeOf(t.id) : (locate(t.id) || {}).parent;
    toast(`Filed ${nodes.length === 1 ? `\u201c${nodes[0].name}\u201d` : `${nodes.length} items`} in ${f ? f.name : 'the top level'}`, true);
  }
  function fileLibPrompt(items) {
    if (!items.length) return;
    openDialog({
      title: items.length === 1 ? `File \u201c${items[0].name}\u201d in:` : `File ${items.length} items in:`,
      folderId: state.lastFolderId, folderOnly: true,
      onSave: ({ folderId }) => fileLibItems(items, { id: folderId, zone: 'into' }),
    });
  }

  function saveCurrent(folderId = state.lastFolderId) {
    if (!isApp || state.loc.kind !== 'page') return promptNewLink(folderId);
    const url = state.pageUrl;
    const name = realTitle(state.pageTitle) || guessName(url);
    addLink(folderId, name, url, { autoName: true });
    const f = nodeOf(folderId);
    toast(`Saved “${name}” to ${f ? f.name : 'top level'}`, true);
  }

  // ---------- Context menus ----------
  const menu = $('menu');
  function showMenu(x, y, items, { above = false } = {}) {
    menu.replaceChildren();
    for (const it of items) {
      if (!it) continue;
      if (it === '-') { if (menu.lastChild && menu.lastChild.tagName !== 'HR') menu.appendChild(document.createElement('hr')); continue; }
      const b = document.createElement('button');
      b.setAttribute('role', 'menuitem');
      b.innerHTML = `<span></span>${it.key ? `<span class="k">${it.key}</span>` : ''}`;
      b.firstChild.textContent = it.label;
      b.disabled = !!it.disabled;
      b.addEventListener('click', () => { hideMenu(); it.run(); });
      menu.appendChild(b);
    }
    if (menu.lastChild && menu.lastChild.tagName === 'HR') menu.lastChild.remove();
    menu.classList.add('show');
    const r = menu.getBoundingClientRect();
    if (above) y -= r.height;
    menu.style.left = Math.max(4, Math.min(x, innerWidth - r.width - 6)) + 'px';
    menu.style.top = Math.max(4, Math.min(y, innerHeight - r.height - 6)) + 'px';
  }
  function hideMenu() { menu.classList.remove('show'); }
  document.addEventListener('mousedown', e => { if (!menu.contains(e.target)) hideMenu(); });
  window.addEventListener('blur', hideMenu);
  window.addEventListener('resize', hideMenu);

  function menuFor(n, scope) {
    const savePage = isApp && state.pageUrl;
    if (!n) {
      const here = scope === browseEl ? hereFolder() : null;
      return [
        { label: 'New Folder', key: K.mod + K.shift + 'N', run: () => newFolder(here) },
        { label: 'Add Link…', key: K.mod + 'L', run: () => promptNewLink(here) },
        savePage && { label: `Save “${cleanTitle(state.pageTitle) || 'Claude page'}” Here`, run: () => { state.lastFolderId = here; saveCurrent(here); } },
        '-',
        scope === browseEl && { label: 'as Icons', key: K.mod + '1', run: () => setView('icons') },
        scope === browseEl && { label: 'as List', key: K.mod + '2', run: () => setView('list') },
        { label: 'Sort by Name', run: () => sortFolder(here) },
        '-',
        { label: 'Expand All in Sidebar', run: () => setAllOpen(true) },
        { label: 'Collapse All in Sidebar', run: () => setAllOpen(false) },
      ];
    }
    const searching = scope === browseEl && state.query;
    if (n.type === 'folder') {
      return [
        { label: 'Open', key: K.open, run: () => openNode(n) },
        searching && { label: 'Show in Enclosing Folder', run: () => revealInFolder(n.id) },
        '-',
        { label: 'New Folder Inside', run: () => newFolder(n.id) },
        { label: 'Add Link Inside…', run: () => promptNewLink(n.id) },
        savePage && { label: `Save “${cleanTitle(state.pageTitle) || 'Claude page'}” Inside`, run: () => { state.lastFolderId = n.id; saveCurrent(n.id); } },
        isApp && { label: 'New Chat to Save Here', run: () => { state.lastFolderId = n.id; go({ kind: 'page', url: HOME }); toast(`Press ${K.mod}S once the chat has a title`); } },
        '-',
        { label: 'Rename', key: K.rename, run: () => startRename(n.id, scope) },
        { label: 'Move To…', run: () => moveTo(n.id) },
        { label: 'Duplicate', run: () => duplicate(n.id) },
        { label: 'Sort Contents by Name', run: () => sortFolder(n.id) },
        '-',
        { label: 'Delete', key: K.del, run: () => removeNode(n.id) },
      ];
    }
    return [
      { label: 'Open', key: K.open, run: () => openNode(n) },
      { label: 'Open in New Window', run: () => openNewWindow(n.url) },
      { label: 'Open in Web Browser', run: () => openExternal(n.url) },
      searching && { label: 'Show in Enclosing Folder', run: () => revealInFolder(n.id) },
      '-',
      { label: 'Rename', key: K.rename, run: () => startRename(n.id, scope) },
      { label: 'Edit Link…', run: () => editLink(n.id) },
      { label: 'Move To…', run: () => moveTo(n.id) },
      { label: 'Duplicate', run: () => duplicate(n.id) },
      { label: 'Copy Link', run: () => navigator.clipboard.writeText(n.url).then(() => toast('Link copied')) },
      savePage && { label: 'Point to Current Claude Page', run: () => { snap(); n.url = state.pageUrl; commit(); toast('Link updated'); } },
      '-',
      { label: 'Delete', key: K.del, run: () => removeNode(n.id) },
    ];
  }

  function revealInFolder(id) {
    const loc = locate(id);
    if (!loc) return;
    go({ kind: 'folder', id: loc.parent ? loc.parent.id : null });
    state.browseSel = id;
    applyBrowseSel();
  }

  function setView(v) {
    state.view = v;
    ls.set(VIEW_STORE, v);
    renderMain();
    renderToolbar();
  }

  // ---------- Sidebar events ----------
  treeEl.addEventListener('click', e => {
    const row = e.target.closest('.row');
    if (!row) return;
    if (row.dataset.lib) return go({ kind: 'library', which: row.dataset.lib });
    const n = nodeOf(row.dataset.id);
    if (!n) return;
    if (row.classList.contains('section')) { state.sideSel = n.id; applySideSel(false); return toggle(n); }
    if (n.type === 'folder' && e.target.closest('.twisty')) return toggle(n);
    openNode(n, { newWindow: e.metaKey || e.ctrlKey });
  });
  treeEl.addEventListener('dblclick', e => {
    const row = e.target.closest('.row.section');
    if (row) openNode(nodeOf(row.dataset.id));
  });
  treeEl.addEventListener('auxclick', e => {
    const row = e.button === 1 && e.target.closest('.row');
    const n = row && nodeOf(row.dataset.id);
    if (n && n.type === 'link') openNewWindow(n.url);
  });
  treeEl.addEventListener('contextmenu', e => {
    e.preventDefault();
    const row = e.target.closest('.row');
    if (row && (row.dataset.lib || row.classList.contains('lib-head'))) {
      showMenu(e.clientX, e.clientY, [{ label: 'Refresh from Claude', run: () => refreshLibrary(true) }]);
      return;
    }
    const n = row && nodeOf(row.dataset.id);
    if (n) { state.sideSel = n.id; applySideSel(false); }
    showMenu(e.clientX, e.clientY, menuFor(n, treeEl));
  });
  treeEl.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const ids = [...treeEl.querySelectorAll('.row[data-id]')].map(r => r.dataset.id);
    if (!ids.length) return;
    const i = ids.indexOf(state.sideSel);
    const loc = locate(state.sideSel);
    const n = loc && loc.node;
    const isSection = !!(n && !loc.parent && n.type === 'folder');
    const mod = e.metaKey || e.ctrlKey;
    const pick = id => {
      if (!id) return;
      state.sideSel = id;
      applySideSel();
      const l = locate(id);
      if (l && l.node.type === 'folder' && l.parent) go({ kind: 'folder', id });
    };
    switch (e.key) {
      case 'ArrowDown': if (mod) { if (n) openNode(n); } else pick(ids[Math.min(ids.length - 1, i + 1)]); break;
      case 'ArrowUp': if (mod) up(); else pick(ids[i <= 0 ? 0 : i - 1]); break;
      case 'ArrowRight': if (n && n.type === 'folder') { if (!n.open) toggle(n, true); else pick(ids[i + 1]); } break;
      case 'ArrowLeft':
        if (n) {
          if (n.type === 'folder' && n.open && (isSection || n.children.length)) toggle(n, false);
          else if (loc.parent) pick(loc.parent.id);
        }
        break;
      case 'Enter': case ' ': if (n) (isSection ? toggle(n) : openNode(n)); break;
      case 'F2': if (n) startRename(n.id, treeEl); break;
      case 'Delete': case 'Backspace': if (n && (mod || !isMac || e.key === 'Delete')) removeNode(n.id); break;
      default: return;
    }
    e.preventDefault();
  });

  // ---------- Main area events ----------
  const libKeys = () => [...browseEl.querySelectorAll('.item.lib')].map(r => r.dataset.key);
  const libItem = key => (lib[state.loc.which] || []).find(x => x.url === key);
  const selectedLibItems = () => libKeys().filter(k => libSel.has(k)).map(libItem).filter(Boolean);
  function openLib(url, newWindow = false) {
    if (newWindow) return openNewWindow(url);
    go({ kind: 'page', url });
  }
  function libMouseDown(e) {
    const it = e.target.closest('.item.lib');
    libPendingSingle = null;
    if (!it) {
      if (!e.target.closest('.lhead')) { libSel.clear(); applyLibSel(); }
      return;
    }
    const key = it.dataset.key;
    const keys = libKeys();
    if (e.metaKey || e.ctrlKey) {
      if (libSel.has(key)) libSel.delete(key); else libSel.add(key);
      libAnchor = key;
    } else if (e.shiftKey && libAnchor && keys.includes(libAnchor)) {
      const [a, b] = [keys.indexOf(libAnchor), keys.indexOf(key)].sort((x, y) => x - y);
      libSel.clear();
      keys.slice(a, b + 1).forEach(k => libSel.add(k));
    } else if (libSel.has(key)) {
      if (e.button === 0) libPendingSingle = key; // keep the group for dragging
    } else {
      libSel.clear();
      libSel.add(key);
      libAnchor = key;
    }
    applyLibSel();
  }
  browseEl.addEventListener('click', e => {
    if (state.loc.kind !== 'library' || !libPendingSingle) return;
    const k = libPendingSingle;
    libPendingSingle = null;
    if (e.metaKey || e.ctrlKey || e.shiftKey) return;
    libSel.clear();
    libSel.add(k);
    libAnchor = k;
    applyLibSel();
  });
  function libContextMenu(e) {
    const it = e.target.closest('.item.lib');
    if (it && !libSel.has(it.dataset.key)) { libSel.clear(); libSel.add(it.dataset.key); libAnchor = it.dataset.key; applyLibSel(); }
    const sel = it ? selectedLibItems() : [];
    const one = sel.length === 1 ? sel[0] : null;
    const saved = one ? savedLinksFor(one.url) : [];
    showMenu(e.clientX, e.clientY, [
      one && { label: 'Open', key: K.open, run: () => openLib(one.url) },
      one && { label: 'Open in New Window', run: () => openNewWindow(one.url) },
      sel.length > 0 && { label: sel.length > 1 ? `File ${sel.length} Items in Folder\u2026` : 'File in Folder\u2026', run: () => fileLibPrompt(sel) },
      saved.length > 0 && { label: 'Show in Folder', run: () => revealInFolder(saved[0].id) },
      one && { label: 'Copy Link', run: () => navigator.clipboard.writeText(one.url).then(() => toast('Link copied')) },
      '-',
      { label: 'Select All', key: K.mod + 'A', run: () => { libKeys().forEach(k => libSel.add(k)); applyLibSel(); } },
      { label: 'Refresh from Claude', run: () => refreshLibrary(true) },
    ]);
  }
  function libKeyDown(e) {
    const keys = libKeys();
    if (!keys.length) return;
    const cur = libAnchor && keys.includes(libAnchor) ? keys.indexOf(libAnchor) : -1;
    const mod = e.metaKey || e.ctrlKey;
    const move = j => {
      j = Math.max(0, Math.min(keys.length - 1, j));
      if (!e.shiftKey) libSel.clear();
      libSel.add(keys[j]);
      libAnchor = keys[j];
      applyLibSel();
      const el = browseEl.querySelector(`.item.lib[data-key="${CSS.escape(keys[j])}"]`);
      if (el) el.scrollIntoView({ block: 'nearest' });
    };
    const first = () => selectedLibItems()[0];
    switch (e.key) {
      case 'ArrowDown': if (mod) { if (first()) openLib(first().url); } else move(cur + 1); break;
      case 'ArrowUp': move(cur <= 0 ? 0 : cur - 1); break;
      case 'Home': move(0); break;
      case 'End': move(keys.length - 1); break;
      case 'Enter': if (first()) openLib(first().url); break;
      case 'a': case 'A': if (!mod) return; keys.forEach(k => libSel.add(k)); applyLibSel(); break;
      case 'Escape': libSel.clear(); applyLibSel(); break;
      default: return;
    }
    e.preventDefault();
  }

  browseEl.addEventListener('mousedown', e => {
    if (e.target.closest('input, button, .banner')) return;
    if (state.loc.kind === 'library') return libMouseDown(e);
    const it = e.target.closest('.item');
    state.browseSel = it ? it.dataset.id : null;
    applyBrowseSel(false);
  });
  browseEl.addEventListener('dblclick', e => {
    if (state.loc.kind === 'library') {
      const it = e.target.closest('.item.lib');
      if (it) openLib(it.dataset.key, e.metaKey || e.ctrlKey);
      return;
    }
    const it = e.target.closest('.item');
    if (it) openNode(nodeOf(it.dataset.id), { newWindow: e.metaKey || e.ctrlKey });
  });
  browseEl.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (state.loc.kind === 'library') return libContextMenu(e);
    const it = e.target.closest('.item');
    state.browseSel = it ? it.dataset.id : null;
    applyBrowseSel(false);
    showMenu(e.clientX, e.clientY, menuFor(it ? nodeOf(it.dataset.id) : null, browseEl));
  });
  browseEl.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (state.loc.kind === 'library') return libKeyDown(e);
    const ids = [...browseEl.querySelectorAll('.item')].map(x => x.dataset.id);
    const i = ids.indexOf(state.browseSel);
    const n = nodeOf(state.browseSel);
    const mod = e.metaKey || e.ctrlKey;
    const grid = browseEl.querySelector('.grid');
    const cols = grid ? Math.max(1, getComputedStyle(grid).gridTemplateColumns.split(' ').length) : 1;
    const pick = j => { if (ids.length) { state.browseSel = ids[Math.max(0, Math.min(ids.length - 1, j))]; applyBrowseSel(); } };
    switch (e.key) {
      case 'ArrowDown': if (mod) { if (n) openNode(n); } else pick(i < 0 ? 0 : i + cols); break;
      case 'ArrowUp': if (mod) up(); else pick(i < 0 ? 0 : i - cols); break;
      case 'ArrowRight': if (!grid) return; pick(i + 1); break;
      case 'ArrowLeft': if (!grid) return; pick(i - 1); break;
      case 'Home': pick(0); break;
      case 'End': pick(ids.length - 1); break;
      case 'Enter': if (n) (isMac ? startRename(n.id, browseEl) : openNode(n)); break;
      case 'F2': if (n) startRename(n.id, browseEl); break;
      case 'o': case 'O': if (!(mod && n)) return; openNode(n); break;
      case 'Delete': case 'Backspace': if (n && (mod || !isMac || e.key === 'Delete')) removeNode(n.id); break;
      case 'Escape': state.browseSel = null; applyBrowseSel(); break;
      default: return;
    }
    e.preventDefault();
  });

  // ---------- Drag and drop (sidebar and main area) ----------
  const NAV_TYPE = 'application/x-claude-nav-id';
  const LIB_TYPE = 'application/x-claude-library';
  let dropTarget = null, hoverId = null, hoverTimer = null, dragId = null;

  function clearDrop() {
    treeEl.classList.remove('drop-root');
    browseEl.classList.remove('drop-here');
    document.querySelectorAll('.drop-into,.drop-before,.drop-after').forEach(r => r.classList.remove('drop-into', 'drop-before', 'drop-after'));
  }
  function extractUrl(dt) {
