<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Navigator</title>
<style>
  :root {
    --side-w: 240px;
    --win: #ffffff;
    --side: #ececec;
    --line: #dedede;
    --text: #1d1d1f;
    --muted: #86868b;
    --hover: rgba(0,0,0,.045);
    --sel: rgba(0,0,0,.085);
    --accent: #007aff;
    --accent-text: #ffffff;
    --field: rgba(0,0,0,.05);
    --menu: rgba(244,244,244,.94);
    --menu-line: rgba(0,0,0,.1);
    --shadow: 0 10px 34px rgba(0,0,0,.2), 0 0 0 .5px rgba(0,0,0,.18);
    --tile-sel: rgba(0,0,0,.075);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --win: #1e1e1e; --side: #2b2b2b; --line: #3a3a3a; --text: #f5f5f7; --muted: #98989d;
      --hover: rgba(255,255,255,.05); --sel: rgba(255,255,255,.11); --accent: #0a84ff;
      --field: rgba(255,255,255,.08); --menu: rgba(42,42,42,.94); --menu-line: rgba(255,255,255,.12);
      --shadow: 0 10px 34px rgba(0,0,0,.55), 0 0 0 .5px rgba(255,255,255,.14);
      --tile-sel: rgba(255,255,255,.1);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--win); color: var(--text);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: var(--side-w) 1px 1fr; grid-template-rows: minmax(0, 1fr); overflow: hidden;
    user-select: none; -webkit-user-select: none; cursor: default;
  }
  body.resizing { cursor: col-resize; }
  body.resizing webview { pointer-events: none; }
  button { font: inherit; color: inherit; }
  svg { display: block; }
  input { user-select: text; -webkit-user-select: text; }

  /* ---------- Sidebar ---------- */
  #side { background: var(--side); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .side-top { height: 52px; flex: none; display: flex; align-items: center; padding: 0 16px; color: var(--muted); font-weight: 600; font-size: 12px; }
  #tree { flex: 1; overflow: auto; padding: 0 10px 24px; outline: none; }
  #tree.drop-root { box-shadow: inset 0 0 0 2px var(--accent); border-radius: 8px; }
  .row {
    --depth: 0;
    display: flex; align-items: center; height: 28px; padding-left: calc(2px + var(--depth) * 14px); padding-right: 6px;
    border-radius: 6px; position: relative; white-space: nowrap;
  }
  .row.selected { background: var(--sel); }
  .row.dragging { opacity: .4; }
  .row.drop-into { background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: inset 0 0 0 2px var(--accent); }
  .row.drop-before::after, .row.drop-after::after {
    content: ""; position: absolute; left: calc(20px + var(--depth) * 14px); right: 4px; height: 2px; background: var(--accent); border-radius: 1px;
  }
  .row.drop-before::after { top: -1px; }
  .row.drop-after::after { bottom: -1px; }
  .row.section { height: 26px; margin-top: 10px; padding-left: 8px; color: var(--muted); font-size: 11px; font-weight: 600; }
  .row.section:first-child { margin-top: 0; }
  .row.section .label { flex: 1; }
  .sec-chev { opacity: 0; color: var(--muted); transition: opacity .12s; }
  .sec-chev svg { transition: transform .15s ease; }
  .row.section.open .sec-chev svg { transform: rotate(90deg); }
  .row.section:hover .sec-chev, .row.section.selected .sec-chev { opacity: 1; }
  .twisty { width: 16px; height: 16px; flex: none; display: grid; place-items: center; color: var(--muted); }
  .twisty svg { transition: transform .15s ease; }
  .twisty.open svg { transform: rotate(90deg); }
  .row .icon { width: 18px; height: 18px; flex: none; display: grid; place-items: center; margin-right: 7px; color: var(--accent); }
  .label { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .rename-input {
    width: 100%; font: inherit; color: var(--text); background: var(--win); border: 0; border-radius: 3px;
    padding: 1px 3px; outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .side-foot { flex: none; display: flex; align-items: center; gap: 2px; padding: 6px 10px 8px; }
  .empty-hint { color: var(--muted); padding: 16px 8px; text-align: center; }

  #splitter { background: var(--line); position: relative; }
  #splitter::after { content: ""; position: absolute; inset: 0 -4px; cursor: col-resize; z-index: 3; }

  /* ---------- Buttons ---------- */
  .tb {
    background: none; border: 0; border-radius: 6px; height: 28px; min-width: 28px; padding: 0 6px;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px; color: var(--muted);
  }
  .tb:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .tb:active:not(:disabled) { background: var(--sel); }
  .tb:disabled { opacity: .35; }
  .tb .t { font-size: 12px; white-space: nowrap; }
  .seg { display: inline-flex; background: var(--field); border-radius: 7px; padding: 2px; gap: 2px; }
  .seg .tb { height: 24px; min-width: 30px; border-radius: 5px; }
  .seg .tb.on { background: var(--win); color: var(--text); box-shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.1); }
  .btn-primary { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 6px; padding: 4px 14px; font-weight: 500; }
  .btn { background: var(--win); border: .5px solid var(--line); border-radius: 6px; padding: 4px 14px; box-shadow: 0 .5px 1px rgba(0,0,0,.1); }

  /* ---------- Main ---------- */
  #main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--win); position: relative; }
  #bar { height: 52px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border-bottom: 1px solid var(--line); }
  .nav-btns { display: flex; gap: 2px; }
  #title { font-size: 15px; font-weight: 700; padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; display: flex; align-items: center; gap: 4px; }
  #title .tc { flex: 0 1 auto; min-width: 0; max-width: 170px; overflow: hidden; text-overflow: ellipsis; font-size: 13px; font-weight: 500; color: var(--muted); padding: 2px 5px; border-radius: 5px; display: inline-flex; align-items: center; gap: 4px; }
  #title .tc svg { color: var(--accent); flex: none; }
  #title .tc:hover { background: var(--hover); color: var(--text); }
  #title .tc.none { font-style: italic; }
  #title .tc.none:hover { background: var(--hover); color: var(--text); }
  #title .ts { color: var(--muted); font-weight: 400; font-size: 13px; flex: none; }
  #title .tn { flex: 1 1 auto; min-width: 60px; overflow: hidden; text-overflow: ellipsis; }
  #title .chip .chip-x { margin-left: 6px; opacity: .7; cursor: default; }
  #title .chip .chip-x:hover { opacity: 1; }
  .mac-app #bar #title .chip { -webkit-app-region: no-drag; }
  #menu .mi { width: 18px; flex: none; display: grid; place-items: center; margin-right: 4px; }
  #title .chip { flex: none; font-size: 11px; font-weight: 500; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 10px; padding: 2px 8px; }
  .mac-app #bar #title .tc { -webkit-app-region: no-drag; }
  .row.context > .label { font-weight: 600; }
  .row.context:not(.selected) { background: color-mix(in srgb, var(--accent) 9%, transparent); }
  .search { position: relative; width: 170px; transition: width .2s ease; flex: none; }
  .search:focus-within { width: 220px; }
  .search > span { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search input {
    width: 100%; height: 28px; border: 0; border-radius: 7px; background: var(--field); color: var(--text);
    padding: 0 8px 0 27px; font: inherit; outline: none;
  }
  .search input:focus { box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--accent) 40%, transparent); }
  #progress { position: absolute; left: 0; top: 51px; height: 2px; width: 0; background: var(--accent); transition: width .4s ease, opacity .4s; opacity: 0; z-index: 2; }
  #progress.on { width: 70%; opacity: 1; }

  #content { flex: 1; position: relative; min-height: 0; display: flex; }
  #findbar { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--win); }
  #findbar .search, #findbar .search:focus-within { width: 260px; }
  #findCount { color: var(--muted); font-size: 12px; min-width: 70px; }
  #findbar .spacer { flex: 1; }
  #pane { flex: 1; display: flex; }
  #pane webview { flex: 1; border: 0; }
  #browse { flex: 1; overflow: auto; outline: none; padding: 14px 18px 30px; }
  #browse.drop-here { box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--accent) 60%, transparent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, 104px); gap: 6px; align-content: start; }
  .tile { display: flex; flex-direction: column; align-items: center; padding: 6px 4px 4px; border-radius: 8px; position: relative; }
  .tile .att { position: absolute; top: 4px; right: 14px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 600; border-radius: 8px; padding: 0 5px; line-height: 16px; }
  .twisty.conn, .lrow .conn { color: var(--muted); }
  .lrow .conn { display: grid; place-items: center; width: 14px; margin-left: 6px; flex: none; }
  .list .item.selected .conn { color: inherit; }
  @media (max-width: 1150px) { #libFilterBtn .t, #libSelectBtn .t, #libAttachedBtn .t, #bSaveText { display: none; } }
  @media (max-width: 900px) { .search, .search:focus-within { width: 130px; } #libSeg { display: none !important; } }
  .tile .lchk { position: absolute; top: 6px; left: 12px; z-index: 2; }
  .libbar { position: sticky; top: -14px; z-index: 4; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; background: color-mix(in srgb, var(--accent) 10%, var(--win)); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 8px; padding: 6px 10px; margin: 0 0 10px; }
  .libbar b { margin-right: 6px; }
  .libbar .danger { color: #c0392b; }
  .lchk { margin: 0 6px 0 0; flex: none; }
  .pager { display: inline-flex; align-items: center; gap: 4px; margin-left: 12px; }
  .pager button { border: 0; background: none; color: var(--text); border-radius: 4px; padding: 0 6px; }
  .pager button:hover:not(:disabled) { background: var(--hover); }
  .pager button:disabled { opacity: .35; }
  #libFilterBtn.on, #libSelectBtn.on { color: var(--text); background: var(--sel); }
  .lsub { color: var(--muted); font-size: 11px; font-weight: 600; padding: 14px 10px 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .lrow.link-target { box-shadow: inset 0 0 0 2px var(--accent); }
  #libAttachedBtn.on { color: var(--text); background: var(--sel); }
  .tile .big { width: 72px; height: 66px; display: grid; place-items: center; border-radius: 6px; }
  .tile .label { margin-top: 4px; text-align: center; max-width: 100%; padding: 1px 5px; border-radius: 4px; line-height: 1.3; flex: none;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: normal; word-break: break-word; }
  .item.selected .big { background: var(--tile-sel); }
  .tile.selected .label { background: var(--accent); color: var(--accent-text); }
  .tile.drop-into .big { background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: inset 0 0 0 2px var(--accent); }
  .item.dragging { opacity: .4; }
  .tile .rename-input { text-align: center; }

  .list { width: 100%; }
  .lhead, .lrow { display: grid; grid-template-columns: var(--cols); align-items: center; }
  .list { width: max-content; min-width: 100%; }
  .lhead .hc { position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 10px; }
  .lhead .rz { position: absolute; top: 0; bottom: 0; right: 0; width: 8px; cursor: col-resize; z-index: 1; }
  .lhead .rz::after { content: ""; position: absolute; right: 3px; top: 2px; bottom: 2px; width: 1px; background: var(--line); }
  .lhead .rz:hover::after, body.col-resizing .lhead .rz::after { background: var(--accent); width: 2px; }
  body.col-resizing { cursor: col-resize; }
  .xall { opacity: 0; width: 18px; height: 18px; flex: none; display: grid; place-items: center; color: var(--muted); border-radius: 4px; margin-left: 2px; transition: opacity .12s; }
  .row:hover .xall { opacity: .7; }
  .row .xall:hover { opacity: 1; background: var(--hover); color: var(--text); }
  #menu .ck { width: 14px; flex: none; }
  #tip {
    position: fixed; z-index: 80; max-width: 320px; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--menu); color: var(--text); border-radius: 6px; padding: 4px 8px; font-size: 12px; line-height: 1.35;
    box-shadow: var(--shadow); white-space: pre-line; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  #tip.show { opacity: 1; }
  .lhead .hc { cursor: default; }
  .lhead .hc:hover { color: var(--text); }
  .lhead .hc.sorted { color: var(--text); font-weight: 600; }
  .lhead .sa { display: inline-block; margin-left: 4px; vertical-align: -1px; }
  .lhead .sa svg { display: inline; }
  .lhead { color: var(--muted); font-size: 11px; font-weight: 500; padding: 0 10px 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .lrow { height: 26px; padding: 0 10px; border-radius: 6px; white-space: nowrap; }
  .lrow .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow:nth-child(odd) { background: var(--hover); }
  .lrow .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .lrow .icon { color: var(--accent); display: grid; width: 18px; place-items: center; }
  .list .item.selected .icon svg { filter: brightness(0) invert(1); }
  .lrow .muted { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 10px; }
  .list .item.selected { background: var(--accent); color: var(--accent-text); }
  .list .item.selected .muted, .list .item.selected .icon { color: inherit; }
  .lrow.drop-into { box-shadow: inset 0 0 0 2px var(--accent); }
  .row .count { color: var(--muted); font-size: 11px; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .list.lib-list .lrow.filed .label { color: var(--muted); }
  .list.lib-list .item.selected .label { color: inherit; }
  .drag-badge { position: fixed; top: -100px; left: -100px; background: var(--accent); color: #fff; border-radius: 12px; padding: 3px 10px; font: 600 12px -apple-system, system-ui, sans-serif; }

  .empty { color: var(--muted); text-align: center; margin: 18vh auto 0; max-width: 360px; font-size: 13px; }
  .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 6px; }
  .banner { display: flex; gap: 10px; align-items: center; background: var(--field); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; color: var(--muted); }
  .banner span { flex: 1; }

  #pathbar { height: 26px; flex: none; border-top: 1px solid var(--line); display: flex; align-items: center; padding: 0 10px; gap: 2px; font-size: 11px; color: var(--muted); overflow: hidden; white-space: nowrap; }
  .crumb { display: inline-flex; align-items: center; gap: 4px; padding: 1px 4px; border-radius: 4px; color: var(--text); }
  .crumb:hover { background: var(--hover); }
  .crumb svg { color: var(--accent); }
  #status { margin-left: auto; padding-left: 12px; }

  /* ---------- Menus, dialogs, toast ---------- */
  #menu {
    position: fixed; z-index: 50; min-width: 220px; background: var(--menu); border-radius: 8px;
    -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
    box-shadow: var(--shadow); padding: 5px; display: none;
  }
  #menu.show { display: block; }
  #menu button {
    display: flex; width: 100%; align-items: center; background: none; border: 0; border-radius: 4px;
    height: 22px; padding: 0 10px 0 8px; text-align: left; font-size: 13px; outline: none;
  }
  #menu button:hover:not(:disabled), #menu button:focus-visible { background: var(--accent); color: var(--accent-text); }
  #menu button:hover .k, #menu button:focus-visible .k { color: inherit; opacity: .8; }
  #menu button:disabled { opacity: .35; }
  #menu .k { margin-left: auto; color: var(--muted); padding-left: 22px; letter-spacing: .5px; }
  #menu hr { border: 0; border-top: 1px solid var(--menu-line); margin: 5px 8px; }

  dialog {
    border: 0; border-radius: 12px; padding: 0; background: var(--menu); color: var(--text);
    -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
    box-shadow: var(--shadow); width: min(420px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(0,0,0,.18); }
  dialog form { padding: 18px 20px 16px; display: grid; gap: 12px; }
  dialog h2 { margin: 0; font-size: 13px; font-weight: 700; }
  dialog label { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 10px; font-size: 13px; text-align: right; }
  dialog { width: min(480px, calc(100vw - 32px)); }
  .pick { display: grid; gap: 6px; }
  .pick-head { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
  #pickPath { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #picker { height: 240px; overflow: auto; background: var(--win); border: .5px solid var(--line); border-radius: 6px; padding: 4px; outline: none; }
  #picker:focus { box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--accent) 40%, transparent); }
  .pk { --d: 0; display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 6px 0 calc(4px + var(--d) * 16px); border-radius: 4px; white-space: nowrap; }
  .pk .tw { width: 14px; height: 14px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .pk .tw svg { transition: transform .12s; }
  .pk .tw.open svg { transform: rotate(90deg); }
  .pk .nm2 { overflow: hidden; text-overflow: ellipsis; }
  .pk.sel { background: var(--accent); color: var(--accent-text); }
  .pk.sel .tw { color: inherit; }
  .pk input { font: inherit; border: 0; border-radius: 3px; padding: 0 3px; outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); }
  .pick-foot { display: flex; }
  dialog input, dialog select {
    font: inherit; color: var(--text); background: var(--win); border: .5px solid var(--line);
    border-radius: 5px; padding: 4px 7px; outline: none; text-align: left;
  }
  dialog input:focus, dialog select:focus { box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--accent) 40%, transparent); }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  #toast {
    position: fixed; left: 50%; bottom: 40px; transform: translate(-50%, 8px); background: rgba(40,40,40,.92); color: #fff;
    border-radius: 10px; padding: 8px 14px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow);
    opacity: 0; transition: .18s ease; pointer-events: none; z-index: 60; max-width: min(460px, calc(100vw - 32px));
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toast button { background: none; border: 0; color: #6cb6ff; font-weight: 600; padding: 0; }

  /* ---------- Mac desktop app: traffic lights, draggable title areas, frosted sidebar ---------- */
  .mac-app body { background: transparent; }
  .mac-app #side { background: color-mix(in srgb, var(--side) 50%, transparent); }
  .mac-app .side-top { -webkit-app-region: drag; color: transparent; }
  .mac-app #bar { -webkit-app-region: drag; }
  .mac-app #bar button, .mac-app #bar input { -webkit-app-region: no-drag; }

  /* ---------- Profiles ---------- */
  .side-top { justify-content: space-between; gap: 8px; padding-right: 10px; }
  .side-top .brand { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .side-top .brand { display: none; }          /* the switcher needs the room; the window title names the app */
  .mac-app .side-top { padding-left: 84px; }    /* clear of the window buttons */
  .profile-btn {
    -webkit-app-region: no-drag; margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%;
    border: 0; border-radius: 7px; padding: 4px 8px 4px 9px; background: var(--field); color: var(--text); font-size: 12px; font-weight: 600;
  }
  .profile-btn:hover { background: var(--sel); }
  .profile-btn .pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .profile-btn .pchev { color: var(--muted); display: grid; transform: rotate(90deg); }
  .pdot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; box-shadow: 0 0 0 .5px rgba(0,0,0,.15); }
  .pdot.all { background: conic-gradient(#FF4C80, #ECEB00, #6FC483, #1B5A68, #FF4C80); }
  .row.section .pdot { margin-right: 7px; }
  .row.section.profile-head { color: var(--text); font-size: 12px; }
  #menu .mi .pdot { width: 10px; height: 10px; }

  /* A profile's colour tints the window, so you can see which profile you are in. */
  html.profiled { --sel: color-mix(in srgb, var(--tint) 24%, transparent); --hover: color-mix(in srgb, var(--tint) 10%, transparent); }
  html.profiled #side { background: color-mix(in srgb, var(--tint) var(--tint-side), var(--side)); }
  html.profiled.mac-app #side { background: color-mix(in srgb, var(--tint) var(--tint-side), color-mix(in srgb, var(--side) 50%, transparent)); }
  html.profiled #bar, html.profiled #findbar, html.profiled #pathbar { background: color-mix(in srgb, var(--tint) var(--tint-bar), var(--win)); }
  html.profiled #main::before, html.profiled #side::before { content: ""; position: absolute; top: 0; height: 3px; background: var(--tint); z-index: 6; }
  html.profiled #main::before { left: 0; right: 0; }
  html.profiled #side { position: relative; }
  html.profiled #side::before { left: 0; right: 0; }

  /* Profile editor */
  #profileDlg form { gap: 14px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 0; padding: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .swatch.on { outline: 2.5px solid var(--text); outline-offset: 2px; }
  .swatches input[type=color] { width: 30px; height: 28px; border: 0; padding: 0; background: none; }
  .prow { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 10px; font-size: 13px; }
  .prow > span:first-child { text-align: right; }
  .preview { border-radius: 8px; overflow: hidden; border: .5px solid var(--line); display: grid; grid-template-columns: 90px 1fr; height: 54px; font-size: 11px; }
  .preview .pv-side { padding: 8px; font-weight: 600; }
  .preview .pv-main { background: var(--win); position: relative; }
  .preview .pv-bar { height: 18px; }
  .preview .pv-top { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .dlg-actions .left { margin-right: auto; color: #c0392b; }

  @media (max-width: 640px) {
    body { grid-template-columns: 1fr; }
    #splitter, #main { display: none; }
  }
</style>
</head>
<body>

<aside id="side" aria-label="Sidebar">
  <div class="side-top"><span class="brand">Claude Navigator</span>
    <button class="profile-btn" id="profileBtn" title="Switch profile (Ctrl+Alt+1, 2, 3... and Ctrl+Alt+0 for All Profiles)"><span class="pdot all"></span><span class="pname">All Profiles</span><span class="pchev" data-icon="chev"></span></button>
  </div>
  <div id="tree" role="tree" tabindex="0" aria-label="Folders"></div>
  <div class="side-foot">
    <button class="tb" id="sNewFolder" title="New Folder (Ctrl+Shift+N)"><span data-icon="plus"></span><span class="t">New Folder</span></button>
    <span style="flex:1"></span>
    <button class="tb" id="sAccount" title="Your Claude account: settings, usage, help, plan and log out"><span data-icon="account"></span></button>
    <button class="tb" id="sMore" title="More: undo, expand or collapse all, Claude's sidebar, back up and restore"><span data-icon="more"></span></button>
  </div>
</aside>

<div id="splitter" title="Drag to resize the sidebar. Double-click to reset."></div>

<main id="main">
  <div id="bar">
    <div class="nav-btns">
      <button class="tb" id="bBack" title="Back (Ctrl+[)"><span data-icon="back"></span></button>
      <button class="tb" id="bFwd" title="Forward (Ctrl+])"><span data-icon="fwd"></span></button>
    </div>
    <div id="title">Folders</div>
    <div class="seg" id="viewSeg" role="group" aria-label="View">
      <button class="tb" id="vIcons" title="as Icons (Ctrl+1)"><span data-icon="grid"></span></button>
      <button class="tb" id="vList" title="as List (Ctrl+2)"><span data-icon="list"></span></button>
    </div>
    <div class="seg" id="libSeg" role="group" aria-label="Show" hidden>
      <button class="tb" id="libAll" title="Show everything"><span class="t">All</span></button>
      <button class="tb" id="libUnfiled" title="Show only items not yet in one of your folders"><span class="t">Not Filed</span></button>
    </div>
    <button class="tb" id="libFilterBtn" title="Filter: filed or not, archived, date, artifacts, starred" hidden><span data-icon="filter"></span><span class="t" id="libFilterText">Filter</span></button>
    <button class="tb" id="libSelectBtn" title="Select several with checkboxes" hidden><span data-icon="check"></span><span class="t">Select</span></button>
    <button class="tb" id="libAttachedBtn" title="Show artifacts too: each chat's artifacts under it, and those not linked to a chat at the end" hidden><span data-icon="attach"></span><span class="t">Artifacts</span></button>
    <button class="tb" id="bRefreshLib" title="Refresh from Claude" hidden><span data-icon="reload"></span></button>
    <button class="tb" id="bReload" title="Reload"><span data-icon="reload"></span></button>
    <button class="tb" id="bSave" title="Save this page (Ctrl+S)"><span data-icon="star"></span><span class="t" id="bSaveText">Save</span></button>
    <button class="tb" id="bExternal" title="Open in your web browser"><span data-icon="external"></span></button>
    <button class="tb" id="bNewChat" title="New Chat (Ctrl+N)"><span data-icon="compose"></span></button>
    <button class="tb" id="bNewMenu" title="New chat, artifact, project, folder or link here"><span data-icon="plus"></span></button>
    <div class="search">
      <span data-icon="search" title="Search all your folders, or filter the Library list you are viewing (Ctrl+F)"></span>
      <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false" title="Search all your folders, or filter the Library list you are viewing (Ctrl+F)">
    </div>
  </div>
  <div id="progress"></div>
  <div id="findbar" hidden>
    <div class="search"><span data-icon="search" title="Find text on this Claude page (Ctrl+F)"></span><input id="findInput" type="search" placeholder="Find on this page" autocomplete="off" spellcheck="false" title="Find text on this Claude page. Return for next, Shift-Return for previous."></div>
    <div class="seg">
      <button class="tb" id="findPrev" title="Previous (Ctrl+Shift+G)"><span data-icon="back"></span></button>
      <button class="tb" id="findNext" title="Next (Ctrl+G)"><span data-icon="fwd"></span></button>
    </div>
    <span id="findCount"></span>
    <span class="spacer"></span>
    <button class="btn" id="findDone" title="Close the find bar (Esc)">Done</button>
  </div>
  <div id="content">
    <div id="browse" tabindex="0" aria-label="Folder contents"></div>
    <div id="pane" hidden></div>
  </div>
  <div id="pathbar"></div>
</main>

<div id="menu" role="menu"></div>

<dialog id="profileDlg">
  <form method="dialog">
    <h2 id="profileDlgTitle">New Profile</h2>
    <label>Name:<input id="profileName" placeholder="e.g. Monkey Baa" required></label>
    <div class="prow"><span>Colour:</span><div class="swatches" id="profileSwatches"></div></div>
    <div class="prow"><span>Tint:</span><div class="seg" id="profileTint">
      <button type="button" class="tb" data-tint="subtle" title="A light wash of colour">Subtle</button>
      <button type="button" class="tb" data-tint="medium" title="A clear wash of colour">Medium</button>
      <button type="button" class="tb" data-tint="bold" title="A strong wash of colour">Bold</button>
    </div></div>
    <div class="prow"><span>Preview:</span><div class="preview"><div class="pv-side" id="pvSide">Folders</div><div class="pv-main"><div class="pv-top" id="pvTop"></div><div class="pv-bar" id="pvBar"></div></div></div></div>
    <label id="profileGroupsRow" style="grid-template-columns: 64px auto 1fr; justify-items: start;"><span></span><input type="checkbox" id="profileGroups" checked><span style="text-align:left">Add an Other group with Code, Design Systems and Schedules folders</span></label>
    <div class="dlg-actions">
      <button type="button" class="btn left" id="profileDelete" title="Delete this profile and everything in it">Delete Profile…</button>
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn-primary" value="ok" id="profileOk">Save</button>
    </div>
  </form>
</dialog>

<dialog id="linkDlg">
  <form method="dialog" id="linkForm">
    <h2 id="linkDlgTitle">Add Link</h2>
    <label id="lblName">Name:<input id="linkName" placeholder="e.g. Board paper draft"></label>
    <label id="lblUrl">Address:<input id="linkUrl" placeholder="Paste a Claude chat, project or artifact link" required></label>
    <div class="pick">
      <div class="pick-head"><span>Where:</span><span id="pickPath"></span></div>
      <div id="picker" tabindex="0" role="tree" aria-label="Choose a folder"></div>
      <div class="pick-foot"><button type="button" class="btn" id="pickNew" title="Make a new folder inside the selected one">New Folder</button></div>
    </div>
    <div class="dlg-actions">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn-primary" value="ok" id="linkOk">Save</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo" title="Undo (Ctrl+Z)">Undo</button></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
  'use strict';

  // ---------- Platform ----------
  const isApp = !!(window.navigatorApp && window.navigatorApp.isElectron);
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  if (isMac) document.documentElement.classList.add('mac');
  if (isApp && isMac) document.documentElement.classList.add('mac-app');
  const K = isMac
    ? { mod: '⌘', shift: '⇧', del: '⌘⌫', rename: 'Return', open: '⌘↓' }
    : { mod: 'Ctrl+', shift: 'Shift+', del: 'Del', rename: 'F2', open: 'Enter' };
  document.querySelectorAll('[title]').forEach(el => {
    const v = el.getAttribute('title');
    if (v.includes('Ctrl+')) el.setAttribute('title', v.replace(/Ctrl\+Shift\+/g, K.mod + K.shift).replace(/Ctrl\+/g, K.mod));
  });

  const STORE = 'claudeNavigator.tree.v1';
  const WIDTH_STORE = 'claudeNavigator.sideWidth.v2';
  const LOC_STORE = 'claudeNavigator.location';
  const VIEW_STORE = 'claudeNavigator.viewMode';
  const BANNER_STORE = 'claudeNavigator.bannerDismissed';
  const HOME = 'https://claude.ai/new';
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
  };

  // ---------- Icons ----------

  const G = {

    chat: C => `<path d="M2.5 4a1.5 1.5 0 011.5-1.5h8A1.5 1.5 0 0113.5 4v5.5A1.5 1.5 0 0112 11H7l-3 2.5V11a1.5 1.5 0 01-1.5-1.5z" fill="none" stroke="${C}" stroke-width="1.3" stroke-linejoin="round"/>`,
    project: C => `<rect x="2" y="4.5" width="12" height="9" rx="1.5" fill="none" stroke="${C}" stroke-width="1.3"/><path d="M5.5 4.5V3.5a1 1 0 011-1h3a1 1 0 011 1v1M2 8h12" fill="none" stroke="${C}" stroke-width="1.3"/>`,
    artifact: C => `<path d="M4 1.8h5l3.2 3.2v8.5a.8.8 0 01-.8.8H4a.8.8 0 01-.8-.8V2.6a.8.8 0 01.8-.8z" fill="none" stroke="${C}" stroke-width="1.3" stroke-linejoin="round"/><path d="M9 1.8V5h3.2M5.5 8.5h5M5.5 11h3.5" fill="none" stroke="${C}" stroke-width="1.3"/>`,
    doc: C => `<path d="M4 1.8h5.2l3 3v8.7a.8.8 0 01-.8.8H4a.8.8 0 01-.8-.8V2.6a.8.8 0 01.8-.8z" fill="none" stroke="${C}" stroke-width="1.3" stroke-linejoin="round"/><path d="M9.2 1.8v3h3" fill="none" stroke="${C}" stroke-width="1.3" stroke-linejoin="round"/>`,

  G.canva = G.design;

  // Brighter versions in dark mode so every icon stays easy to see.

    <path d="M31 1.5V13a3.5 3.5 0 003.5 3.5H46" fill="#f2f2f2" stroke="#cfcfcf"/>

  const UI = {

  // ---------- Data ----------
  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  const Folder = (name, children = [], open = false) => ({ id: uid(), type: 'folder', name, open, children, added: Date.now() });
  const Link = (name, url) => ({ id: uid(), type: 'link', name, url, added: Date.now() });

  const EXTRA_SECTIONS = ['App Code', 'Design Systems', 'Schedules', 'Other'];
  // Profile colours to start with (the Monkey Baa brand palette); any colour can be chosen.
  const PROFILE_COLOURS = ['#FF4C80', '#1B5A68', '#328276', '#99351E', '#B36E24', '#FF7552', '#6FC483', '#FF92B1', '#ECEB00', '#3D7FD6', '#7A3FB8', '#5F6B76'];
  const DEFAULT_PROFILE_COLOUR = { 'monkey baa': '#FF4C80', ncti: '#1B5A68', personal: '#328276', work: '#3D7FD6' };
  // Each profile ends with an "Other" group holding Code, Design Systems and Schedules.
  const OTHER_FOLDERS = ['Code', 'Design Systems', 'Schedules'];
  const groupFolders = () => [Object.assign(Folder('Other', OTHER_FOLDERS.map(n => Folder(n)), true), { group: true })];
  function makeProfile(name, children = [], colour = null, withGroups = true) {
    const used = 0;
    return Object.assign(Folder(name, children.concat(withGroups ? groupFolders() : []), true), {
      profile: true, color: colour || DEFAULT_PROFILE_COLOUR[name.toLowerCase()] || PROFILE_COLOURS[used], tint: 'medium',

  const seed = () => [
    makeProfile('Work', [Folder('Board'), Folder('Finance')]),

  function load() {
    try {
      const t = JSON.parse(ls.get(STORE));

  }

  // The old "Claude" folder of shortcuts is replaced by the Claude section at the top.
  // Remove it once, and only if it still holds just those four shortcuts.
  const SHORTCUT_URLS = ['https://claude.ai/new', 'https://claude.ai/recents', 'https://claude.ai/projects', 'https://claude.ai/artifacts'];
  function dropOldClaudeSection(tree) {
    if (ls.get('claudeNavigator.claudeSectionMerged')) return tree;
    ls.set('claudeNavigator.claudeSectionMerged', '1');
    const isOld = n => n.type === 'folder' && n.name === 'Claude' && n.children.length > 0 &&
      n.children.every(c => c.type === 'link' && SHORTCUT_URLS.includes((c.url || '').replace(/\/+$/, '')));
    const kept = tree.filter(n => !isOld(n));
    if (kept.length !== tree.length) ls.set(STORE, JSON.stringify(kept));
    return kept;
  }

  // Adds the App Code, Design Systems, Schedules and Other sections once (skipping any you already have).
  function addExtraSections(tree) {
    if (tree.some(n => n.profile)) { ls.set('claudeNavigator.extraSections.v1', '1'); return tree; }
    if (ls.get('claudeNavigator.extraSections.v1')) return tree;
    ls.set('claudeNavigator.extraSections.v1', '1');
    const have = new Set(tree.filter(n => n.type === 'folder').map(n => n.name.toLowerCase()));
    const add = EXTRA_SECTIONS.filter(n => !have.has(n.toLowerCase())).map(n => Folder(n, [], true));
    if (!add.length) return tree;
    const out = tree.concat(add);
    ls.set(STORE, JSON.stringify(out));
    return out;
  }

  // Turns the old layout (Work > Monkey Baa, Work > NCTI, Personal, plus the extra groups) into profiles, once.
  function migrateToProfiles(tree) {
    if (tree.some(n => n.profile)) return tree;
    const isGroup = n => n.type === 'folder' && EXTRA_SECTIONS.some(g => g.toLowerCase() === n.name.toLowerCase());
    const groups = tree.filter(isGroup);
    const loose = [];
    const out = [];
    let i = 0;
    const asProfile = n => Object.assign(n, {
      profile: true, open: true, tint: 'medium',
      color: DEFAULT_PROFILE_COLOUR[n.name.toLowerCase()] || PROFILE_COLOURS[(i++ + 3) % PROFILE_COLOURS.length],
    });
    for (const n of tree) {
      if (isGroup(n)) continue;
      if (n.type !== 'folder') { loose.push(n); continue; }
      if (n.name.toLowerCase() === 'work' && n.children.some(c => c.type === 'folder')) {
        for (const c of n.children) { if (c.type === 'folder') out.push(asProfile(c)); else loose.push(c); }
      } else out.push(asProfile(n));
    }
    if (!out.length) out.push(asProfile(Folder('Work')));
    out[0].children.unshift(...loose);
    out.forEach((p, idx) => {
      for (const name of EXTRA_SECTIONS) {
        const have = p.children.find(c => c.type === 'folder' && c.name.toLowerCase() === name.toLowerCase());
        if (have) { have.group = true; continue; }
        const old = idx === 0 ? groups.find(g => g.name.toLowerCase() === name.toLowerCase()) : null;
        p.children.push(Object.assign(old || Folder(name, [], true), { group: true }));
      }
    });
    ls.set(STORE, JSON.stringify(out));
    return out;
  }

  // Moves the App Code, Design Systems and Schedules groups into each profile's Other group (App Code becomes Code), once.
  function nestUnderOther(tree) {
    if (ls.get('claudeNavigator.otherGroup.v1')) return tree;
    ls.set('claudeNavigator.otherGroup.v1', '1');
    const rename = { 'app code': 'Code', code: 'Code', 'design systems': 'Design Systems', schedules: 'Schedules' };
    for (const p of tree.filter(n => n.profile)) {
      let other = p.children.find(c => c.type === 'folder' && c.name.toLowerCase() === 'other');
      if (!other) { other = Folder('Other', [], true); p.children.push(other); }
      other.group = true;
      for (const c of p.children.slice()) {
        if (c === other || c.type !== 'folder' || !c.group) continue;          // your own folders stay put
        const name = rename[c.name.toLowerCase()];
        if (!name) continue;
        p.children.splice(p.children.indexOf(c), 1);
        c.group = false;
        c.name = name;
        const same = other.children.find(x => x.type === 'folder' && x.name === name);
        if (same) same.children.push(...c.children); else other.children.push(c);
      }
      for (const name of OTHER_FOLDERS) if (!other.children.some(x => x.type === 'folder' && x.name === name)) other.children.push(Folder(name));
      other.children.sort((a, b) => {
        const ia = OTHER_FOLDERS.indexOf(a.name), ib = OTHER_FOLDERS.indexOf(b.name);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });
      p.children.splice(p.children.indexOf(other), 1);
      p.children.push(other);                                                  // Other is always last
    }
    ls.set(STORE, JSON.stringify(tree));
    return tree;
  }

  const state = {
    tree: nestUnderOther(migrateToProfiles(addExtraSections(dropOldClaudeSection(load())))),
    profileId: ls.get('claudeNavigator.activeProfile') || null,
    loc: { kind: 'folder', id: null },   // what the main area shows: a folder, or a Claude page
    pageUrl: '',                          // what the Claude pane is actually showing
    pageTitle: '',
    lastFolderId: null,                   // the folder Save puts pages in
    sideSel: null,
    browseSel: null,
    query: '',
    view: ls.get(VIEW_STORE) === 'list' ? 'list' : 'icons',
  };
  const nav = { hist: [], pos: -1 };
  const undoStack = [];

  // ---------- Claude Library: your chats, projects and artifacts as Claude lists them ----------
  const LIB_STORE = 'claudeNavigator.library.v1';
  const LIB_FILTER_STORE = 'claudeNavigator.libraryFilter';
  const LIB_TIP_STORE = 'claudeNavigator.libraryTipDone';
  const LIB_KINDS = { chats: 'All Chats', projects: 'Projects', artifacts: 'Artifacts', designsystems: 'Design Systems', design: 'Design', code: 'Code', scheduled: 'Scheduled' };
  // Shown in the Claude section (Projects and Design are still read: Design feeds Design Systems).
  const SIDEBAR_LIB = ['chats', 'artifacts'];
  const CLAUDE_OTHER = ['designsystems', 'code', 'scheduled'];      // under "Other", closed by default
  const LIB_ICON = { chats: 'chat', projects: 'project', artifacts: 'artifact', designsystems: 'designsystem', design: 'design', code: 'code', scheduled: 'schedule' };
  const LIB_TIPS = {
    chats: 'Every chat in your Claude account', projects: 'Every project in your Claude account',
    artifacts: 'Artifacts listed on Claude\u2019s Artifacts page', code: 'Claude Code sessions listed on Claude\u2019s Code page',
    design: 'Designs and design systems on Claude\u2019s Design page', scheduled: 'Scheduled tasks on Claude\u2019s Scheduled page',
    designsystems: 'Design systems from Claude\u2019s Design and Artifacts pages',
  };
  // The items in a Library list. Design Systems gathers them from the Design and Artifacts lists.
  function libList(kind) {
    if (kind !== 'designsystems') return lib[kind] || [];
    const seen = new Set(), out = [];
    for (const src of ['design', 'artifacts']) for (const x of lib[src] || []) {
      const k = normUrl(x.url);
      if (!seen.has(k) && libKind(x, src) === 'designsystem') { seen.add(k); out.push(x); }
    }
    return out;
  }
  const lib = (() => {
    const base = { chats: [], projects: [], artifacts: [], code: [], design: [], scheduled: [], kinds: {}, related: {}, scanned: {}, detached: [], archived: [], fetchedAt: 0, error: null, signedIn: true };
    try {
      const x = JSON.parse(ls.get(LIB_STORE));

    } catch (e) { /* ignore */ }
    return Object.assign(base, { busy: false });
  })();
  const saveLib = () => ls.set(LIB_STORE, JSON.stringify({
    chats: lib.chats, projects: lib.projects, artifacts: lib.artifacts, code: lib.code, design: lib.design, scheduled: lib.scheduled,
    kinds: lib.kinds, related: lib.related, scanned: lib.scanned, detached: lib.detached, archived: lib.archived, fetchedAt: lib.fetchedAt, error: lib.error, signedIn: lib.signedIn,
  }));
  state.libFilter = ['unfiled', 'filed', 'archived'].includes(ls.get(LIB_FILTER_STORE)) ? ls.get(LIB_FILTER_STORE) : 'all';
  const libSel = new Set();
  let libRowItems = new Map();
  const PAGE_SIZE = 100;
  Object.assign(state, { libWhen: 'any', libArts: 'any', libStarred: false, libPage: 0, libSelectMode: false, libFiltered: [] });

  function save() { ls.set(STORE, JSON.stringify(state.tree)); }
  function snap() { undoStack.push(JSON.stringify(state.tree)); if (undoStack.length > 60) undoStack.shift(); }
  function undo() {
    const prev = undoStack.pop();

    state.tree = JSON.parse(prev);
    commit();

  function commit() { save(); if (state.profileId && !activeProfile()) state.profileId = null; applyProfileThemeSafe(); renderAll(); }
  function applyProfileThemeSafe() { try { applyProfileTheme(); } catch (e) { /* during start-up */ } }

  function locate(id, nodes = state.tree, parent = null) {
    if (!id) return null;
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      if (n.id === id) return { node: n, list: nodes, index: i, parent };
      if (n.children) {
        const r = locate(id, n.children, n);
        if (r) return r;
      }
    }
    return null;
  }
  const nodeOf = id => (locate(id) || {}).node || null;
  function contains(aId, bId) {
    if (aId === bId) return true;
    const a = locate(aId);
    return !!(a && a.node.children && locate(bId, a.node.children));
  }
  function walk(nodes, fn, depth = 0, path = []) {
    for (const n of nodes) {
      fn(n, depth, path);
      if (n.children) walk(n.children, fn, depth + 1, path.concat(n));
    }
  }
  function pathTo(id) {
    const out = [];
    let loc = locate(id);
    while (loc) { out.unshift(loc.node); loc = loc.parent ? locate(loc.parent.id) : null; }
    return out;
  }
  // ---------- Profiles ----------
  const profiles = () => state.tree.filter(n => n.type === 'folder' && n.profile);
  const activeProfile = () => { const p = state.profileId && nodeOf(state.profileId); return p && p.profile ? p : null; };
  const rootList = () => { const p = activeProfile(); return p ? p.children : state.tree; };
  const profileOf = id => { const path = pathTo(id); return path.length && path[0].profile ? path[0] : null; };
  // A folder path for display, without the profile you are already in.
  const displayPath = id => pathTo(id).filter(p => !(activeProfile() && p.id === activeProfile().id));
  const childrenOf = id => (id ? (nodeOf(id) || {}).children || [] : rootList());

  // ---------- URL helpers ----------
  function normUrl(u) {
    try { const x = new URL(u); return (x.origin + x.pathname).replace(/\/+$/, ''); } catch (e) { return u || ''; }
  }
  function fixUrl(u) {
    u = (u || '').trim();
    if (u && !/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
    return u;
  }
  function kindOf(n) {
    if (n.type === 'folder') return 'folder';
    if (n.as && G[n.as]) return n.as;
    const u = n.url || '';
    if (/claude\.ai\/chat\//.test(u)) return 'chat';
    if (/claude\.ai\/code\/session_/.test(u)) return 'code';
    if (/claude\.ai\/project\//.test(u)) return 'project';
    if (/artifact/i.test(u)) return 'artifact';
    if (/canva\.com/.test(u)) return 'canva';
    if (/claude\.ai/.test(u)) return 'claude';
    return 'link';
  }
  const cleanTitle = t => (t || '').replace(/\s*[-|–]\s*Claude(\s+Code)?\s*$/i, '').trim();
  // Page titles that name a Claude page rather than the thing on it; never used as a name.
  const GENERIC_TITLE = /^(claude( code)?|code|new chat|recents?|recent chats|chats|projects?|artifacts?|design( systems?)?|scheduled|schedules?|settings|usage|search|customi[sz]e|just a moment\.*|loading\.*|untitled|404.*|.*not found|error.*|page unavailable)$/i;
  // A page title worth using as a name (not just "Claude" while a page loads).
  const realTitle = t => {
    const c = cleanTitle(t);
    if (!/[\p{L}\p{N}]/u.test(c)) return '';
    // While a page loads its title is briefly its address: never use that as a name.
    if (/^(https?:\/\/)?[\w.-]+\.?[\w-]*(:\d+)?\/\S*$/i.test(c) || /^https?:/i.test(c)) return '';
    return c && !GENERIC_TITLE.test(c) ? c : '';
  };
  // Names you have not typed yourself follow the chat's title in Claude.
  const isAutoName = n => n.autoName === true || (n.autoName === undefined && /^Untitled (chat|project|artifact|link)$/.test(n.name));
  function guessName(url) {
    const k = kindOf({ type: 'link', url });
    if (k === 'chat') return 'Untitled chat';
    if (k === 'project') return 'Untitled project';
    if (k === 'artifact') return 'Untitled artifact';
    try { return new URL(url).hostname.replace(/^www\./, '') || 'Untitled link'; } catch (e) { return 'Untitled link'; }
  }
  function savedLinksFor(url) {
    const out = [];
    if (!url) return out;
    const u = normUrl(url);
    walk(state.tree, n => { if (n.type === 'link' && normUrl(n.url) === u) out.push(n); });
    return out;
  }

  // ---------- Elements ----------
  const $ = id => document.getElementById(id);
  const treeEl = $('tree'), browseEl = $('browse'), pane = $('pane'), searchEl = $('search');

  // ---------- Sidebar ----------
  // Top-level folders become Finder-style sections; everything inside is a tree.
  function renderSide() {
    const frag = document.createDocumentFragment();

      for (const n of nodes) {

        frag.appendChild(sideRow(n, depth, open, parent));
        if (open) addChildren(n.children, depth + 1, n);
      }
    };
    if (isApp) {
      const h = document.createElement('div');
      h.className = 'row section open lib-head';
      h.innerHTML = '<span class="label">Claude</span>';
      h.title = 'Everything in your Claude account';
      frag.appendChild(h);
      const nc = document.createElement('div');
      nc.className = 'row lib-action';
      nc.dataset.action = 'new-chat';
      nc.innerHTML = `<span class="twisty"></span><span class="icon">${UI.compose}</span><span class="label">New Chat</span>`;
      const here = newHereFolder();
      nc.title = here ? `New chat, saved in \u201c${nodeOf(here).name}\u201d once you send it (${K.mod}N)` : `New chat (${K.mod}N)`;
      frag.appendChild(nc);
      const idx = filedIndex();
      const libRowFor = (k, depth) => {
        const r = document.createElement('div');
        r.className = 'row lib';
        r.dataset.lib = k;
        r.style.setProperty('--depth', depth);

          (unfiledCount(k, idx) ? `. ${unfiledCount(k, idx)} not in one of your folders yet.` : '. All are filed.');
        r.innerHTML = `<span class="twisty"></span><span class="icon">${small(LIB_ICON[k])}</span><span class="label"></span>`;
        r.querySelector('.label').textContent = LIB_KINDS[k];

      // "Other": Design Systems, Code and Scheduled, closed until you open it.
      const open = ls.get('claudeNavigator.claudeOtherOpen') === '1';

      const waiting = CLAUDE_OTHER.reduce((t, k) => t + unfiledCount(k, idx), 0);
      if (waiting && !open) {
        const b = document.createElement('span');
        b.className = 'count';
        b.textContent = waiting;
        b.title = `${waiting} not in a folder yet`;
        o.appendChild(b);
      }
      frag.appendChild(o);

    }

      r.querySelector('.label').textContent = n.name;

      frag.appendChild(r);
    };
    const ap = activeProfile();
    if (ap) {
      // One profile: its folders first, then its Other group (Code, Design Systems, Schedules) as its own section.
      sectionHead(ap, ' profile-head');
      if (ap.open) addChildren(ap.children.filter(c => !c.group), 0);
      for (const g of ap.children.filter(c => c.group)) {
        sectionHead(g);
        if (g.open) addChildren(g.children, 0);
      }
    }
    for (const n of ap ? [] : state.tree) {
      if (n.type === 'folder') {
        const r = document.createElement('div');
        r.className = 'row section' + (n.open ? ' open' : '') + (n.profile ? ' profile-head' : '');
        r.dataset.id = n.id;

  // Expand or collapse a folder and everything inside it.
  const hasSubfolders = n => n.type === 'folder' && n.children.some(c => c.type === 'folder');
  function subtreeOpen(n) {
    let all = true;
    walk([n], f => { if (f.type === 'folder' && f.children.length && !f.open) all = false; });
    return all;
  }
  function setSubtree(n, open, keepSelfOpen = false) {
    walk([n], f => { if (f.type === 'folder') f.open = open; });
    if (keepSelfOpen) n.open = true;
    save();
    renderSide();
  }
  function xallButton(n) {
    if (!hasSubfolders(n)) return '';
    const all = subtreeOpen(n);
    const tip = all ? 'Collapse everything inside' : 'Expand everything inside';
    return `<span class="xall" data-all="${all ? 1 : 0}" title="${tip}${isMac ? ' (\u2325-click an arrow does the same)' : ''}">${all ? UI.collapseAll : UI.expandAll}</span>`;
  }

  function sideRow(n, depth, open, parent = null) {
    const r = document.createElement('div');
    r.className = 'row';
    r.dataset.id = n.id;
    r.draggable = true;
    r.setAttribute('role', 'treeitem');
    r.style.setProperty('--depth', depth);
    const hasKids = !!(n.children && n.children.length);
    const attached = !!(parent && parent.type === 'link');
    if (attached) r.classList.add('attached');
    if (hasKids) r.setAttribute('aria-expanded', String(open));
    const twTip = hasKids ? ` title="${open ? 'Collapse' : 'Expand'}${isMac ? ' (\u2325-click: everything inside)' : ' (Alt-click: everything inside)'}"` : '';
    const twisty = hasKids ? UI.chev : attached ? UI.attach : '';
    const twTip2 = attached && !hasKids ? ` title="Attached to \u201c${parent.name.replace(/"/g, '&quot;')}\u201d. It moves with that chat."` : twTip;
    r.innerHTML = `<span class="twisty${open ? ' open' : ''}${attached && !hasKids ? ' conn' : ''}"${twTip2}>${twisty}</span>` +
      `<span class="icon">${n.type === 'folder' ? small('folder') : colourIcon(kindOf(n))}</span><span class="label"></span>${n.type === 'folder' ? xallButton(n) : ''}`;
    r.querySelector('.label').textContent = n.name;
    r.title = n.type === 'link' ? `${n.name}\n${n.url}` : n.name;
    return r;
  }

  const sideRowEl = id => id && (id.startsWith('lib:')
    ? treeEl.querySelector(`.row[data-lib="${CSS.escape(id.slice(4))}"]`)
    : treeEl.querySelector(`.row[data-id="${CSS.escape(id)}"]`));

  function applySideSel(scroll = true) {
    treeEl.querySelectorAll('.row.selected, .row.context').forEach(r => r.classList.remove('selected', 'context'));
    const cr = state.loc.kind === 'page' && sideRowEl(state.ctxFolder);
    if (cr) cr.classList.add('context');
    if (multi.side.size > 1) for (const id of multi.side) { const el = sideRowEl(id); if (el) el.classList.add('selected'); }
    const r = sideRowEl(state.sideSel);
    if (r) { r.classList.add('selected'); if (scroll) r.scrollIntoView({ block: 'nearest' }); }
  }

  // The sidebar highlights where you are, like Finder.
  // Which folder the open Claude page belongs to:
  // saved (it is in a folder), pending (a new item that will be saved there), or none.
  const parentIdOf = id => ((locate(id) || {}).parent || {}).id || null;
  // Artifacts made in a chat stay linked to it (learned when you open one from a chat, or attach it yourself).
  function addRelation(chatUrl, itemUrl) {
    const c = normUrl(chatUrl), a = normUrl(itemUrl);
    if (!/\/chat\//.test(c) || c === a) return;
    const list = lib.related[c] || (lib.related[c] = []);
    if (!list.includes(a)) { list.push(a); saveLib(); setTimeout(() => { try { autoAttachSiblings(); } catch (e) { /* ignore */ } }, 0); }
  }
  const isDetached = (chatUrl, itemUrl) => (lib.detached || []).includes(normUrl(chatUrl) + '|' + normUrl(itemUrl));
  // An artifact sitting next to the chat it came from moves under that chat (never across folders).
  function autoAttachSiblings() {
    const moves = [];
    walk(state.tree, n => {
      if (n.type !== 'link' || kindOf(n) !== 'chat') return;
      const rel = new Set(lib.related[normUrl(n.url)] || []);
      if (!rel.size) return;
      const l = locate(n.id);
      for (const sib of l.list) {
        if (sib !== n && attachable(sib) && rel.has(normUrl(sib.url)) && !isDetached(n.url, sib.url)) moves.push([sib.id, n.id]);
      }
    });
    if (!moves.length) return;
    snap();
    for (const [id, chatId] of moves) {
      const l = locate(id), chat = nodeOf(chatId);
      if (!l || !chat || attachedTo(id)) continue;
      l.list.splice(l.index, 1);
      if (!chat.children) chat.children = [];
      chat.children.push(l.node);
      chat.open = true;
    }
    save();
    renderAll();
    toast(moves.length === 1 ? `Attached \u201c${nodeOf(moves[0][0]).name}\u201d to the chat it came from` : `Attached ${moves.length} artifacts to the chats they came from`, true);
  }
  function removeRelation(chatUrl, itemUrl) {
    const c = normUrl(chatUrl), a = normUrl(itemUrl);
    if (!lib.related[c]) return;
    lib.related[c] = lib.related[c].filter(x => x !== a);
    if (!lib.related[c].length) delete lib.related[c];
    saveLib();
  }
  // Everything attached to a chat: what Claude showed us, plus what you attached in your folders.
  function relatedFor(chatUrl) {
    const c = normUrl(chatUrl);
    const urls = new Set(lib.related[c] || []);
    for (const n of savedLinksFor(chatUrl)) for (const k of n.children || []) if (k.url) urls.add(normUrl(k.url));
    const known = new Map();
    for (const k of ['artifacts', 'design', 'code']) for (const x of lib[k] || []) known.set(normUrl(x.url), [x, k]);
    return [...urls].map(u => {
      const saved = savedLinksFor(u)[0];
      const [x, k] = known.get(u) || [null, 'artifacts'];
      return { name: (saved && saved.name) || (x && x.name) || 'Untitled artifact', url: (x && x.url) || (saved && saved.url) || u, meta: x && x.meta, list: k };
    });
  }

  function folderIdOf(id) {
    let l = locate(id);
    while (l && l.parent && l.parent.type !== 'folder') l = locate(l.parent.id);
    return l && l.parent ? l.parent.id : null;
  }
  const attachedTo = id => { const l = locate(id); return l && l.parent && l.parent.type === 'link' ? l.parent : null; };
  function pageContext() {
    const url = state.pageUrl || state.loc.url || '';
    const hits = isBlankClaudePage(url) ? [] : savedLinksFor(url);
    if (hits.length) {
      const h = hits.find(x => folderIdOf(x.id) === state.lastFolderId) || hits[0];
      const chat = attachedTo(h.id);
      return { status: 'saved', folderId: folderIdOf(h.id), linkId: h.id, attachedTo: chat ? chat.id : null };
    }
    if (state.autoFile && nodeOf(state.autoFile.folderId)) return { status: 'pending', folderId: state.autoFile.folderId, linkId: null };
    return { status: 'none', folderId: null, linkId: null };
  }

  let lastRevealed = null;
  function syncSideSel() {
    if (state.query) return;
    state.ctxFolder = null;
    if (state.loc.kind === 'folder') state.sideSel = state.loc.id;
    else if (state.loc.kind === 'library') state.sideSel = 'lib:' + state.loc.which;
    else {
      const c = pageContext();
      state.sideSel = c.linkId || c.folderId;
      state.ctxFolder = c.folderId;
    }
    // Open the folders above the highlighted row so you can see it (once per place).
    if (state.sideSel && !String(state.sideSel).startsWith('lib:') && state.sideSel !== lastRevealed) {
      lastRevealed = state.sideSel;
      let l = locate(state.sideSel), changed = false;
      while (l && l.parent) { if (!l.parent.open) { l.parent.open = true; changed = true; } l = locate(l.parent.id); }
      if (changed) { save(); renderSide(); }
    }
    applySideSel();
  }

  // Which of your folders already hold each address.
  function filedIndex() {
    const map = new Map();
    walk(state.tree, (n, depth, path) => {
      if (n.type !== 'link') return;
      const k = normUrl(n.url);
      const folders = path.filter(p => p.type === 'folder');
      const where = folders.length ? folders[folders.length - 1].name : 'Top level';
      if (!map.has(k)) map.set(k, []);
      if (!map.get(k).includes(where)) map.get(k).push(where);
    });
    return map;
  }
  const unfiledCount = (kind, idx = filedIndex()) => libList(kind).filter(x => !idx.has(normUrl(x.url)) && !(lib.archived || []).includes(normUrl(x.url))).length;
  function fmtDate(s) {
    if (!s) return '';
    const d = new Date(s);
    if (isNaN(d)) return '';
    const now = new Date();
    const time = d.toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return `Today ${time}`;
    if (d.toDateString() === new Date(now - 864e5).toDateString()) return `Yesterday ${time}`;
    return d.toLocaleDateString('en-AU', d.getFullYear() === now.getFullYear()
      ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function ago(t) {
    if (!t) return 'not yet';
    const m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return `${m} min ago`;
    if (m < 1440) return `${Math.round(m / 60)} h ago`;
    return `${Math.round(m / 1440)} days ago`;
  }

  // ---------- Main area ----------
  function renderMain() {
    const showPage = isApp && state.loc.kind === 'page' && !state.query;
    pane.hidden = !showPage;
    browseEl.hidden = showPage;
    $('pathbar').hidden = showPage;
    if (showPage) return;
    if (state.loc.kind === 'library') return renderLibrary();

    let items, where = false;
    if (state.query) {
      const q = state.query.toLowerCase();
      items = [];
      walk(rootList(), n => {
        if (n.name.toLowerCase().includes(q) || (n.url || '').toLowerCase().includes(q)) items.push(n);
      });
      where = true;
    } else {
      items = childrenOf(state.loc.id);
    }
    items = sortItems(items, where ? 'search' : 'folder', { updated: libUpdatedIndex() });
    const unfiltered = items.length;
    items = folderFilter(items);
    state.folderFiltered = items;
    const pages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
    if (state.libPage >= pages) state.libPage = pages - 1;
    const pageItems = items.slice(state.libPage * PAGE_SIZE, (state.libPage + 1) * PAGE_SIZE);
    const frag = document.createDocumentFragment();
    if (state.libSelectMode && items.length) frag.appendChild(folderActionBar());

    if (!isApp && !state.query && !ls.get(BANNER_STORE)) {
      const b = document.createElement('div');
      b.className = 'banner';
      b.innerHTML = '<span>Links open Claude in a separate tab here. Use the desktop app to keep Claude inside this window.</span><button class="tb" title="Hide this tip">Got it</button>';
      b.querySelector('button').addEventListener('click', () => { ls.set(BANNER_STORE, '1'); renderMain(); });
      frag.appendChild(b);
    }

    if (!items.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = state.query
        ? '<b>No results</b>Try a different word.'
        : unfiltered ? '<b>Nothing matches these filters</b>Change or reset them in Filter at the top.'
        : `<b>This folder is empty</b>Open a Claude chat and press ${K.mod}S to save it here, drag links in, or right-click for more.`;
      frag.appendChild(e);
    } else if (state.view === 'icons' && !where) {
      const g = document.createElement('div');
      g.className = 'grid';
      for (const n of pageItems) g.appendChild(tileFor(n));
      frag.appendChild(g);
    } else {
      const view = where ? 'search' : 'folder';
      const l = makeList(view);
      if (state.libSelectMode) {
        const all2 = document.createElement('input');
        all2.type = 'checkbox';
        all2.className = 'lchk lchk-all';
        all2.title = `Select all ${items.length}${pages > 1 ? ' (every page)' : ''}`;
        all2.addEventListener('mousedown', e => e.stopPropagation());
        all2.addEventListener('click', e => {
          e.stopPropagation();
          const everyone = items.every(x => multi.browse.has(x.id));
          multi.browse.clear();
          if (!everyone) { items.forEach(x => multi.browse.add(x.id)); state.browseSel = items[0].id; } else state.browseSel = null;
          renderMain();
        });
        l.querySelector('.lhead .hc').prepend(all2);
      }
      const updated = libUpdatedIndex();
      for (const n of pageItems) {
        l.appendChild(listRowFor(n, view, updated));
        if (n.type === 'link' && n.children && n.children.length && n.open !== false && !where) {
          for (const c of n.children) {
            const cr = listRowFor(c, view, updated);
            cr.classList.add('attached');
            const conn = document.createElement('span');
            conn.className = 'conn';
            conn.innerHTML = UI.attach;
            conn.title = `Attached to \u201c${n.name}\u201d`;
            cr.querySelector('.nm').prepend(conn);
            l.appendChild(cr);
          }
        }
      }
      frag.appendChild(l);
    }
    browseEl.replaceChildren(frag);
    renderPathbar(items.length);
    applyBrowseSel(false);
    renderLibPager(items.length);
  }

  // ---------- Filters for folder and search lists ----------
  const FF_KINDS = {
    any: 'All Kinds', folders: 'Folders', chats: 'Chats', artifacts: 'Artifacts (docs, slides, designs\u2026)',
    code: 'Code', projects: 'Projects', links: 'Other links',
  };
  const ARTIFACTY = new Set(['artifact', 'doc', 'slides', 'design', 'designsystem', 'dashboard']);
  state.ff = { kind: 'any', when: 'any', archived: false };
  function folderFilter(items) {
    const f = state.ff;
    const upd = libUpdatedIndex();
    return items.filter(n => {
      if (n.type === 'link' && isArchived(n.url) !== f.archived) return false;
      if (n.type === 'folder' && f.archived) return false;
      const k = kindOf(n);
      if (f.kind !== 'any') {
        const ok = f.kind === 'folders' ? n.type === 'folder' : f.kind === 'chats' ? k === 'chat' : f.kind === 'artifacts' ? ARTIFACTY.has(k)
          : f.kind === 'code' ? k === 'code' : f.kind === 'projects' ? k === 'project' : n.type === 'link' && !['chat', 'code', 'project'].includes(k) && !ARTIFACTY.has(k);
        if (!ok) return false;
      }
      if (f.when !== 'any') {
        const t = toTime(editedOf(n, upd)) || n.added || 0;
        const day = 864e5, now = Date.now(), start = new Date(); start.setHours(0, 0, 0, 0);
        const ok = !t ? f.when === 'older' : f.when === 'today' ? t >= start.getTime() : f.when === 'week' ? t >= now - 7 * day
          : f.when === 'month' ? t >= now - 30 * day : t < now - 30 * day;
        if (!ok) return false;
      }
      return true;
    });
  }
  const folderFilterCount = () => (state.ff.kind !== 'any' ? 1 : 0) + (state.ff.when !== 'any' ? 1 : 0) + (state.ff.archived ? 1 : 0);
  function showFolderFilterMenu(x, y) {
    const set = (k, v) => () => { state.ff[k] = v; state.libPage = 0; renderMain(); renderToolbar(); };
    showMenu(x, y, [
      ...Object.keys(FF_KINDS).map(k => ({ label: FF_KINDS[k], checked: state.ff.kind === k, run: set('kind', k) })),
      '-',
      ...Object.keys(WHEN).map(k => ({ label: WHEN[k], checked: state.ff.when === k, run: set('when', k) })),
      '-',
      { label: 'Archived Only', checked: state.ff.archived, run: set('archived', !state.ff.archived) },
      '-',
      { label: 'Reset Filters', disabled: !folderFilterCount(), run: () => { state.ff = { kind: 'any', when: 'any', archived: false }; state.libPage = 0; renderMain(); renderToolbar(); } },
    ]);
  }
  // The bar shown in Select mode for folder and search lists.
  function folderActionBar() {
    const ids = selectedBrowse();
    const nodes = ids.map(nodeOf).filter(Boolean);
    const bar = document.createElement('div');
    bar.className = 'libbar';
    const count = document.createElement('b');
    count.textContent = ids.length ? `${ids.length} selected` : 'Select items with the checkboxes';
    bar.appendChild(count);
    if (!ids.length) return bar;
    const b = (label, run, cls = '', title = '') => {
      const x = document.createElement('button');
      x.className = 'tb ' + cls;
      x.innerHTML = '<span class="t"></span>';
      x.firstChild.textContent = label;
      if (title) x.title = title;
      x.addEventListener('mousedown', e => e.stopPropagation());
      x.addEventListener('click', e => { e.stopPropagation(); run(); });
      bar.appendChild(x);
    };
    const links = nodes.filter(n => n.type === 'link');
    const chats = links.filter(n => kindOf(n) === 'chat' && /claude\.ai\/chat\//.test(n.url));
    b('Move To\u2026', () => moveManyPrompt(ids), '', 'Move them to another folder');
    b('New Folder with Items', () => newFolderWith(ids, browseEl), '', 'Put them into a new folder here');
    if (links.length) b(state.ff.archived ? 'Unarchive' : 'Archive', () => archiveItems(links.map(n => ({ url: n.url, name: n.name })), !state.ff.archived), '', 'Hide them from lists (only in this app; Claude is not changed)');
    if (links.length) b('Copy Links', () => navigator.clipboard.writeText(links.map(n => n.url).join('\n')).then(() => toast('Links copied')));
    b('Remove from Folder', () => removeNodes(ids), '', 'Remove them from your folders (nothing is deleted in Claude)');
    if (chats.length && isApp) b(`Delete ${chats.length === 1 ? 'Chat' : `${chats.length} Chats`} from Claude\u2026`, () => {
      const org = new Map((lib.chats || []).map(c => [normUrl(c.url), c.org]));
      deleteFromClaude(chats.map(n => ({ url: n.url, name: n.name, org: org.get(normUrl(n.url)) || null })));
    }, 'danger', 'Delete these chats from your Claude account for good');
    b('Clear Selection', () => { state.browseSel = null; multi.browse.clear(); renderMain(); });
    return bar;
  }

  const isArchived = url => (lib.archived || []).includes(normUrl(url));
  const WHEN = { any: 'Any time', today: 'Today', week: 'Last 7 days', month: 'Last 30 days', older: 'Older than 30 days' };
  function libVisible() {
    const kind = state.loc.which;
    const idx = filedIndex();
    let items = libList(kind);
    // Archived items (kept only in this app) show only when you ask for them.
    items = items.filter(x => (state.libFilter === 'archived') === isArchived(x.url));
    if (state.libFilter === 'unfiled') items = items.filter(x => !idx.has(normUrl(x.url)));
    if (state.libFilter === 'filed') items = items.filter(x => idx.has(normUrl(x.url)));
    if (state.libWhen !== 'any') {
      const day = 864e5, now = Date.now(), start = new Date(); start.setHours(0, 0, 0, 0);
      items = items.filter(x => {
        const t = x.updated ? new Date(x.updated).getTime() : 0;
        if (!t) return state.libWhen === 'older';
        return state.libWhen === 'today' ? t >= start.getTime() : state.libWhen === 'week' ? t >= now - 7 * day
          : state.libWhen === 'month' ? t >= now - 30 * day : t < now - 30 * day;
      });
    }
    if (kind === 'chats' && state.libArts !== 'any') items = items.filter(x => (relatedFor(x.url).length > 0) === (state.libArts === 'with'));
    if (kind === 'chats' && state.libStarred) items = items.filter(x => x.starred);
    if (state.query) {
      const q = state.query.toLowerCase();
      items = items.filter(x => (x.name || '').toLowerCase().includes(q));
    }
    return { kind, idx, items: sortItems(items, 'library', { idx }) };
  }

  function emptyMsg(title, text) {
    const e = document.createElement('div');
    e.className = 'empty';
    const b = document.createElement('b');
    b.textContent = title;
    e.append(b, document.createTextNode(text));
    return e;
  }

  function renderLibrary() {
    const { kind, idx, items } = libVisible();
    state.libFiltered = items;
    const pages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
    if (state.libPage >= pages) state.libPage = pages - 1;
    const pageItems = items.slice(state.libPage * PAGE_SIZE, (state.libPage + 1) * PAGE_SIZE);
    const lastPage = state.libPage === pages - 1;
    const all = libList(kind);
    const frag = document.createDocumentFragment();
    if (!ls.get(LIB_TIP_STORE) && all.length) {
      const b = document.createElement('div');
      b.className = 'banner';
      b.innerHTML = `<span>Drag items onto your folders to file them. Select several with ${isMac ? '\u2318' : 'Ctrl'}-click or ${isMac ? '\u21e7' : 'Shift'}-click first, or right-click and choose File in Folder. Choose Not Filed to see what is left.</span><button class="tb" title="Hide this tip">Got it</button>`;
      b.querySelector('button').addEventListener('click', () => { ls.set(LIB_TIP_STORE, '1'); renderLibrary(); });
      frag.appendChild(b);
    }
    if (!isApp) {
      frag.appendChild(emptyMsg('Desktop app only', 'Your Claude Library appears in the desktop app, which is signed in to Claude.'));
    } else if (lib.signedIn === false) {
      frag.appendChild(emptyMsg('Sign in to Claude first', 'Open New Chat, sign in to Claude, then click Refresh at the top right.'));
    } else if (!items.length) {
      if (lib.busy && !all.length) frag.appendChild(emptyMsg('Loading from Claude\u2026', 'This takes a few seconds the first time.'));
      else if (state.query) frag.appendChild(emptyMsg('No matches', 'Try a different word.'));
      else if (state.libFilter === 'archived') frag.appendChild(emptyMsg('Nothing archived', 'Archived items appear here. Archiving only hides them in this app; Claude is not changed.'));
      else if (activeFilterCount()) frag.appendChild(emptyMsg('Nothing matches these filters', 'Change or reset the filters.'));
      else if (state.libFilter === 'unfiled' && all.length) frag.appendChild(emptyMsg('All filed', 'Every item here is in one of your folders.'));
      else if (lib.error) frag.appendChild(emptyMsg('Could not read your list from Claude', `Click Refresh to try again. Details: ${lib.error}`));
      else frag.appendChild(emptyMsg('Nothing here yet', 'Click Refresh at the top right to load it from Claude.'));
    } else {
      if (state.libSelectMode) frag.appendChild(libActionBar(kind));     // only in Select mode, so the list never jumps
      const l = makeList('library', 'lib-list');
      if (state.libSelectMode) {
        const all2 = document.createElement('input');
        all2.type = 'checkbox';
        all2.className = 'lchk lchk-all';
        all2.title = `Select all ${items.length} (every page)`;
        all2.addEventListener('mousedown', e => e.stopPropagation());
        all2.addEventListener('click', e => {
          e.stopPropagation();
          const everyone = items.every(x => libSel.has(x.url));
          if (everyone) items.forEach(x => libSel.delete(x.url)); else items.forEach(x => libSel.add(x.url));
          renderLibrary();
        });
        l.querySelector('.lhead .hc').prepend(all2);
      }
      libRowItems = new Map();
      for (const x of pageItems) {
        libRowItems.set(x.url, x);
        l.appendChild(libRow(x, kind, idx));
        if (kind === 'chats' && state.libShowAttached) {
          for (const a of relatedFor(x.url)) {
            if (libRowItems.has(a.url)) continue;
            libRowItems.set(a.url, a);
            const ar = libRow(a, a.list, idx);
            ar.classList.add('attached');
            const conn = document.createElement('span');
            conn.className = 'conn';
            conn.innerHTML = UI.attach;
            conn.title = `Made in \u201c${libName(x, 'chats')}\u201d`;
            ar.querySelector('.nm').prepend(conn);
            l.appendChild(ar);
          }
        }
      }
      if (kind === 'chats' && state.libShowAttached && lastPage) {
        const linked = new Set();
        for (const c of lib.chats || []) for (const a of relatedFor(c.url)) linked.add(normUrl(a.url));
        const q = (state.query || '').toLowerCase();
        const loose = libList('artifacts').filter(a => !linked.has(normUrl(a.url)) && !libRowItems.has(a.url) &&
          (state.libFilter !== 'unfiled' || !idx.has(normUrl(a.url))) && (!q || (a.name || '').toLowerCase().includes(q)));
        if (loose.length) {
          const h = document.createElement('div');
          h.className = 'lsub';
          h.textContent = `Artifacts not linked to a chat (${loose.length}). Drag one onto its chat above to link them.`;
          l.appendChild(h);
          for (const a of loose) { libRowItems.set(a.url, Object.assign({ list: 'artifacts' }, a)); l.appendChild(libRow(a, 'artifacts', idx)); }
        }
      }
      frag.appendChild(l);
    }
    browseEl.replaceChildren(frag);
    for (const k of [...libSel]) if (!libRowItems.has(k) && !items.some(x => x.url === k)) libSel.delete(k);
    applyLibSel();
    renderLibPathbar(kind, idx, items.length);
  }

  const hasWords = t => /[\p{L}\p{N}]/u.test(t || '');
  const libName = (x, kind) => hasWords(x.name) ? x.name : `Untitled ${KIND_NAME[libKind(x, kind)].toLowerCase()}`;
  // What kind of thing a Library item is: your own choice first, then what Claude's page says, then clear words in its name.
  function libKind(x, list) {
    const mine = lib.kinds && lib.kinds[normUrl(x.url)];
    if (mine) return mine;
    if (list === 'designsystems') return 'designsystem';
    if (list === 'chats') return 'chat';
    if (list === 'projects') return 'project';
    if (list === 'code') return 'code';
    if (list === 'scheduled') return 'schedule';
    const meta = (x.meta || '').toLowerCase(), name = (x.name || '').toLowerCase(), both = meta + ' ' + name;
    if (/design system/.test(both)) return 'designsystem';
    if (list === 'design') return 'design';
    if (/\b(slides?|deck|presentation)\b/.test(meta)) return 'slides';
    if (/\bdashboard\b/.test(meta)) return 'dashboard';
    if (/\b(docs?|document)\b/.test(meta)) return 'doc';
    if (/\bdesign\b/.test(meta)) return 'design';
    if (/\b(slides|deck|presentation)\b/.test(name)) return 'slides';
    if (/\bdashboard\b/.test(name)) return 'dashboard';
    return 'artifact';
  }
  const CHOOSABLE_KINDS = ['chat', 'doc', 'slides', 'design', 'designsystem', 'dashboard', 'artifact', 'project', 'code', 'schedule', 'link'];
  function chooseKindMenu(x, y, current, onPick) {
    showMenu(x, y, CHOOSABLE_KINDS.map(k => ({ label: KIND_NAME[k], icon: k, checked: k === current, run: () => onPick(k) })));
  }

  function libRow(x, kind, idx) {
    const r = libRowBase(x, kind, idx);
    if (state.libSelectMode) {
      const c = document.createElement('input');
      c.type = 'checkbox';
      c.className = 'lchk';
      c.checked = libSel.has(x.url);
      c.title = 'Select';
      r.querySelector('.nm').prepend(c);
    }
    return r;
  }
  function libRowBase(x, kind, idx) {
    const r = document.createElement('div');
    const where = idx.get(normUrl(x.url));
    r.className = 'lrow item lib' + (where ? ' filed' : '');
    r.dataset.key = x.url;
    r.draggable = true;
    const k = libKind(x, kind);
    fillRow(r, 'library', colourIcon(k), libName(x, kind), {
      kind: KIND_NAME[k],
      edited: fmtDate(x.updated),
      filed: where ? where.join(', ') : '',
      address: x.url.replace(/^https?:\/\//, ''),
    });
    r.title = `${libName(x, kind)}\n${x.url}`;
    return r;
  }

  function applyLibSel() {
    browseEl.querySelectorAll('.item.lib').forEach(r => {
      r.classList.toggle('selected', libSel.has(r.dataset.key));
      const c = r.querySelector('.lchk');
      if (c) c.checked = libSel.has(r.dataset.key);
    });
    const ca = browseEl.querySelector('.lchk-all');
    if (ca) {
      const f = state.libFiltered || [];
      const n = f.filter(x => libSel.has(x.url)).length;
      ca.checked = f.length > 0 && n === f.length;
      ca.indeterminate = n > 0 && n < f.length;
    }
    const bar = browseEl.querySelector('.libbar');
    if (bar && state.loc.kind === 'library') bar.replaceWith(libActionBar(state.loc.which));

    const st = $('status');
    if (st && state.loc.kind === 'library') {
      const shown = browseEl.querySelectorAll('.item.lib').length;
      st.textContent = libSel.size ? `${libSel.size} of ${shown} selected` : `${shown} shown`;
    }
  }

  function activeFilterCount() {
    return (state.libFilter !== 'all' ? 1 : 0) + (state.libWhen !== 'any' ? 1 : 0) + (state.libArts !== 'any' ? 1 : 0) + (state.libStarred ? 1 : 0);
  }
  function libActionBar(kind) {
    const sel = selectedLibItems();
    const bar = document.createElement('div');
    bar.className = 'libbar';
    const b = (label, run, cls = '', title = '') => {
      const x = document.createElement('button');
      x.className = 'tb ' + cls;
      x.innerHTML = `<span class="t"></span>`;
      x.firstChild.textContent = label;
      if (title) x.title = title;
      x.addEventListener('mousedown', e => e.stopPropagation());
      x.addEventListener('click', e => { e.stopPropagation(); run(); });
      bar.appendChild(x);
      return x;
    };
    const count = document.createElement('b');
    count.textContent = sel.length ? `${sel.length} selected` : 'Select items with the checkboxes';
    bar.appendChild(count);
    if (!sel.length) return bar;
    b('File in Folder\u2026', () => fileLibPrompt(sel), '', 'Save them into one of your folders');
    const archivedView = state.libFilter === 'archived';
    b(archivedView ? 'Unarchive' : 'Archive', () => archiveItems(sel, !archivedView), '', 'Hide them from this list (only in this app; Claude is not changed)');
