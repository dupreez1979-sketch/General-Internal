<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Navigator</title>
<style>
  :root {
    --side-w: 300px;
    --bg: #ffffff;
    --side: #f3f3f3;
    --line: #e1e1e1;
    --text: #1b1b1b;
    --muted: #6b6b6b;
    --hover: #e5e5e5;
    --sel: #d9e6f5;
    --sel-line: #8db4e2;
    --accent: #c96442;
    --accent-text: #ffffff;
    --input: #ffffff;
    --menu: #fbfbfb;
    --drop: #2f7de1;
    --shadow: 0 8px 28px rgba(0,0,0,.16);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e; --side: #252525; --line: #383838; --text: #ececec; --muted: #9e9e9e;
      --hover: #323232; --sel: #2b3d52; --sel-line: #4f7cb0; --input: #1a1a1a; --menu: #2a2a2a;
      --shadow: 0 8px 28px rgba(0,0,0,.55);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    display: grid; grid-template-columns: var(--side-w) 5px 1fr; overflow: hidden;
  }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing webview { pointer-events: none; }
  button { font: inherit; color: inherit; }
  svg { display: block; }

  /* ---------- Sidebar ---------- */
  #side { background: var(--side); display: flex; flex-direction: column; min-width: 0; position: relative; }
  .side-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px; }
  .mac body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  .mac-app .side-head { padding-top: 44px; -webkit-app-region: drag; }
  .mac-app .pane-bar { min-height: 44px; -webkit-app-region: drag; }
  .mac-app .side-head button, .mac-app .pane-bar button { -webkit-app-region: no-drag; }
  /* Frosted sidebar like Finder and Notes. */
  .mac-app body { background: transparent; }
  .mac-app #side { background: color-mix(in srgb, var(--side) 55%, transparent); }
  .mac-app #main { background: var(--bg); }
  .brand { font-weight: 600; font-size: 14px; flex: 1; display: flex; align-items: center; gap: 8px; }
  .brand-dot { width: 18px; height: 18px; border-radius: 5px; background: var(--accent); }
  .btn-primary {
    background: var(--accent); color: var(--accent-text); border: 0; border-radius: 6px;
    padding: 6px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font-weight: 500;
  }
  .btn-primary:hover { filter: brightness(1.06); }
  .search { margin: 0 12px 8px; position: relative; }
  .search input {
    width: 100%; padding: 6px 10px 6px 30px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--input); color: var(--text); font: inherit; outline: none;
  }
  .search input:focus { border-color: var(--sel-line); }
  .search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .toolbar { display: flex; gap: 2px; padding: 0 8px 6px; border-bottom: 1px solid var(--line); }
  .tool {
    background: none; border: 0; border-radius: 5px; padding: 5px 7px; cursor: pointer; color: var(--muted);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .tool:hover { background: var(--hover); color: var(--text); }
  .tool:disabled { opacity: .4; cursor: default; background: none; }
  .tool .t { font-size: 12px; white-space: nowrap; }
  .spacer { flex: 1; }

  #tree { flex: 1; overflow: auto; padding: 4px 4px 40px; outline: none; }
  #tree.drop-root { box-shadow: inset 0 0 0 2px var(--drop); }
  .row {
    --depth: 0;
    display: flex; align-items: center; height: 28px; padding-left: calc(4px + var(--depth) * 16px); padding-right: 8px;
    border-radius: 5px; cursor: default; position: relative; white-space: nowrap; border: 1px solid transparent;
  }
  .row:hover { background: var(--hover); }
  .row.selected { background: var(--sel); }
  #tree:focus-within .row.selected, #tree:focus .row.selected { border-color: var(--sel-line); }
  .row.active .label { font-weight: 600; }
  .row.active::before {
    content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--accent);
  }
  .row.dragging { opacity: .45; }
  .row.drop-into { background: var(--sel); box-shadow: inset 0 0 0 2px var(--drop); }
  .row.drop-before::after, .row.drop-after::after {
    content: ""; position: absolute; left: calc(24px + var(--depth) * 16px); right: 4px; height: 2px; background: var(--drop); border-radius: 1px;
  }
  .row.drop-before::after { top: -1px; }
  .row.drop-after::after { bottom: -1px; }
  .twisty { width: 18px; height: 18px; flex: none; display: grid; place-items: center; color: var(--muted); border-radius: 4px; }
  .twisty svg { transition: transform .12s ease; }
  .twisty.open svg { transform: rotate(90deg); }
  .twisty:hover:not(:empty) { color: var(--text); }
  .icon { width: 18px; height: 18px; flex: none; display: grid; place-items: center; margin-right: 6px; }
  .label { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .count { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .label input {
    width: 100%; font: inherit; color: var(--text); background: var(--input); border: 1px solid var(--sel-line);
    border-radius: 3px; padding: 1px 4px; outline: none; margin-left: -5px;
  }
  .empty-hint { color: var(--muted); padding: 16px 12px; text-align: center; }

  .side-foot { border-top: 1px solid var(--line); padding: 6px 8px; display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }

  #splitter { cursor: col-resize; background: var(--side); border-right: 1px solid var(--line); }
  #splitter:hover, body.resizing #splitter { background: var(--sel-line); }

  /* ---------- Main pane ---------- */
  #main { display: flex; flex-direction: column; min-width: 0; position: relative; }
  .pane-bar { display: flex; align-items: center; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .pane-title { flex: 1; min-width: 0; padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .pane-title small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  #progress { position: absolute; left: 0; top: 0; height: 2px; width: 0; background: var(--accent); transition: width .3s ease, opacity .4s; opacity: 0; z-index: 2; }
  #progress.on { width: 70%; opacity: 1; }
  #pane { flex: 1; position: relative; display: flex; }
  #pane webview { flex: 1; border: 0; }
  .welcome { margin: auto; max-width: 520px; padding: 32px; text-align: center; }
  .welcome h1 { font-size: 22px; margin: 0 0 10px; font-weight: 600; }
  .welcome p { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
  .welcome kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font: 12px ui-monospace, monospace; }

  /* ---------- Menus, dialogs, toast ---------- */
  #menu {
    position: fixed; z-index: 50; min-width: 210px; background: var(--menu); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: var(--shadow); padding: 4px; display: none;
  }
  #menu.show { display: block; }
  #menu button {
    display: flex; width: 100%; align-items: center; gap: 10px; background: none; border: 0; border-radius: 5px;
    padding: 6px 10px; text-align: left; cursor: default;
  }
  #menu button:hover:not(:disabled) { background: var(--hover); }
  #menu button:disabled { opacity: .4; }
  #menu button:focus-visible { outline: none; background: var(--hover); }
  #menu .k { margin-left: auto; color: var(--muted); font-size: 11px; padding-left: 16px; }
  #menu .mi { width: 16px; display: grid; place-items: center; color: var(--muted); }
  #menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
  #menu.danger-last button.danger { color: #c0392b; }

  dialog {
    border: 1px solid var(--line); border-radius: 10px; padding: 0; background: var(--menu); color: var(--text);
    box-shadow: var(--shadow); width: min(460px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(0,0,0,.25); }
  dialog form { padding: 18px 20px 16px; display: grid; gap: 12px; }
  dialog h2 { margin: 0; font-size: 16px; font-weight: 600; }
  dialog label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
  dialog input, dialog select {
    font: inherit; font-size: 13px; color: var(--text); background: var(--input); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 9px; outline: none;
  }
  dialog input:focus, dialog select:focus { border-color: var(--sel-line); }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .btn { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  .btn:hover { background: var(--hover); }

  #toast {
    position: absolute; left: 10px; right: 10px; bottom: 44px; background: #2b2b2b; color: #fff; border-radius: 8px;
    padding: 9px 12px; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow);
    opacity: 0; transform: translateY(8px); transition: .18s ease; pointer-events: none; z-index: 20;
  }
  #toast.show { opacity: 1; transform: none; pointer-events: auto; }
  #toast span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toast button { background: none; border: 0; color: #ffb59c; font-weight: 600; cursor: pointer; padding: 0; }

  @media (max-width: 640px) {
    body { grid-template-columns: 1fr; }
    #splitter, #main { display: none; }
  }
</style>
</head>
<body>

<aside id="side" aria-label="Folders">
  <div class="side-head">
    <div class="brand"><span class="brand-dot"></span>Claude Navigator</div>
    <button class="btn-primary" id="newChatBtn" title="Start a new chat (Ctrl+N)">
      <svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      New chat
    </button>
  </div>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input id="search" type="search" placeholder="Search folders and links (Ctrl+F)" autocomplete="off">
  </div>
  <div class="toolbar">
    <button class="tool" id="tNewFolder" title="New folder (Ctrl+Shift+N)"><span data-icon="folderPlus"></span><span class="t">Folder</span></button>
    <button class="tool" id="tNewLink" title="Add a link (Ctrl+L)"><span data-icon="linkPlus"></span><span class="t">Link</span></button>
    <button class="tool" id="tSaveCurrent" title="Save the page you are viewing into the selected folder (Ctrl+S)"><span data-icon="star"></span><span class="t">Save page</span></button>
    <span class="spacer"></span>
    <button class="tool" id="tCollapse" title="Collapse all"><span data-icon="collapse"></span></button>
    <button class="tool" id="tMore" title="More"><span data-icon="more"></span></button>
  </div>
  <div id="tree" role="tree" tabindex="0" aria-label="Folder tree"></div>
  <div class="side-foot"><span id="footInfo"></span></div>
  <div id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>
</aside>

<div id="splitter" title="Drag to resize"></div>

<main id="main">
  <div id="progress"></div>
  <div class="pane-bar">
    <button class="tool" id="pBack" title="Back"><span data-icon="back"></span></button>
    <button class="tool" id="pFwd" title="Forward"><span data-icon="fwd"></span></button>
    <button class="tool" id="pReload" title="Reload"><span data-icon="reload"></span></button>
    <div class="pane-title" id="paneTitle">Claude</div>
    <button class="tool" id="pSave" title="Save this page to the selected folder"><span data-icon="star"></span><span class="t">Save to folder</span></button>
    <button class="tool" id="pExternal" title="Open this page in your web browser"><span data-icon="external"></span></button>
  </div>
  <div id="pane"></div>
</main>

<div id="menu" role="menu"></div>

<dialog id="linkDlg">
  <form method="dialog" id="linkForm">
    <h2 id="linkDlgTitle">Add link</h2>
    <label>Name<input id="linkName" placeholder="e.g. Board paper draft"></label>
    <label>Address<input id="linkUrl" placeholder="Paste a Claude chat, project or artifact link" required></label>
    <label>Folder<select id="linkFolder"></select></label>
    <div class="dlg-actions">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn-primary" value="ok" id="linkOk">Save</button>
    </div>
  </form>
</dialog>

<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
  'use strict';

  // ---------- Constants and icons ----------
  const STORE = 'claudeNavigator.tree.v1';
  const WIDTH_STORE = 'claudeNavigator.sideWidth';
  const LAST_URL = 'claudeNavigator.lastUrl';
  const HOME = 'https://claude.ai/new';
  const isApp = !!(window.navigatorApp && window.navigatorApp.isElectron);
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  const K = isMac
    ? { mod: '\u2318', shift: '\u21e7', del: '\u232b', enter: 'Return', rename: 'Return', open: '\u2318\u2193' }
    : { mod: 'Ctrl+', shift: 'Shift+', del: 'Del', enter: 'Enter', rename: 'F2', open: 'Enter' };
  if (isMac) document.documentElement.classList.add('mac');
  if (isApp && isMac) document.documentElement.classList.add('mac-app');
  // Show the right shortcut symbols in tooltips and placeholders.
  document.querySelectorAll('[title], [placeholder]').forEach(el => {
    for (const a of ['title', 'placeholder']) {
      const v = el.getAttribute(a);
      if (v && v.includes('Ctrl+')) el.setAttribute(a, v.replace(/Ctrl\+Shift\+/g, K.mod + K.shift).replace(/Ctrl\+/g, K.mod));
    }
  });

  const I = {
    chev: '<svg width="12" height="12" viewBox="0 0 16 16"><path d="M6 3.5L10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    folder: '<svg width="17" height="17" viewBox="0 0 16 16"><path d="M1.5 4a1 1 0 011-1h3.3l1.4 1.5h6.3a1 1 0 011 1V12a1 1 0 01-1 1h-11a1 1 0 01-1-1z" fill="#F5C142" stroke="#D49B14" stroke-width=".8"/></svg>',
    folderOpen: '<svg width="17" height="17" viewBox="0 0 16 16"><path d="M1.5 4a1 1 0 011-1h3.3l1.4 1.5h6.3a1 1 0 011 1V6H3.6L1.5 12z" fill="#E3A925" stroke="#C48A0E" stroke-width=".8"/><path d="M3.4 6.5h11.2l-1.9 6H1.6z" fill="#F7CD5B" stroke="#D49B14" stroke-width=".8" stroke-linejoin="round"/></svg>',
    chat: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M2.5 4a1.5 1.5 0 011.5-1.5h8A1.5 1.5 0 0113.5 4v5.5A1.5 1.5 0 0112 11H7l-3 2.5V11a1.5 1.5 0 01-1.5-1.5z" fill="none" stroke="#C96442" stroke-width="1.4" stroke-linejoin="round"/></svg>',
    project: '<svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="4.5" width="12" height="9" rx="1.5" fill="none" stroke="#5B7FBF" stroke-width="1.4"/><path d="M5.5 4.5V3.5a1 1 0 011-1h3a1 1 0 011 1v1M2 8h12" fill="none" stroke="#5B7FBF" stroke-width="1.4"/></svg>',
    artifact: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 1.8h5l3.2 3.2v8.5a.8.8 0 01-.8.8H4a.8.8 0 01-.8-.8V2.6a.8.8 0 01.8-.8z" fill="none" stroke="#3E9A7E" stroke-width="1.4" stroke-linejoin="round"/><path d="M9 1.8V5h3.2M5.5 8.5h5M5.5 11h3.5" fill="none" stroke="#3E9A7E" stroke-width="1.4"/></svg>',
    design: '<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="#8A5CD1" stroke-width="1.4"/><circle cx="5.7" cy="6.3" r="1" fill="#8A5CD1"/><circle cx="9.8" cy="5.6" r="1" fill="#8A5CD1"/><circle cx="10.8" cy="9.2" r="1" fill="#8A5CD1"/></svg>',
    claude: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1.8v12.4M1.8 8h12.4M3.6 3.6l8.8 8.8M12.4 3.6l-8.8 8.8" stroke="#C96442" stroke-width="1.6" stroke-linecap="round"/></svg>',
    link: '<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="#7A7A7A" stroke-width="1.3"/><path d="M2 8h12M8 2c-2 2-2 10 0 12M8 2c2 2 2 10 0 12" fill="none" stroke="#7A7A7A" stroke-width="1.1"/></svg>',
    folderPlus: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M1.5 4a1 1 0 011-1h3.3l1.4 1.5h6.3a1 1 0 011 1V12a1 1 0 01-1 1h-11a1 1 0 01-1-1z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 7v4M6 9h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
    linkPlus: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M6.5 9.5l3-3M5 7.5L3.8 8.7a2.3 2.3 0 003.3 3.3L8.3 10.8M11 8.5l1.2-1.2a2.3 2.3 0 00-3.3-3.3L7.7 5.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
    star: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 2l1.8 3.8 4.1.5-3 2.8.8 4.1L8 11.2l-3.7 2 .8-4.1-3-2.8 4.1-.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>',
    collapse: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M4.5 6L8 3l3.5 3M4.5 10L8 13l3.5-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 8 8)"/></svg>',
    more: '<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="3.5" cy="8" r="1.2" fill="currentColor"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/><circle cx="12.5" cy="8" r="1.2" fill="currentColor"/></svg>',
    back: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    fwd: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    reload: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M13 8a5 5 0 11-1.5-3.6M13 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    external: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M9 2.5h4.5V7M13.5 2.5L7.5 8.5M11.5 9.5v3a1 1 0 01-1 1h-7a1 1 0 01-1-1v-7a1 1 0 011-1h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };
  document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = I[el.dataset.icon] || ''; });

  // ---------- Data ----------
  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  const Folder = (name, children = [], open = false) => ({ id: uid(), type: 'folder', name, open, children });
  const Link = (name, url) => ({ id: uid(), type: 'link', name, url });

  const seed = () => [
    Folder('Claude', [
      Link('New chat', 'https://claude.ai/new'),
      Link('Recent chats', 'https://claude.ai/recents'),
      Link('Projects', 'https://claude.ai/projects'),
      Link('Artifacts', 'https://claude.ai/artifacts'),
    ], true),
    Folder('Work', [
      Folder('Monkey Baa', [
        Folder('Board', [Folder('November 2026 meeting')]),
        Folder('Finance'),
        Folder('NCTI'),
      ], true),
    ], true),
    Folder('Personal'),
  ];

  const state = {
    tree: load(),
    selectedId: null,
    activeUrl: null,
    filter: '',
  };
  const history = [];

  function load() {
    try {
      const t = JSON.parse(localStorage.getItem(STORE));
      if (Array.isArray(t)) return t;
    } catch (e) { /* ignore */ }
    return seed();
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state.tree)); } catch (e) { /* ignore */ }
  }
  function snap() {
    history.push(JSON.stringify(state.tree));
    if (history.length > 60) history.shift();
  }
  function undo() {
    const prev = history.pop();
    if (!prev) return toast('Nothing to undo');
    state.tree = JSON.parse(prev);
    commit();
    toast('Undone', false);
  }
  function commit() { save(); render(); }

  function locate(id, nodes = state.tree, parent = null) {
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      if (n.id === id) return { node: n, list: nodes, index: i, parent };
      if (n.type === 'folder') {
        const r = locate(id, n.children, n);
        if (r) return r;
      }
    }
    return null;
  }
  // True if `aId` is `bId` or contains it.
  function contains(aId, bId) {
    if (aId === bId) return true;
    const a = locate(aId);
    return !!(a && a.node.type === 'folder' && locate(bId, a.node.children));
  }
  function walk(nodes, fn, depth = 0, path = []) {
    for (const n of nodes) {
      fn(n, depth, path);
      if (n.type === 'folder') walk(n.children, fn, depth + 1, path.concat(n));
    }
  }
  function countLinks(n) {
    let c = 0;
    walk(n.children, x => { if (x.type === 'link') c++; });
    return c;
  }

  // ---------- URL helpers ----------
  function normUrl(u) {
    try { const x = new URL(u); return (x.origin + x.pathname).replace(/\/+$/, ''); } catch (e) { return u || ''; }
  }
  function fixUrl(u) {
    u = (u || '').trim();
    if (!u) return '';
    if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
    return u;
  }
  function kindOf(n) {
    if (n.type === 'folder') return 'folder';
    const u = n.url || '';
    if (/claude\.ai\/chat\//.test(u)) return 'chat';
    if (/claude\.ai\/project\//.test(u)) return 'project';
    if (/artifact/i.test(u)) return 'artifact';
    if (/canva\.com/.test(u)) return 'design';
    if (/claude\.ai/.test(u)) return 'claude';
    return 'link';
  }
  function iconFor(n, open) {
    const k = kindOf(n);
    if (k === 'folder') return open ? I.folderOpen : I.folder;
    return I[k];
  }
  function cleanTitle(t) {
    return (t || '').replace(/\s*[-|–]\s*Claude\s*$/i, '').trim();
  }
  function guessName(url) {
    const k = kindOf({ type: 'link', url });
    if (k === 'chat') return 'Untitled chat';
    if (k === 'project') return 'Untitled project';
    if (k === 'artifact') return 'Untitled artifact';
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return url; }
  }

  // ---------- Rendering ----------
  const treeEl = document.getElementById('tree');

  function matches(n, f) {
    if (n.name.toLowerCase().includes(f)) return true;
    if (n.type === 'link') return (n.url || '').toLowerCase().includes(f);
    return n.children.some(c => matches(c, f));
  }

  function render() {
    const f = state.filter.trim().toLowerCase();
    const frag = document.createDocumentFragment();
    let shown = 0;
    const build = (nodes, depth) => {
      for (const n of nodes) {
        if (f && !matches(n, f)) continue;
        const open = n.type === 'folder' && (n.open || !!f);
        frag.appendChild(rowFor(n, depth, open));
        shown++;
        if (open) build(n.children, depth + 1);
      }
    };
    build(state.tree, 0);
    treeEl.replaceChildren(frag);
    if (!shown) {
      const d = document.createElement('div');
      d.className = 'empty-hint';
      d.textContent = f ? 'No matches.' : 'No folders yet. Right-click here or use the Folder button.';
      treeEl.appendChild(d);
    }
    let folders = 0, links = 0;
    walk(state.tree, n => n.type === 'folder' ? folders++ : links++);
    document.getElementById('footInfo').textContent =
      `${folders} folder${folders === 1 ? '' : 's'}, ${links} link${links === 1 ? '' : 's'}`;
  }

  function rowFor(n, depth, open) {
    const r = document.createElement('div');
    r.className = 'row';
    r.dataset.id = n.id;
    r.draggable = true;
    r.setAttribute('role', 'treeitem');
    r.style.setProperty('--depth', depth);
    if (n.id === state.selectedId) r.classList.add('selected');
    if (n.type === 'link' && state.activeUrl && normUrl(n.url) === state.activeUrl) r.classList.add('active');
    const hasKids = n.type === 'folder' && n.children.length > 0;
    if (n.type === 'folder') r.setAttribute('aria-expanded', String(open));
    r.innerHTML =
      `<span class="twisty${open ? ' open' : ''}">${hasKids ? I.chev : ''}</span>` +
      `<span class="icon">${iconFor(n, open && hasKids)}</span><span class="label"></span>`;
    r.querySelector('.label').textContent = n.name;
    if (n.type === 'folder' && !open && hasKids) {
      const c = countLinks(n);
      if (c) {
        const s = document.createElement('span');
        s.className = 'count';
        s.textContent = c;
        r.appendChild(s);
      }
    }
    r.title = n.type === 'link' ? `${n.name}\n${n.url}` : n.name;
    return r;
  }

  function rowEl(id) { return treeEl.querySelector(`.row[data-id="${CSS.escape(id)}"]`); }

  function select(id, { scroll = true } = {}) {
    state.selectedId = id;
    treeEl.querySelectorAll('.row.selected').forEach(r => r.classList.remove('selected'));
    const r = id && rowEl(id);
    if (r) {
      r.classList.add('selected');
      if (scroll) r.scrollIntoView({ block: 'nearest' });
    }
  }

  function reveal(id) {
    const loc = locate(id);
    if (!loc) return;
    let p = loc.parent;
    while (p) { p.open = true; p = locate(p.id).parent; }
    commit();
    select(id);
  }

  function markActive() {
    treeEl.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
    if (!state.activeUrl) return;
    walk(state.tree, n => {
      if (n.type === 'link' && normUrl(n.url) === state.activeUrl) {
        const r = rowEl(n.id);
        if (r) r.classList.add('active');
      }
    });
  }

  // ---------- Tree actions ----------
  function targetFolder() {
    const s = state.selectedId && locate(state.selectedId);
    if (!s) return null;
    return s.node.type === 'folder' ? s.node : s.parent;
  }
  function insertInto(folder, node) {
    (folder ? folder.children : state.tree).push(node);
    if (folder) folder.open = true;
  }
  function toggle(n, force) {
    if (n.type !== 'folder') return;
    n.open = force === undefined ? !n.open : force;
    commit();
  }

  function newFolder(parent = targetFolder()) {
    snap();
    const f = Folder('New folder');
    insertInto(parent, f);
    state.selectedId = f.id;
    commit();
    startRename(f.id);
  }

  function addLink(parent, name, url, { rename = false } = {}) {
    snap();
    const l = Link(name || guessName(url), url);
    insertInto(parent, l);
    state.selectedId = l.id;
    commit();
    select(l.id);
    if (rename) startRename(l.id);
    return l;
  }

  function removeNode(id) {
    const loc = locate(id);
    if (!loc) return;
    const n = loc.node;
    if (n.type === 'folder' && n.children.length) {
      const c = countLinks(n);
      if (!confirm(`Delete the folder "${n.name}" and everything inside it${c ? ` (${c} link${c === 1 ? '' : 's'})` : ''}?`)) return;
    }
    snap();
    loc.list.splice(loc.index, 1);
    const next = loc.list[loc.index] || loc.list[loc.index - 1] || loc.parent;
    state.selectedId = next ? next.id : null;
    commit();
    toast(`Deleted "${n.name}"`, true);
  }

  function duplicate(id) {
    const loc = locate(id);
    if (!loc) return;
    snap();
    const copy = JSON.parse(JSON.stringify(loc.node));
    const reid = x => { x.id = uid(); if (x.children) x.children.forEach(reid); };
    reid(copy);
    copy.name += ' (copy)';
    loc.list.splice(loc.index + 1, 0, copy);
    state.selectedId = copy.id;
    commit();
  }

  function sortFolder(folder) {
    snap();
    const list = folder ? folder.children : state.tree;
    list.sort((a, b) => (a.type === b.type ? 0 : a.type === 'folder' ? -1 : 1) ||
      a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
    commit();
  }

  function setAllOpen(open) {
    walk(state.tree, n => { if (n.type === 'folder') n.open = open; });
    commit();
  }

  function startRename(id) {
    const r = rowEl(id);
    const loc = locate(id);
    if (!r || !loc) return;
    r.scrollIntoView({ block: 'nearest' });
    const label = r.querySelector('.label');
    const input = document.createElement('input');
    input.value = loc.node.name;
    label.replaceChildren(input);
    r.draggable = false;
    input.focus();
    input.select();
    let done = false;
    const finish = ok => {
      if (done) return;
      done = true;
      const v = input.value.trim();
      if (ok && v && v !== loc.node.name) { snap(); loc.node.name = v; }
      commit();
      select(id);
      treeEl.focus({ preventScroll: true });
    };
    input.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
    input.addEventListener('mousedown', e => e.stopPropagation());
    input.addEventListener('click', e => e.stopPropagation());
  }

  // ---------- Link dialog ----------
  const dlg = document.getElementById('linkDlg');
  const fName = document.getElementById('linkName');
  const fUrl = document.getElementById('linkUrl');
  const fFolder = document.getElementById('linkFolder');
  let dlgDone = null;

  function folderOptions(selectedId, excludeId) {
    fFolder.replaceChildren();
    const top = new Option('(Top level)', '');
    fFolder.add(top);
    walk(state.tree, (n, depth, path) => {
      if (n.type !== 'folder') return;
      if (excludeId && (n.id === excludeId || path.some(p => p.id === excludeId))) return;
      const o = new Option('   '.repeat(depth + 1) + n.name, n.id);
      fFolder.add(o);
    });
    fFolder.value = selectedId || '';
  }

  function openLinkDialog({ title = 'Add link', name = '', url = '', folderId = null, onSave }) {
    document.getElementById('linkDlgTitle').textContent = title;
    fName.value = name;
    fUrl.value = url;
    folderOptions(folderId);
    dlgDone = onSave;
    dlg.showModal();
    (url ? fName : fUrl).focus();
  }
  dlg.addEventListener('close', () => {
    if (dlg.returnValue !== 'ok' || !dlgDone) return;
    const url = fixUrl(fUrl.value);
    if (!url) return;
    const folder = fFolder.value ? locate(fFolder.value).node : null;
    dlgDone({ name: fName.value.trim() || guessName(url), url, folder });
    dlgDone = null;
  });

  function promptNewLink(url = '') {
    const f = targetFolder();
    openLinkDialog({
      title: 'Add link', url, folderId: f ? f.id : null,
      onSave: ({ name, url, folder }) => addLink(folder, name, url),
    });
  }

  function editLink(id) {
    const loc = locate(id);
    if (!loc || loc.node.type !== 'link') return;
    openLinkDialog({
      title: 'Edit link', name: loc.node.name, url: loc.node.url, folderId: loc.parent ? loc.parent.id : null,
      onSave: ({ name, url, folder }) => {
        snap();
        const cur = locate(id);
        cur.node.name = name;
        cur.node.url = url;
        if ((cur.parent ? cur.parent.id : null) !== (folder ? folder.id : null)) {
          cur.list.splice(cur.index, 1);
          insertInto(folder, cur.node);
        }
        commit();
        select(id);
      },
    });
  }

  function moveTo(id) {
    const loc = locate(id);
    if (!loc) return;
    if (loc.node.type === 'link') return editLink(id);
    // Folder: reuse the dialog's folder picker via a tiny prompt.
    document.getElementById('linkDlgTitle').textContent = `Move "${loc.node.name}"`;
    folderOptions(loc.parent ? loc.parent.id : null, id);
    fName.closest('label').hidden = true;
    fUrl.closest('label').hidden = true;
    fUrl.required = false;
    dlgDone = null;
    dlg.showModal();
    fFolder.focus();
    dlg.addEventListener('close', function once() {
      dlg.removeEventListener('close', once);
      fName.closest('label').hidden = false;
      fUrl.closest('label').hidden = false;
      fUrl.required = true;
      if (dlg.returnValue !== 'ok') return;
      const dest = fFolder.value ? locate(fFolder.value).node : null;
      snap();
      const cur = locate(id);
      cur.list.splice(cur.index, 1);
      insertInto(dest, cur.node);
      commit();
      reveal(id);
    });
  }

  // ---------- Viewer (desktop app webview or browser fallback) ----------
  const pane = document.getElementById('pane');
  const paneTitle = document.getElementById('paneTitle');
  const progress = document.getElementById('progress');
  let view = null;

  if (isApp) {
    view = document.createElement('webview');
    view.setAttribute('partition', 'persist:claude');
    view.setAttribute('allowpopups', '');
    let start = HOME;
    try { start = localStorage.getItem(LAST_URL) || HOME; } catch (e) { /* ignore */ }
    view.setAttribute('src', start);
    pane.appendChild(view);

    const update = () => {
      let url = '', title = '';
      try { url = view.getURL(); title = view.getTitle(); } catch (e) { return; }
      state.activeUrl = normUrl(url);
      paneTitle.textContent = cleanTitle(title) || 'Claude';
      paneTitle.title = url;
      document.title = (cleanTitle(title) ? cleanTitle(title) + ' - ' : '') + 'Claude Navigator';
      document.getElementById('pBack').disabled = !view.canGoBack();
      document.getElementById('pFwd').disabled = !view.canGoForward();
      try { if (/^https:\/\/claude\.ai\//.test(url)) localStorage.setItem(LAST_URL, url); } catch (e) { /* ignore */ }
      markActive();
    };
    ['did-navigate', 'did-navigate-in-page', 'page-title-updated', 'dom-ready'].forEach(ev => view.addEventListener(ev, update));
    view.addEventListener('did-start-loading', () => progress.classList.add('on'));
    view.addEventListener('did-stop-loading', () => { progress.classList.remove('on'); update(); });
  } else {
    // Plain browser: claude.ai cannot be embedded, so links open in one reusable tab.
    document.querySelector('.pane-bar').hidden = true;
    document.getElementById('tSaveCurrent').hidden = true;
    pane.innerHTML = `
      <div class="welcome">
        <h1>Your Claude folders</h1>
        <p>Click any link in the tree and it opens in Claude in a separate tab, with every Claude feature available.</p>
        <p>Claude does not allow itself to be shown inside another web page. Run the desktop app version to see Claude right here, next to your folders.</p>
        <p>Tip: drag a link from the browser address bar onto any folder to save it. Right-click for more options. <kbd>${K.rename}</kbd> renames, <kbd>${K.del}</kbd> deletes, <kbd>${K.mod.replace('+', '')}</kbd>+<kbd>Z</kbd> undoes.</p>
      </div>`;
  }

  function openUrl(url, { newWindow = false } = {}) {
    if (!url) return;
    if (isApp && !newWindow) {
      view.loadURL(url);
    } else if (isApp && newWindow) {
      window.navigatorApp.openWindow(url);
    } else {
      const w = window.open(url, newWindow ? '_blank' : 'claude-pane');
      if (w) w.focus();
      state.activeUrl = normUrl(url);
      markActive();
    }
  }
  function openExternal(url) {
    if (isApp) window.navigatorApp.openExternal(url);
    else window.open(url, '_blank');
  }

  function saveCurrent(folder = targetFolder()) {
    if (!isApp) return promptNewLink();
    const url = view.getURL();
    const name = cleanTitle(view.getTitle()) || guessName(url);
    const existing = [];
    walk(state.tree, n => { if (n.type === 'link' && normUrl(n.url) === normUrl(url)) existing.push(n); });
    addLink(folder, name, url, { rename: true });
    toast(existing.length ? `Saved. This page is also in ${existing.length} other place${existing.length === 1 ? '' : 's'}.` : `Saved to ${folder ? folder.name : 'top level'}`);
  }

  // ---------- Context menu ----------
  const menu = document.getElementById('menu');
  function showMenu(x, y, items) {
    menu.replaceChildren();
    for (const it of items) {
      if (!it) continue;
      if (it === '-') { menu.appendChild(document.createElement('hr')); continue; }
      const b = document.createElement('button');
      b.setAttribute('role', 'menuitem');
      b.innerHTML = `<span class="mi">${it.icon ? I[it.icon] : ''}</span><span></span>${it.key ? `<span class="k">${it.key}</span>` : ''}`;
      b.children[1].textContent = it.label;
      if (it.danger) b.style.color = '#c0392b';
      b.disabled = !!it.disabled;
      b.addEventListener('click', () => { hideMenu(); it.run(); });
      menu.appendChild(b);
    }
    menu.classList.add('show');
    const r = menu.getBoundingClientRect();
    menu.style.left = Math.min(x, innerWidth - r.width - 6) + 'px';
    menu.style.top = Math.min(y, innerHeight - r.height - 6) + 'px';
    menu.querySelector('button:not(:disabled)')?.focus();
  }
  function hideMenu() { menu.classList.remove('show'); }
  document.addEventListener('mousedown', e => { if (!menu.contains(e.target)) hideMenu(); });
  window.addEventListener('blur', hideMenu);
  menu.addEventListener('keydown', e => {
    const btns = [...menu.querySelectorAll('button:not(:disabled)')];
    const i = btns.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') btns[(i + 1) % btns.length].focus();
    else if (e.key === 'ArrowUp') btns[(i - 1 + btns.length) % btns.length].focus();
    else if (e.key === 'Escape') { hideMenu(); treeEl.focus(); }
    else return;
    e.preventDefault();
  });

  function menuFor(n) {
    if (!n) {
      return [
        { label: 'New folder', icon: 'folderPlus', run: () => newFolder(null) },
        { label: 'Add link', icon: 'linkPlus', run: () => { state.selectedId = null; promptNewLink(); } },
        isApp && { label: 'Save current page here', icon: 'star', run: () => saveCurrent(null) },
        '-',
        { label: 'Sort top level A to Z', run: () => sortFolder(null) },
        { label: 'Expand all', run: () => setAllOpen(true) },
        { label: 'Collapse all', run: () => setAllOpen(false) },
      ];
    }
    if (n.type === 'folder') {
      return [
        { label: n.open ? 'Collapse' : 'Expand', run: () => toggle(n) },
        '-',
        { label: 'New subfolder', icon: 'folderPlus', run: () => newFolder(n) },
        { label: 'Add link here', icon: 'linkPlus', run: () => { state.selectedId = n.id; promptNewLink(); } },
        isApp && { label: 'Save current page here', icon: 'star', run: () => saveCurrent(n) },
        { label: 'New chat, then save here', icon: 'chat', run: () => { state.selectedId = n.id; openUrl(HOME); toast('When the chat has a title, click Save page'); } },
        '-',
        { label: 'Rename', key: K.rename, run: () => startRename(n.id) },
        { label: 'Move to...', run: () => moveTo(n.id) },
        { label: 'Duplicate', run: () => duplicate(n.id) },
        { label: 'Sort contents A to Z', run: () => sortFolder(n) },
        '-',
        { label: 'Delete', key: K.del, danger: true, run: () => removeNode(n.id) },
      ];
    }
    return [
      { label: 'Open', key: K.open, run: () => openUrl(n.url) },
      { label: 'Open in new window', run: () => openUrl(n.url, { newWindow: true }) },
      { label: 'Open in web browser', icon: 'external', run: () => openExternal(n.url) },
      { label: 'Copy link', run: () => { navigator.clipboard.writeText(n.url).then(() => toast('Link copied')); } },
      '-',
      { label: 'Rename', key: K.rename, run: () => startRename(n.id) },
      { label: 'Edit link or move...', run: () => editLink(n.id) },
      isApp && { label: 'Replace with current page', run: () => { snap(); n.url = view.getURL(); commit(); toast('Link updated'); } },
      { label: 'Duplicate', run: () => duplicate(n.id) },
      '-',
      { label: 'Delete', key: K.del, danger: true, run: () => removeNode(n.id) },
    ];
  }

  // ---------- Tree events ----------
  treeEl.addEventListener('click', e => {
    const row = e.target.closest('.row');
    if (!row) { select(null); return; }
    const loc = locate(row.dataset.id);
    if (!loc) return;
    select(loc.node.id, { scroll: false });
    if (loc.node.type === 'folder') toggle(loc.node);
    else openUrl(loc.node.url, { newWindow: e.ctrlKey || e.metaKey });
  });

  treeEl.addEventListener('auxclick', e => {
    if (e.button !== 1) return;
    const row = e.target.closest('.row');
    const loc = row && locate(row.dataset.id);
    if (loc && loc.node.type === 'link') openUrl(loc.node.url, { newWindow: true });
  });

  treeEl.addEventListener('contextmenu', e => {
    e.preventDefault();
    const row = e.target.closest('.row');
    const loc = row && locate(row.dataset.id);
    if (loc) select(loc.node.id, { scroll: false });
    showMenu(e.clientX, e.clientY, menuFor(loc ? loc.node : null));
  });

  treeEl.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const ids = [...treeEl.querySelectorAll('.row')].map(r => r.dataset.id);
    if (!ids.length) return;
    let i = ids.indexOf(state.selectedId);
    const cur = i >= 0 ? locate(ids[i]) : null;
    const n = cur && cur.node;
    switch (e.key) {
      case 'ArrowDown':
        if (e.metaKey && n) { n.type === 'folder' ? toggle(n, true) : openUrl(n.url); break; }
        select(ids[Math.min(ids.length - 1, i + 1)]);
        break;
      case 'ArrowUp': select(ids[i <= 0 ? 0 : i - 1]); break;
      case 'Home': select(ids[0]); break;
      case 'End': select(ids[ids.length - 1]); break;
      case 'ArrowRight':
        if (n && n.type === 'folder' && n.children.length) {
          if (!n.open) toggle(n, true);
          else select(ids[i + 1]);
        }
        break;
      case 'ArrowLeft':
        if (n) {
          if (n.type === 'folder' && n.open && n.children.length) toggle(n, false);
          else if (cur.parent) select(cur.parent.id);
        }
        break;
      case 'Enter':
        if (!n) break;
        if (isMac) startRename(n.id);
        else n.type === 'folder' ? toggle(n) : openUrl(n.url);
        break;
      case 'o': case 'O':
        if (!(e.metaKey || e.ctrlKey) || !n) return;
        n.type === 'folder' ? toggle(n, true) : openUrl(n.url);
        break;
      case 'F2': if (n) startRename(n.id); break;
      case 'Delete': case 'Backspace': if (n) removeNode(n.id); break;
      case 'ContextMenu': {
        if (!n) return;
        const r = rowEl(n.id).getBoundingClientRect();
        showMenu(r.left + 30, r.bottom, menuFor(n));
        break;
      }
      default: return;
    }
    e.preventDefault();
  });

  // ---------- Drag and drop ----------
  const NAV_TYPE = 'application/x-claude-nav-id';
  let dropTarget = null, hoverId = null, hoverTimer = null;

  function clearDrop() {
    treeEl.classList.remove('drop-root');
    treeEl.querySelectorAll('.drop-into,.drop-before,.drop-after').forEach(r => r.classList.remove('drop-into', 'drop-before', 'drop-after'));
  }
  function extractUrl(dt) {
    const list = (dt.getData('text/uri-list') || '').split(/\r?\n/).find(l => l && !l.startsWith('#'));
    if (list) return list.trim();
    const t = (dt.getData('text/plain') || '').trim();
    return /^https?:\/\/\S+$/i.test(t) ? t : '';
  }
  function hasUrl(dt) {
    const t = [...dt.types];
    return t.includes('text/uri-list') || t.includes('text/plain');
  }

  treeEl.addEventListener('dragstart', e => {
    const row = e.target.closest('.row');
    if (!row) return;
    const loc = locate(row.dataset.id);
    e.dataTransfer.effectAllowed = 'copyMove';
    e.dataTransfer.setData(NAV_TYPE, row.dataset.id);
    if (loc.node.type === 'link') {
      e.dataTransfer.setData('text/uri-list', loc.node.url);
      e.dataTransfer.setData('text/plain', loc.node.url);
    }
    row.classList.add('dragging');
    hideMenu();
  });
  treeEl.addEventListener('dragend', e => {
    e.target.closest?.('.row')?.classList.remove('dragging');
    clearDrop();
    clearTimeout(hoverTimer);
  });

  treeEl.addEventListener('dragover', e => {
    const internal = [...e.dataTransfer.types].includes(NAV_TYPE);
    if (!internal && !hasUrl(e.dataTransfer)) return;
    e.preventDefault();
    clearDrop();
    const row = e.target.closest('.row');
    if (!row) {
      treeEl.classList.add('drop-root');
      dropTarget = { id: null, zone: 'root' };
      e.dataTransfer.dropEffect = internal ? 'move' : 'copy';
      return;
    }
    const id = row.dataset.id;
    const n = locate(id).node;
    const dragging = treeEl.querySelector('.row.dragging');
    if (internal && dragging && contains(dragging.dataset.id, id)) {
      e.dataTransfer.dropEffect = 'none';
      dropTarget = null;
      return;
    }
    const rect = row.getBoundingClientRect();
    const y = (e.clientY - rect.top) / rect.height;
    const zone = n.type === 'folder' ? (y < 0.25 ? 'before' : y > 0.75 ? 'after' : 'into') : (y < 0.5 ? 'before' : 'after');
    row.classList.add('drop-' + zone);
    dropTarget = { id, zone };
    e.dataTransfer.dropEffect = internal ? 'move' : 'copy';

    // Hovering over a closed folder opens it, like Explorer.
    if (zone === 'into' && !n.open && n.children.length) {
      if (hoverId !== id) {
        clearTimeout(hoverTimer);
        hoverId = id;
        hoverTimer = setTimeout(() => {
          n.open = true;
          save();
          const dragId = dragging && dragging.dataset.id;
          render();
          if (dragId) rowEl(dragId)?.classList.add('dragging');
        }, 650);
      }
    } else { clearTimeout(hoverTimer); hoverId = null; }
  });

  treeEl.addEventListener('dragleave', e => {
    if (!treeEl.contains(e.relatedTarget)) { clearDrop(); clearTimeout(hoverTimer); hoverId = null; }
  });

  treeEl.addEventListener('drop', e => {
    e.preventDefault();
    clearTimeout(hoverTimer);
    hoverId = null;
    const t = dropTarget;
    dropTarget = null;
    clearDrop();
    if (!t) return;
    const dragId = e.dataTransfer.getData(NAV_TYPE);
    let node, isNew = false;
    if (dragId) {
      if (t.id && contains(dragId, t.id)) return;
      snap();
      const src = locate(dragId);
      src.list.splice(src.index, 1);
      node = src.node;
    } else {
      const url = extractUrl(e.dataTransfer);
      if (!url) return;
      snap();
      node = Link(guessName(url), url);
      isNew = true;
    }
    if (!t.id) state.tree.push(node);
    else {
      const tgt = locate(t.id);
      if (t.zone === 'into') { tgt.node.children.push(node); tgt.node.open = true; }
      else tgt.list.splice(tgt.index + (t.zone === 'after' ? 1 : 0), 0, node);
    }
    state.selectedId = node.id;
    commit();
    if (isNew) startRename(node.id);
  });

  // ---------- Toolbar, search, shortcuts ----------
  const searchEl = document.getElementById('search');
  searchEl.addEventListener('input', () => { state.filter = searchEl.value; render(); });
  searchEl.addEventListener('keydown', e => {
    if (e.key === 'Escape') { searchEl.value = ''; state.filter = ''; render(); treeEl.focus(); }
    if (e.key === 'ArrowDown' || e.key === 'Enter') {
      const first = treeEl.querySelector('.row');
      if (first) { select(first.dataset.id); treeEl.focus(); e.preventDefault(); }
    }
  });

  document.getElementById('newChatBtn').addEventListener('click', () => openUrl(HOME));
  document.getElementById('tNewFolder').addEventListener('click', () => newFolder());
  document.getElementById('tNewLink').addEventListener('click', () => promptNewLink());
  document.getElementById('tSaveCurrent').addEventListener('click', () => saveCurrent());
  document.getElementById('pSave').addEventListener('click', () => saveCurrent());
  document.getElementById('tCollapse').addEventListener('click', () => setAllOpen(false));
  document.getElementById('pBack').addEventListener('click', () => view && view.canGoBack() && view.goBack());
  document.getElementById('pFwd').addEventListener('click', () => view && view.canGoForward() && view.goForward());
  document.getElementById('pReload').addEventListener('click', () => view && view.reload());
  document.getElementById('pExternal').addEventListener('click', () => view && openExternal(view.getURL()));

  document.getElementById('tMore').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect();
    showMenu(r.left, r.bottom + 4, [
      { label: 'Expand all', run: () => setAllOpen(true) },
      { label: 'Collapse all', run: () => setAllOpen(false) },
      { label: 'Undo', key: K.mod + 'Z', disabled: !history.length, run: undo },
      '-',
      { label: 'Back up folders to a file', run: exportTree },
      { label: 'Restore folders from a file', run: () => document.getElementById('importFile').click() },
      '-',
      { label: 'Reset to example folders', danger: true, run: () => {
        if (!confirm('Replace all your folders with the example set? You can undo this.')) return;
        snap(); state.tree = seed(); commit();
      } },
    ]);
  });

  function exportTree() {
    const blob = new Blob([JSON.stringify({ app: 'claude-navigator', version: 1, saved: new Date().toISOString(), tree: state.tree }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `claude-folders-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  document.getElementById('importFile').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const tree = Array.isArray(data) ? data : data.tree;
      if (!Array.isArray(tree)) throw new Error('No folders found in that file');
      const ok = n => n && typeof n.name === 'string' && (n.type === 'link' ? typeof n.url === 'string' : n.type === 'folder' && Array.isArray(n.children) && n.children.every(ok));
      if (!tree.every(ok)) throw new Error('That file is not a Claude Navigator backup');
      const fresh = n => { n.id = uid(); if (n.children) n.children.forEach(fresh); };
      tree.forEach(fresh);
      snap();
      state.tree = tree;
      commit();
      toast('Folders restored', true);
    } catch (err) {
      alert('Could not restore: ' + err.message);
    }
  });

  document.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (mod && e.key.toLowerCase() === 'f') { e.preventDefault(); searchEl.focus(); searchEl.select(); }
    else if (mod && e.shiftKey && e.key.toLowerCase() === 'n') { e.preventDefault(); newFolder(); }
    else if (mod && e.key.toLowerCase() === 'n') { e.preventDefault(); openUrl(HOME); }
    else if (mod && e.key.toLowerCase() === 'l') { e.preventDefault(); promptNewLink(); }
    else if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveCurrent(); }
    else if (mod && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); }
  });
  // Shortcuts forwarded from the Claude pane by the desktop app.
  if (isApp && window.navigatorApp.onShortcut) {
    window.navigatorApp.onShortcut(k => {
      if (k === 'new-chat') openUrl(HOME);
      if (k === 'save') saveCurrent();
      if (k === 'search') { searchEl.focus(); searchEl.select(); }
      if (k === 'new-folder') newFolder();
    });
  }

  // ---------- Toast ----------
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(msg, withUndo = false) {
    document.getElementById('toastMsg').textContent = msg;
    document.getElementById('toastUndo').hidden = !withUndo;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), withUndo ? 6000 : 2600);
  }
  document.getElementById('toastUndo').addEventListener('click', () => { toastEl.classList.remove('show'); undo(); });

  // ---------- Resizable sidebar ----------
  const setWidth = w => document.documentElement.style.setProperty('--side-w', Math.max(200, Math.min(640, w)) + 'px');
  try { const w = +localStorage.getItem(WIDTH_STORE); if (w) setWidth(w); } catch (e) { /* ignore */ }
  document.getElementById('splitter').addEventListener('mousedown', e => {
    e.preventDefault();
    document.body.classList.add('resizing');
    const move = ev => setWidth(ev.clientX);
    const up = ev => {
      document.body.classList.remove('resizing');
      removeEventListener('mousemove', move);
      removeEventListener('mouseup', up);
      try { localStorage.setItem(WIDTH_STORE, String(Math.max(200, Math.min(640, ev.clientX)))); } catch (err) { /* ignore */ }
    };
    addEventListener('mousemove', move);
    addEventListener('mouseup', up);
  });
  document.getElementById('splitter').addEventListener('dblclick', () => { setWidth(300); try { localStorage.removeItem(WIDTH_STORE); } catch (e) { /* ignore */ } });

  // Keep multiple windows of the navigator in sync.
  addEventListener('storage', e => { if (e.key === STORE) { state.tree = load(); render(); } });

  render();
})();
</script>
</body>
</html>
