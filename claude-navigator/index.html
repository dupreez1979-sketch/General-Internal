  // ---------- Sidebar events ----------
  treeEl.addEventListener('click', e => {
    const row = e.target.closest('.row');
    if (!row) return;
    if (row.dataset.action === 'new-chat') return newChat();
    if (row.dataset.action === 'claude-other') {
      ls.set('claudeNavigator.claudeOtherOpen', ls.get('claudeNavigator.claudeOtherOpen') === '1' ? '0' : '1');
      return renderSide();
    }
    if (row.dataset.lib) return go({ kind: 'library', which: row.dataset.lib });
    const n = nodeOf(row.dataset.id);
    if (!n) return;
    const xa = e.target.closest('.xall');
    if (xa) return xa.dataset.all === '1' ? setSubtree(n, false, true) : setSubtree(n, true);
    if (e.altKey && n.type === 'folder' && (e.target.closest('.twisty') || row.classList.contains('section'))) return setSubtree(n, !n.open);
    if (e.metaKey || e.ctrlKey) {
      if (!multi.side.size && state.sideSel && nodeOf(state.sideSel)) multi.side.add(state.sideSel);
      if (multi.side.has(n.id)) multi.side.delete(n.id); else multi.side.add(n.id);
      multi.sideAnchor = n.id;
      return applySideSel(false);
    }
    if (e.shiftKey) {
      const from = multi.sideAnchor || (nodeOf(state.sideSel) ? state.sideSel : n.id);
      selectRange(sideIds(), multi.side, from, n.id);
      return applySideSel(false);
    }
    multi.side.clear();
    multi.sideAnchor = n.id;
    if (row.classList.contains('section')) { state.sideSel = n.id; applySideSel(false); return toggle(n); }
    if (n.type === 'folder' && e.target.closest('.twisty')) return toggle(n);
    openNode(n);
  });
  treeEl.addEventListener('dblclick', e => {
    if (e.target.closest('.xall, .twisty')) return;           // the arrow already toggled on each click
    const sec = e.target.closest('.row.section');
    if (sec) return openNode(nodeOf(sec.dataset.id));
    // Double-clicking a folder (or a chat with attached items) expands or collapses it, like its arrow.
    const row = e.target.closest('.row[data-id]');
    const n = row && nodeOf(row.dataset.id);
    if (n && n.children && n.children.length) toggle(n);
  });
  treeEl.addEventListener('auxclick', e => {
    const row = e.button === 1 && e.target.closest('.row');
    const n = row && nodeOf(row.dataset.id);
    if (n && n.type === 'link') openNewWindow(n.url);
  });
  treeEl.addEventListener('contextmenu', e => {
    e.preventDefault();
    const row = e.target.closest('.row');
    if (row && row.dataset.action === 'new-chat') {
      showNewMenu(e.clientX, e.clientY);
      return;
    }
    if (row && (row.dataset.lib || row.classList.contains('lib-head'))) {
      showMenu(e.clientX, e.clientY, [{ label: 'Refresh from Claude', run: () => refreshLibrary(true) }]);
      return;
    }
    const n = row && nodeOf(row.dataset.id);
    if (n && multi.side.has(n.id) && multi.side.size > 1) return showMenu(e.clientX, e.clientY, menuForMany(selectedSide(), treeEl));
    multi.side.clear();
    if (n) { state.sideSel = n.id; applySideSel(false); }
    showMenu(e.clientX, e.clientY, menuFor(n, treeEl));
  });
  treeEl.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const ids = [...treeEl.querySelectorAll('.row[data-id]')].map(r => r.dataset.id);
    if (!ids.length) return;
    const i = ids.indexOf(state.sideSel);
    const loc = locate(state.sideSel);
    const n = loc && loc.node;
    const isSection = !!(n && !loc.parent && n.type === 'folder');
    const mod = e.metaKey || e.ctrlKey;
    const pick = id => {
      if (!id) return;
      state.sideSel = id;
      applySideSel();
      const l = locate(id);
      if (l && l.node.type === 'folder' && l.parent) go({ kind: 'folder', id });
    };
    switch (e.key) {
      case 'ArrowDown': if (mod) { if (n) openNode(n); } else pick(ids[Math.min(ids.length - 1, i + 1)]); break;
      case 'ArrowUp': if (mod) up(); else pick(ids[i <= 0 ? 0 : i - 1]); break;
      case 'ArrowRight':
        if (n && n.type === 'folder') {
          if (e.altKey) setSubtree(n, true);
          else if (!n.open) toggle(n, true);
          else pick(ids[i + 1]);
        }
        break;
      case 'ArrowLeft':
        if (n && e.altKey && n.type === 'folder') { setSubtree(n, false, isSection); break; }
        if (n) {
          if (n.type === 'folder' && n.open && (isSection || n.children.length)) toggle(n, false);
          else if (loc.parent) pick(loc.parent.id);
        }
        break;
      case 'Enter': case ' ': if (n) (isSection ? toggle(n) : openNode(n)); break;
      case 'F2': if (n) startRename(n.id, treeEl); break;
      case 'Delete': case 'Backspace':
        if (n && (mod || !isMac || e.key === 'Delete')) { if (multi.side.size > 1) removeNodes(selectedSide()); else removeNode(n.id); }
        break;
      case 'Escape': multi.side.clear(); applySideSel(false); break;
      default: return;
    }
    e.preventDefault();
  });

  // ---------- Main area events ----------
  const libKeys = () => [...browseEl.querySelectorAll('.item.lib')].map(r => r.dataset.key);
  const libItem = key => libRowItems.get(key) || libList(state.loc.which).find(x => x.url === key);
  // Everything selected, including on other pages of the list.
  const selectedLibItems = () => {
    const out = [], seen = new Set();
    for (const x of (state.libFiltered || []).concat([...libRowItems.values()])) {
      if (libSel.has(x.url) && !seen.has(x.url)) { seen.add(x.url); out.push(x); }
    }
    return out;
  };
  function openLib(url, newWindow = false) {
    if (newWindow) return openNewWindow(url);
    go({ kind: 'page', url });
  }
  function libMouseDown(e) {
    const it = e.target.closest('.item.lib');
    libPendingSingle = null;
    if (it && e.target.closest('.lchk')) {
      e.preventDefault();
      if (libSel.has(it.dataset.key)) libSel.delete(it.dataset.key); else libSel.add(it.dataset.key);
      libAnchor = it.dataset.key;
      return applyLibSel();
    }
    if (e.target.closest('.libbar, .lchk-all')) return;
    if (!it) {
      if (!e.target.closest('.lhead')) { libSel.clear(); applyLibSel(); }
      return;
    }
    const key = it.dataset.key;
    const keys = libKeys();
    if (e.metaKey || e.ctrlKey) {
      if (libSel.has(key)) libSel.delete(key); else libSel.add(key);
      libAnchor = key;
    } else if (e.shiftKey && libAnchor && keys.includes(libAnchor)) {
      const [a, b] = [keys.indexOf(libAnchor), keys.indexOf(key)].sort((x, y) => x - y);
      libSel.clear();
      keys.slice(a, b + 1).forEach(k => libSel.add(k));
    } else if (libSel.has(key)) {
      if (e.button === 0) libPendingSingle = key; // keep the group for dragging
    } else {
      libSel.clear();
      libSel.add(key);

  $('libSelectBtn').addEventListener('click', () => { state.libSelectMode = !state.libSelectMode; renderMain(); renderToolbar(); });
  $('libAttachedBtn').addEventListener('click', () => {
    state.libShowAttached = !state.libShowAttached;
    ls.set('claudeNavigator.libShowAttached', state.libShowAttached ? 'on' : 'off');
    renderMain();
    renderToolbar();
  });

  searchEl.addEventListener('input', () => {
    state.query = searchEl.value.trim();
    state.libPage = 0;
    state.browseSel = null;
    renderMain();
    renderToolbar();
    if (!state.query) syncSideSel();
  });
  searchEl.addEventListener('keydown', e => {
    if (e.key === 'Escape') { searchEl.value = ''; state.query = ''; renderMain(); renderToolbar(); syncSideSel(); browseEl.focus(); }
    if ((e.key === 'ArrowDown' || e.key === 'Enter') && state.query) {
      const first = browseEl.querySelector('.item');
      if (first) { state.browseSel = first.dataset.id; applyBrowseSel(); browseEl.focus(); e.preventDefault(); }
    }
  });

  $('sMore').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect();
    showMenu(r.left, r.top - 4, [
      { label: 'Undo', key: K.mod + 'Z', disabled: !undoStack.length, run: undo },
      '-',
      { label: 'Expand All', run: () => setAllOpen(true) },
      { label: 'Collapse All', run: () => setAllOpen(false) },
      '-',
      isApp && { label: 'Hide Claude\u2019s Own Sidebar', checked: hideClaudeSidebar(), run: () => setHideClaudeSidebar(!hideClaudeSidebar()) },
      isApp && '-',
      { label: 'Back Up Folders to a File…', run: exportTree },
      { label: 'Restore Folders from a File…', run: () => $('importFile').click() },
      '-',
      { label: 'Reset to Example Folders', run: () => {
        if (!confirm('Replace all your folders with the example set? You can undo this.')) return;
        snap(); state.tree = seed(); commit();
      } },
    ], { above: true });
  });

  function exportTree() {
    const blob = new Blob([JSON.stringify({ app: 'claude-navigator', version: 1, saved: new Date().toISOString(), tree: state.tree }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `claude-folders-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  $('importFile').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const tree = Array.isArray(data) ? data : data.tree;
      const ok = n => n && typeof n.name === 'string' &&
        (n.type === 'link' ? typeof n.url === 'string' : n.type === 'folder' && Array.isArray(n.children) && n.children.every(ok));
      if (!Array.isArray(tree) || !tree.every(ok)) throw new Error('That file is not a Claude Navigator backup.');
      const fresh = n => { n.id = uid(); if (n.children) n.children.forEach(fresh); };
      tree.forEach(fresh);
      snap();
      state.tree = tree;
      go({ kind: 'folder', id: null });
      commit();
      toast('Folders restored', true);
    } catch (err) {
      alert('Could not restore: ' + err.message);
    }
  });

  document.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.altKey && /^Digit[0-9]$/.test(e.code)) {
      const n = +e.code.slice(5);
      e.preventDefault();
      return setProfile(n === 0 ? null : (profiles()[n - 1] || {}).id || state.profileId);
    }
    if (!mod || e.altKey) return;
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    const k = e.key.toLowerCase();
    if (k === 'f') openFind();
    else if (k === 'g' && pageShowing()) findStep(!e.shiftKey);
    else if (k === 'r' && pageShowing()) view.reload();
    else if (k === 'p' && pageShowing()) view.print();
    else if (k === 'n' && e.shiftKey) newFolder();
    else if (k === 'n') newChat();
    else if (k === 'l') promptNewLink();
    else if (k === 's' && e.shiftKey) saveAs();
    else if (k === 's') saveCurrent();
    else if (k === 'z' && !typing) undo();
    else if (k === '[') back();
    else if (k === ']') forward();
    else if (k === '1') setView('icons');
    else if (k === '2') setView('list');
    else if (k === 'arrowup' && !typing) up();
    else return;
    e.preventDefault();
  });
  // Shortcuts pressed while typing inside Claude are passed on by the desktop app.
  if (isApp && window.navigatorApp.onShortcut) {
    const actions = {
      'new-chat': newChat,
      'new-folder': () => newFolder(),
      'add-link': () => promptNewLink(),
      save: () => saveCurrent(),
      'save-as': saveAs,
      find: openFind,
      'find-next': () => findStep(true),
      'find-prev': () => findStep(false),
      print: () => { if (pageShowing()) view.print(); else window.print(); },
      reload: () => { if (pageShowing()) view.reload(); },
      back, forward, up,
      'toggle-claude-sidebar': () => setHideClaudeSidebar(!hideClaudeSidebar()),
      'claude-settings': () => openAccountLink(ACCOUNT_LINKS[0]),
      'view-icons': () => setView('icons'),
      'view-list': () => setView('list'),
    };
    window.navigatorApp.onShortcut(k => {
      const m = /^profile-(\d)$/.exec(k);
      if (m) return setProfile(+m[1] === 0 ? null : (profiles()[+m[1] - 1] || {}).id || state.profileId);
      if (!dlg.open && actions[k]) actions[k]();
    });

    // Files saved from Claude land in Downloads.
    window.navigatorApp.onDownload(d => {
      if (d.state === 'started') toast(`Downloading “${d.name}”…`);
      else if (d.state === 'completed') toast(`Downloaded “${d.name}”`, { label: isMac ? 'Show in Finder' : 'Show in folder', run: () => window.navigatorApp.showInFolder(d.path) });
      else toast(`Download of “${d.name}” did not finish`);
    });

    // Pop-up windows from Claude: keep names current and catch newly created items.
    window.navigatorApp.onChildNavigated(({ url, title }) => {
      if (/^\/chat\//.test(pathOf(state.pageUrl)) && itemKindOf(pathOf(url)) === 'artifact') addRelation(state.pageUrl, url);
      syncNames(url, title);
      checkAutoFile(url, title, true);
    });

    // "Save Link to a Folder" from the right-click menu inside Claude.
    window.navigatorApp.onContextAction(a => {
      if (a.action !== 'save-link') return;
      const text = a.text && a.text.length < 120 ? a.text : '';
      openDialog({
        title: 'Save Link', name: text, url: a.url, folderId: state.lastFolderId,
        onSave: ({ name, url, folderId }) => { if (url) addLink(folderId, name, url, { autoName: !name }); },
      });
    });
  }

  // ---------- Profile switching and colours ----------
  function hexToRgb(h) { const m = /^#?([0-9a-f]{6})$/i.exec(h || ''); if (!m) return [61, 127, 214]; const v = parseInt(m[1], 16); return [v >> 16, (v >> 8) & 255, v & 255]; }
  const luminance = h => { const [r2, g, b] = hexToRgb(h).map(x => { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }); return 0.2126 * r2 + 0.7152 * g + 0.0722 * b; };
  const darken = (h, k) => '#' + hexToRgb(h).map(x => Math.round(x * (1 - k)).toString(16).padStart(2, '0')).join('');
  const TINTS = { subtle: ['7%', '4%'], medium: ['14%', '7%'], bold: ['26%', '13%'] };
  function applyProfileTheme() {
    const p = activeProfile();
    const root = document.documentElement;
    root.classList.toggle('profiled', !!p);
    for (const v of ['--tint', '--tint-side', '--tint-bar', '--accent', '--accent-text']) root.style.removeProperty(v);
    if (p) {
      const [side, bar] = TINTS[p.tint] || TINTS.medium;
      root.style.setProperty('--tint', p.color);
      root.style.setProperty('--tint-side', side);
      root.style.setProperty('--tint-bar', bar);
      // Very light colours (like yellow) are darkened for text and icons so they stay readable.
      const accent = luminance(p.color) > 0.45 ? darken(p.color, 0.35) : p.color;
      root.style.setProperty('--accent', accent);
      root.style.setProperty('--accent-text', luminance(accent) > 0.5 ? '#000000' : '#ffffff');
    }
    const btn = $('profileBtn');
    btn.querySelector('.pname').textContent = p ? p.name : 'All Profiles';
    const dot = btn.querySelector('.pdot');
    dot.className = 'pdot' + (p ? '' : ' all');
    dot.style.background = p ? p.color : '';
    document.title = (p ? p.name + ' \u2013 ' : '') + 'Claude Navigator';
  }
  function setProfile(id, { quiet = false } = {}) {
    state.profileId = id && nodeOf(id) && nodeOf(id).profile ? id : null;
    ls.set('claudeNavigator.activeProfile', state.profileId || '');
    applyProfileTheme();
    // Stay where you are if it belongs to this profile; otherwise go to the profile's top level.
    if (state.loc.kind === 'folder' && state.loc.id && state.profileId && profileOf(state.loc.id) !== activeProfile()) {
      state.loc = { kind: 'folder', id: null };
      nav.hist[nav.pos] = state.loc;
    }
    if (state.loc.kind === 'folder' && state.loc.id === state.profileId && state.profileId) {
      state.loc = { kind: 'folder', id: null };
      nav.hist[nav.pos] = state.loc;
    }
    lastRevealed = null;
    renderAll();
    if (!quiet) toast(state.profileId ? `Profile: ${activeProfile().name}` : 'All Profiles');
  }
  function showProfileMenu(x, y) {
    const ap = activeProfile();
    showMenu(x, y, [
      { label: 'All Profiles', dot: 'all', checked: !ap, key: (isMac ? '\u2325\u2318' : 'Ctrl+Alt+') + '0', run: () => setProfile(null) },
      '-',
      ...profiles().map((p, i) => ({ label: p.name, dot: p.color, checked: ap === p, key: i < 9 ? (isMac ? '\u2325\u2318' : 'Ctrl+Alt+') + (i + 1) : undefined, run: () => setProfile(p.id) })),
      '-',
      { label: 'New Profile\u2026', run: () => openProfileDialog(null) },
      ap && { label: `Edit \u201c${ap.name}\u201d\u2026`, run: () => openProfileDialog(ap) },
      !ap && profiles().length > 0 && { label: 'Edit a Profile\u2026', run: () => showMenu(x, y, profiles().map(p => ({ label: p.name, dot: p.color, run: () => openProfileDialog(p) }))) },
    ]);
  }
  $('profileBtn').addEventListener('click', e => {
    const b = e.currentTarget.getBoundingClientRect();
    showProfileMenu(b.left, b.bottom + 4);
  });

  // New / edit profile dialog: name, colour (brand palette or any colour), tint strength, live preview.
  const pdlg = $('profileDlg');
  const pf = { editing: null, color: PROFILE_COLOURS[0], tint: 'medium' };
  function paintProfilePreview() {
    const [side, bar] = TINTS[pf.tint];
    $('pvSide').style.background = `color-mix(in srgb, ${pf.color} ${side}, var(--side))`;
    $('pvSide').textContent = $('profileName').value.trim() || 'Folders';
    $('pvBar').style.background = `color-mix(in srgb, ${pf.color} ${bar}, var(--win))`;
    $('pvTop').style.background = pf.color;
    $('profileSwatches').querySelectorAll('.swatch').forEach(b => b.classList.toggle('on', b.dataset.c.toLowerCase() === pf.color.toLowerCase()));
    $('profileTint').querySelectorAll('.tb').forEach(b => b.classList.toggle('on', b.dataset.tint === pf.tint));
    $('profileCustom').value = /^#[0-9a-f]{6}$/i.test(pf.color) ? pf.color : '#3d7fd6';
  }
  (() => {
    const sw = $('profileSwatches');
    for (const c of PROFILE_COLOURS) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'swatch';
      b.dataset.c = c;
      b.style.background = c;
      b.title = c;
      b.addEventListener('click', () => { pf.color = c; paintProfilePreview(); });
      sw.appendChild(b);
    }
    const custom = document.createElement('input');
    custom.type = 'color';
    custom.id = 'profileCustom';
    custom.title = 'Any colour';
    custom.addEventListener('input', () => { pf.color = custom.value; paintProfilePreview(); });
    sw.appendChild(custom);
    $('profileTint').addEventListener('click', e => { const b = e.target.closest('[data-tint]'); if (b) { pf.tint = b.dataset.tint; paintProfilePreview(); } });
    $('profileName').addEventListener('input', paintProfilePreview);
  })();
  function openProfileDialog(p) {
    pf.editing = p;
    pf.color = p ? p.color : PROFILE_COLOURS[profiles().length % PROFILE_COLOURS.length];
    pf.tint = p ? (p.tint || 'medium') : 'medium';
    $('profileDlgTitle').textContent = p ? `Edit \u201c${p.name}\u201d` : 'New Profile';
    $('profileName').value = p ? p.name : '';
    $('profileGroupsRow').hidden = !!p;
    $('profileDelete').hidden = !p;
    $('profileOk').textContent = p ? 'Save' : 'Create Profile';
    paintProfilePreview();
    pdlg.returnValue = '';
    pdlg.showModal();
    $('profileName').focus();
  }
  pdlg.addEventListener('close', () => {
    if (pdlg.returnValue !== 'ok') return;
    const name = $('profileName').value.trim();
    if (!name) return;
    snap();
    if (pf.editing) {
      Object.assign(pf.editing, { name, color: pf.color, tint: pf.tint });
      commit();
      applyProfileTheme();
    } else {
      const p = makeProfile(name, [], pf.color, $('profileGroups').checked);
      p.tint = pf.tint;
      state.tree.push(p);
      save();
      setProfile(p.id, { quiet: true });
      toast(`Created the ${name} profile`, true);
    }
  });
  $('profileDelete').addEventListener('click', () => {
    const p = pf.editing;
    if (!p) return;
    let c = 0;
    walk(p.children, () => c++);
    if (!confirm(`Delete the \u201c${p.name}\u201d profile${c ? ` and the ${c} item${c === 1 ? '' : 's'} in it` : ''}? You can undo this.`)) return;
    pdlg.close();
    snap();
    const l = locate(p.id);
    l.list.splice(l.index, 1);
    if (state.profileId === p.id) state.profileId = null;
    save();
    setProfile(state.profileId, { quiet: true });
    toast(`Deleted the ${p.name} profile`, true);
  });

  // ---------- Tooltips ----------
  // Any element with a title shows it after a short pause; once one is showing,
  // moving to the next shows it straight away, as on a Mac.
  const tipBox = document.createElement('div');
  tipBox.id = 'tip';
  tipBox.setAttribute('role', 'tooltip');
  document.body.appendChild(tipBox);
  let tipTimer = null, tipFor = null, tipHiddenAt = 0;
  function hideTip() {
    clearTimeout(tipTimer);
    if (tipBox.classList.contains('show')) tipHiddenAt = Date.now();
    tipBox.classList.remove('show');
    tipFor = null;
  }
  function placeTip(el) {
    if (!document.contains(el) || !el.dataset.tip) return;
    tipBox.textContent = el.dataset.tip;
    const r = el.getBoundingClientRect();
    tipBox.style.left = '0px';
    tipBox.style.top = '0px';
    const t = tipBox.getBoundingClientRect();
    let x = Math.min(Math.max(6, r.left + r.width / 2 - t.width / 2), innerWidth - t.width - 6);
    if (r.width > 260) x = Math.min(Math.max(6, lastMouseX + 8), innerWidth - t.width - 6);
    let y = r.bottom + 6;
    if (y + t.height > innerHeight - 6) y = r.top - t.height - 6;
    tipBox.style.left = x + 'px';
    tipBox.style.top = y + 'px';
    tipBox.classList.add('show');
  }
  let lastMouseX = 0;
  document.addEventListener('mousemove', e => { lastMouseX = e.clientX; }, { passive: true });
  document.addEventListener('mouseover', e => {
    const el = e.target.closest && e.target.closest('[title], [data-tip]');
    if (el === tipFor) return;
    hideTip();
    if (!el || menu.contains(el)) return;
    if (el.hasAttribute('title')) { el.dataset.tip = el.getAttribute('title'); el.removeAttribute('title'); }
    if (!el.dataset.tip) return;
    tipFor = el;
    tipTimer = setTimeout(() => placeTip(el), Date.now() - tipHiddenAt < 600 ? 0 : 550);
  });
  document.addEventListener('mouseleave', hideTip);
  ['mousedown', 'keydown', 'dragstart', 'wheel'].forEach(ev => document.addEventListener(ev, hideTip, true));
  addEventListener('blur', hideTip);

  // ---------- Toast ----------
  const toastEl = $('toast');
  let toastTimer = null;
  // toast(message), toast(message, true) for an Undo button, or toast(message, { label, run }).
  let toastAction = null;
  function toast(msg, action = null) {
    if (action === true) action = { label: 'Undo', run: undo };
    toastAction = action;
    $('toastMsg').textContent = msg;
    $('toastUndo').hidden = !action;
    if (action) $('toastUndo').textContent = action.label;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), action ? 6000 : 2600);
  }
  $('toastUndo').addEventListener('click', () => { toastEl.classList.remove('show'); if (toastAction) toastAction.run(); });

  // ---------- Resizable sidebar ----------
  const clampW = w => Math.max(180, Math.min(520, w));
  const setWidth = w => document.documentElement.style.setProperty('--side-w', clampW(w) + 'px');
  if (+ls.get(WIDTH_STORE)) setWidth(+ls.get(WIDTH_STORE));
  $('splitter').addEventListener('mousedown', e => {
    e.preventDefault();
    document.body.classList.add('resizing');
    const move = ev => setWidth(ev.clientX);
    const stop = ev => {
      document.body.classList.remove('resizing');
      removeEventListener('mousemove', move);
      removeEventListener('mouseup', stop);
      ls.set(WIDTH_STORE, String(clampW(ev.clientX)));
    };
    addEventListener('mousemove', move);
    addEventListener('mouseup', stop);
  });
  $('splitter').addEventListener('dblclick', () => { setWidth(240); ls.del(WIDTH_STORE); });

  let fitTimer = null;
  addEventListener('resize', () => {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(() => { if (!browseEl.hidden && browseEl.querySelector('.list')) renderMain(); }, 150);
  });

  addEventListener('storage', e => { if (e.key === STORE) { state.tree = load(); renderAll(); } });

  // ---------- Start where you left off ----------
  let start = isApp ? { kind: 'page', url: HOME } : { kind: 'folder', id: null };
  let startFolder = null;
  try {
    const s = JSON.parse(ls.get(LOC_STORE));
    if (s && s.loc && (s.loc.kind === 'folder' || (s.loc.kind === 'page' && isApp && s.loc.url))) {
      start = s.loc.kind === 'page' ? { kind: 'page', url: s.loc.url } : { kind: 'folder', id: s.loc.id || null };
      startFolder = s.lastFolderId && nodeOf(s.lastFolderId) ? s.lastFolderId : null;
    }
  } catch (e) { /* ignore */ }
  applyProfileTheme();
  repairGenericNames();
  renderSide();
  state.lastFolderId = startFolder;
  go(start);
  if (isApp) {
    setTimeout(() => refreshLibrary(false), 4000);
    setInterval(() => refreshLibrary(false), 10 * 60e3);
  }
})();
</script>
</body>
</html>
